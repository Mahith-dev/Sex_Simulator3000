 *  PICKUPS
 * ================================================================== */
function Pickup({ data }) {
  const groupRef = useRef(null);
  const collected = useRef(false);
  const def = PICKUP_DEFS[data.type];

  useFrame((state) => {
    if (collected.current) return;
    const t = state.clock.elapsedTime;
    if (groupRef.current) {
      groupRef.current.rotation.y = t * 1.8;
      groupRef.current.rotation.x = Math.sin(t * 1.3) * 0.4;
      groupRef.current.position.y = data.position[1] + Math.sin(t * 3 + (data.ph || 0)) * 0.14;
    }
    const p = data.position;
    const dx = playerState.position.x - p[0];
    const dy = playerState.position.y - p[1];
    const dz = playerState.position.z - p[2];
    if (dx * dx + dy * dy + dz * dz < 1.8 * 1.8) {
      collected.current = true;
      const g = useGame.getState();
      if (def.kind === 'damage') g.grantDamageBoost(def.duration);
      else if (def.kind === 'speed') g.grantSpeedBoost(def.duration);
      else if (data.type === 'health') g.heal(def.amount);
      else g.giveAmmo(def.amount);
      g.showPickupToast(def.label, def.kind || data.type);
      g.addExplosion([p[0], p[1], p[2]], def.color, 0.5, false);
      g.removePickup(data.id);
    }
  });

  return (
    <group ref={groupRef} position={data.position}>
      <mesh>
        <octahedronGeometry args={[0.32, 0]} />
        <meshBasicMaterial color={def.color} toneMapped={false} />
      </mesh>
      <mesh scale={1.4}>
        <octahedronGeometry args={[0.32, 0]} />
        <meshBasicMaterial color={def.wire} wireframe toneMapped={false} transparent opacity={0.9} />
      </mesh>
    </group>
  );
}

function PickupField() {
  const pickups = useGame((s) => s.pickups);
  return <group>{pickups.map((p) => <Pickup key={p.id} data={p} />)}</group>;
}

/* ==================================================================
 *  DAMAGE NUMBERS
 * ================================================================== */
const damageTexCache = new Map();
function getDamageTexture(text, color) {
  const key = text + '|' + color;
  if (damageTexCache.has(key)) return damageTexCache.get(key);
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 96);
  ctx.font = '900 60px "Orbitron", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.fillText(text, 128, 48);
  ctx.fillText(text, 128, 48);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  damageTexCache.set(key, tex);
  return tex;
}

const DAMAGE_LIFETIME = 0.85;

function DamageNumber({ data }) {
  const ref = useRef(null);
  const life = useRef(0);
  const remove = useGame((s) => s.removeDamageNumber);
  const tex = useMemo(() => getDamageTexture(data.text, data.color), [data.text, data.color]);
  const velY = useRef(1.4 + Math.random() * 0.5);
  const velX = useRef((Math.random() - 0.5) * 0.6);

  useFrame((_, dt) => {
    life.current += dt;
    const t = life.current / DAMAGE_LIFETIME;
    if (ref.current) {
      ref.current.position.x = data.position[0] + velX.current * life.current;
      ref.current.position.y = data.position[1] + velY.current * life.current - 0.4 * life.current * life.current;
      ref.current.position.z = data.position[2];
      ref.current.material.opacity = Math.max(0, 1 - t * t);
      const s = 1 + (1 - Math.min(1, t * 2)) * 0.3;
      ref.current.scale.set(s * 1.2, s * 0.45, 1);
    }
    if (t >= 1) remove(data.id);
  });

  return (
    <sprite ref={ref} position={data.position} renderOrder={100}>
      <spriteMaterial map={tex} transparent depthWrite={false} depthTest={false} toneMapped={false} blending={THREE.AdditiveBlending} />
    </sprite>
  );
}

function DamageNumbers() {
  const numbers = useGame((s) => s.damageNumbers);
  return <group>{numbers.map((n) => <DamageNumber key={n.id} data={n} />)}</group>;
}

/* ==================================================================
 *  PROJECTILES / VFX
 * ================================================================== */
const TRACER_LIFE = 0.11;
const EXPLOSION_LIFE = 0.5;

function Tracer({ data }) {
  const coreRef = useRef(null);
  const glowRef = useRef(null);
  const life = useRef(0);
  const removeTracer = useGame((s) => s.removeTracer);

  const segs = useMemo(() => {
    if (!data.beam) return null;
    const a = new THREE.Vector3().fromArray(data.from), b = new THREE.Vector3().fromArray(data.to);
    const d = new THREE.Vector3().subVectors(b, a); const L = Math.max(0.1, d.length()); d.normalize();
    const up = Math.abs(d.y) > 0.95 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const p1 = new THREE.Vector3().crossVectors(d, up).normalize();
    const p2 = new THREE.Vector3().crossVectors(d, p1);
    const N = Math.max(6, Math.min(22, Math.round(L / 2.5)));
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const env = Math.sin(Math.PI * i / N) * 0.32;
      pts.push(a.clone().addScaledVector(d, L * i / N)
        .addScaledVector(p1, (Math.random() - 0.5) * 2 * env)
        .addScaledVector(p2, (Math.random() - 0.5) * 2 * env));
    }
    return pts.slice(1).map((p, i) => {
      const q0 = pts[i], v = new THREE.Vector3().subVectors(p, q0);
      return {
        mid: q0.clone().add(p).multiplyScalar(0.5),
        len: Math.max(0.01, v.length()),
        quat: new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), v.normalize()),
      };
    });
  }, [data]);

  const { mid, quat, length } = useMemo(() => {
    const from = new THREE.Vector3(data.from[0], data.from[1], data.from[2]);
    const to = new THREE.Vector3(data.to[0], data.to[1], data.to[2]);
    const dir = new THREE.Vector3().subVectors(to, from);
    const len = Math.max(0.01, dir.length());
    const midpoint = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.normalize());
    return { mid: midpoint, quat: q, length: len };
  }, [data]);

  const color = data.color || '#8df6ff';

  useFrame((_, dt) => {
    life.current += dt;
    const k = Math.max(0, 1 - life.current / TRACER_LIFE);
    if (coreRef.current) coreRef.current.material.opacity = k;
    if (glowRef.current) {
      glowRef.current.material.opacity = k * 0.55;
      const s = 1 + (1 - k) * 2.2;
      glowRef.current.scale.set(s, s, 1);
    }
    if (life.current >= (data.beam ? 0.07 : TRACER_LIFE)) removeTracer(data.id);
  });

  if (segs) return (
    <group>
      {segs.map((s, i) => (
        <group key={i} position={s.mid} quaternion={s.quat}>
          <mesh frustumCulled={false}><boxGeometry args={[0.05, 0.05, s.len]} /><meshBasicMaterial color="#ffffff" toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
          <mesh frustumCulled={false}><boxGeometry args={[0.22, 0.22, s.len]} /><meshBasicMaterial color="#5ce6ff" transparent opacity={0.45} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
        </group>
      ))}
    </group>
  );

  return (
    <group position={mid} quaternion={quat}>
      <mesh ref={coreRef} frustumCulled={false}>
        <boxGeometry args={[0.03, 0.03, length]} />
        <meshBasicMaterial color="#ffffff" transparent opacity={1} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
      <mesh ref={glowRef} frustumCulled={false}>
        <boxGeometry args={[0.1, 0.1, length]} />
        <meshBasicMaterial color={color} transparent opacity={0.55} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
    </group>
  );
}

function Explosion({ data }) {
  const shellRef = useRef(null);
  const ringRef = useRef(null);
  const life = useRef(0);
  const removeExplosion = useGame((s) => s.removeExplosion);

  useFrame((_, dt) => {
    life.current += dt;
    const t = Math.min(1, life.current / EXPLOSION_LIFE);
    const fade = 1 - t;
    if (shellRef.current) {
      shellRef.current.scale.setScalar(data.size * (0.35 + t * 2.2));
      shellRef.current.material.opacity = fade * fade * 0.95;
    }
    if (ringRef.current) {
      const rs = data.size * (0.4 + t * 3.6);
      ringRef.current.scale.set(rs, 1, rs);
      ringRef.current.material.opacity = fade * 0.9;
    }
    if (t >= 1) removeExplosion(data.id);
  });

  return (
    <group position={data.position}>
      <mesh ref={shellRef}>
        <icosahedronGeometry args={[1, 0]} />
        <meshBasicMaterial color={data.color} wireframe transparent opacity={0.95} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
      {data.ring && (
        <mesh ref={ringRef} rotation={[-Math.PI / 2, 0, 0]}>
          <torusGeometry args={[1, 0.055, 6, 24]} />
          <meshBasicMaterial color={data.color} transparent opacity={0.9} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
        </mesh>
      )}
    </group>
  );
}

function Projectiles() {

/* ==================================================================
 *  PERFORMANCE GOVERNOR
 * ================================================================== */
function PerfGovernor({ onFps }) {
  const setDpr = useThree((s) => s.setDpr);
  const quality = useSettings((s) => s.quality);
  const perfRef = useRef({ frames: 0, time: 0, dpr: 1.0, lowStreak: 0 });

  /* Apply quality tier to base DPR. */
  useEffect(() => {
    const target = quality === 'low' ? 0.75 : quality === 'medium' ? 1.0 : 1.25;
    perfRef.current.dpr = target;
    setDpr(target);
  }, [quality, setDpr]);

  useFrame((_, dt) => {
    const p = perfRef.current;
    p.frames++;
    p.time += dt;
    if (p.time >= 1.5) {
      const fps = p.frames / p.time;
      onFps && onFps(Math.round(fps));

      const cap = quality === 'low' ? 0.75 : quality === 'medium' ? 1.0 : 1.25;

      if (fps < 42 && p.dpr > 0.7) {
        p.dpr = Math.max(0.7, p.dpr - 0.2);
        setDpr(p.dpr);
      } else if (fps > 56 && p.dpr < cap) {
        p.dpr = Math.min(cap, p.dpr + 0.1);
        setDpr(p.dpr);
      }
      p.frames = 0;
      p.time = 0;
    }
  });
  return null;
}

function Hud({ fps, onOpenSettings }) {
  const health = useGame((s) => s.health);
  const maxHealth = useGame((s) => s.maxHealth);
  const activeWeapon = useGame((s) => s.activeWeapon);
  const ammo = useGame((s) => s.ammo);
  const reloading = useGame((s) => s.reloading);
  const ads = useGame((s) => s.ads);
  const score = useGame((s) => s.score);
  const wave = useGame((s) => s.wave);
  const kills = useGame((s) => s.kills);
  const alive = useGame((s) => s.enemies.length);
  const hitMarker = useGame((s) => s.hitMarker);
  const damageStamp = useGame((s) => s.damageStamp);
  const startedAt = useGame((s) => s.startedAt);
  const showFps = useSettings((s) => s.showFps);
  const wpn = WEAPONS[activeWeapon];

  const [now, setNow] = useState(() => performance.now());
  useEffect(() => {
    const id = setInterval(() => setNow(performance.now()), 250);
    return () => clearInterval(id);
  }, []);

  const elapsed = Math.max(0, (now - startedAt) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(Math.floor(elapsed % 60)).padStart(2, '0');
  const hpPct = Math.max(0, Math.min(100, (health / maxHealth) * 100));

  return (

      <StreakFlash />
      <PickupToast />

      <BossBar />
      <BoostRow />
      {showFps && fps > 0 && <div className="fps-meter">{fps} FPS</div>}

      <div className="panel top-right">
        <div className="big">{score.toLocaleString()}</div>
        <div className="row">SCORE</div>
        <div className="row dim">KILLS {kills} · HOSTILES {alive}</div>
      </div>

      <div className="panel top-left" style={{ left: 100 }}>
        <div className="big">{mm}:{ss}</div>
        <div className="row">SURVIVED</div>
      </div>

      <div className={'health' + (low ? ' low' : '')}>
        <div className="label">INTEGRITY</div>
        <div className="track"><div className="fill" style={{ width: hpPct + '%' }} /></div>
        <div className="hpnum">{Math.ceil(health)}</div>
      </div>

      <div className="wpn-slots">
        {WEAPONS.map((w, i) => (
          <div key={i} className={'wpn-slot' + (i === activeWeapon ? ' active' : '')}>{i + 1} · {w.name}</div>

      <div className="ammo">

          : ammo === 0

            : <div className="reloading dim">{ads ? 'ADS' : wpn.name}</div>}
      </div>

      {wave > 1 && (
        <div key={wave} className={'wave-banner' + (isBossWave ? ' boss-wave' : '')}>
          {isBossWave ? `BOSS WAVE ${wave}` : `WAVE ${wave}`}
          <span className="sub">{isBossWave ? 'ELIMINATE THE ELITE' : 'HOSTILES INBOUND'}</span>
        </div>
      )}
      {damageStamp > 0 && <div key={damageStamp} className="damage-flash" />}
      {low && <div className="low-hp-vignette" />}
    </div>
  );

        <input type="range" min={min} max={max} step={step} value={value} onChange={(e) => onChange(Number(e.target.value))} />
        <div className="val">{format ? format(value) : value}</div>
      </div>
    </div>
  );
}
function SettingSeg({ label, value, options, onChange }) {
  return (
    <div className="setting-row">
      <div className="lbl">{label}</div>
      <div className="seg">
        {options.map((o) => (
          <button key={o} className={value === o ? 'active' : ''} onClick={() => onChange(o)}>{o.toUpperCase()}</button>
        ))}
      </div>
    </div>
  );
}
function SettingToggle({ label, value, onChange }) {
  return (
    <div className="setting-row">
      <div className="lbl">{label}</div>
      <div className="seg">
        <button className={value ? 'active' : ''} onClick={() => onChange(true)}>ON</button>
        <button className={!value ? 'active' : ''} onClick={() => onChange(false)}>OFF</button>
      </div>
    </div>
  );
}

function SettingsPanel({ onClose }) {
  const settings = useSettings();
  return (
    <div className="screen" onClick={(e) => e.stopPropagation()}>
      <div className="scanlines" />
      <h2 className="subtitle">SETTINGS</h2>
      <div className="settings-panel">
        <SettingSlider
          label="MOUSE SENSITIVITY"
          value={settings.sensitivity}
          min={0.2} max={3.0} step={0.05}
          onChange={(v) => settings.update({ sensitivity: v })}
          format={(v) => v.toFixed(2) + '×'}
        />
        <SettingSlider
          label="FIELD OF VIEW"
          value={settings.fov}
          min={60} max={110} step={1}
          onChange={(v) => settings.update({ fov: v })}
          format={(v) => v + '°'}
        />
        <SettingSeg
          label="GRAPHICS QUALITY"
          value={settings.quality}
          options={['low', 'medium', 'high']}
          onChange={(v) => settings.update({ quality: v })}
        />
        <SettingToggle
          label="SCREEN SHAKE"
          value={settings.screenShake}
          onChange={(v) => settings.update({ screenShake: v })}
        />
        <SettingToggle
          label="SHOW FPS"
          value={settings.showFps}
          onChange={(v) => settings.update({ showFps: v })}
        />
      </div>
      <button className="btn" onClick={onClose}>BACK</button>
    </div>
  );
}

function Menu({ onOpenSettings }) {
  const start = () => {
    useGame.getState().startGame();
    requestGamePointerLock();
  };
  return (
    <div className="screen menu">
      <div className="scanlines" />
      <h1 className="title">NEON<span>SWARM</span></h1>
      <p className="tagline">ARENA SURVIVAL PROTOCOL // v2.0</p>
      <div className="controls">
        <div><kbd>W A S D</kbd><span>MOVE</span></div>
        <div><kbd>MOUSE</kbd><span>LOOK</span></div>
        <div><kbd>LMB</kbd><span>FIRE</span></div>
        <div><kbd>RMB</kbd><span>AIM DOWN SIGHTS</span></div>
        <div><kbd>SHIFT</kbd><span>SPRINT</span></div>
        <div><kbd>SPACE</kbd><span>JUMP</span></div>
        <div><kbd>E</kbd><span>DASH</span></div>
        <div><kbd>C</kbd><span>SLIDE</span></div>
        <div><kbd>1 2 3</kbd><span>SWITCH WEAPON</span></div>
        <div><kbd>R</kbd><span>RELOAD</span></div>
        <div><kbd>ESC</kbd><span>MENU</span></div>
      </div>
      <div className="btn-row">
        <button className="btn" onClick={start}>INITIALISE</button>
        <button className="btn ghost" onClick={onOpenSettings}>SETTINGS</button>
      </div>
      <p className="hint">Boss waves every 5. Boost orbs drop from tough kills.</p>
    </div>
  );
}

function Pause({ onOpenSettings }) {
  const players = usePlayersList();
  const soloPlay = players.length <= 1;
  return (
    <div className={'screen' + (soloPlay ? '' : ' soft')}>
      <div className="scanlines" />
      <h2 className="subtitle">PAUSED</h2>
      {!soloPlay && (
        <p className="tagline" style={{ maxWidth: 500, textAlign: 'center' }}>
          The battle continues — you're still vulnerable while paused.
        </p>
      )}
      <div className="btn-row">
        <button className="btn" onClick={() => requestGamePointerLock()}>RESUME</button>
        <button className="btn ghost" onClick={onOpenSettings}>SETTINGS</button>
        <button className="btn ghost" onClick={() => useGame.getState().backToMenu()}>ABANDON</button>
      </div>
    </div>
  );
}

function GameOver() {
  const score = useGame((s) => s.score);
  const kills = useGame((s) => s.kills);
  const wave = useGame((s) => s.wave);
  const startedAt = useGame((s) => s.startedAt);
  const endedAt = useGame((s) => s.endedAt);
  const total = Math.max(0, (endedAt - startedAt) / 1000);
  const mm = String(Math.floor(total / 60)).padStart(2, '0');
  const ss = String(Math.floor(total % 60)).padStart(2, '0');
  const retry = () => { useGame.getState().startGame(); requestGamePointerLock(); };
  return (
    <div className="screen gameover">
      <div className="scanlines" />
      <h2 className="subtitle red">SYSTEM FAILURE</h2>
      <p className="tagline">ALL VITAL SIGNS LOST</p>
      <div className="scoreboard">
        <div className="stat"><div className="v">{score.toLocaleString()}</div><div className="k">FINAL SCORE</div></div>
        <div className="stat"><div className="v">{kills}</div><div className="k">ELIMINATIONS</div></div>
        <div className="stat"><div className="v">{wave}</div><div className="k">WAVE REACHED</div></div>
        <div className="stat"><div className="v">{mm}:{ss}</div><div className="k">TIME SURVIVED</div></div>
      </div>
      <div className="btn-row">
        <button className="btn" onClick={retry}>RE-DEPLOY</button>
        <button className="btn ghost" onClick={() => useGame.getState().backToMenu()}>MAIN MENU</button>
      </div>
    </div>
  );
}

function UI({ fps }) {
  const status = useGame((s) => s.status);
  const [settingsOpen, setSettingsOpen] = useState(false);
  const openSettings = () => setSettingsOpen(true);
  const closeSettings = () => setSettingsOpen(false);

  /* When settings are open, we show them on top of whatever else is showing. */
  const showHud = (status === 'PLAYING');

  return (
    <div className="overlay">
      {showHud && !settingsOpen && <Hud fps={fps} onOpenSettings={openSettings} />}
      {status === 'MENU' && !settingsOpen && <Menu onOpenSettings={openSettings} />}
      {status === 'PLAYING' && !settingsOpen && (
        /* In multiplayer, "pause" is just a soft overlay shown when pointer lock is released. */
        <SoftPause onOpenSettings={openSettings} />
      )}
      {status === 'GAME_OVER' && !settingsOpen && <GameOver />}
      {settingsOpen && <SettingsPanel onClose={closeSettings} />}
    </div>
  );
}

/* Detects pointer-lock release and shows the pause overlay without stopping the world. */
function SoftPause({ onOpenSettings }) {
  const [locked, setLocked] = useState(true);
  const status = useGame((s) => s.status);
  useEffect(() => {
    const handler = () => setLocked(!!document.pointerLockElement);
    document.addEventListener('pointerlockchange', handler);
    handler();
    return () => document.removeEventListener('pointerlockchange', handler);
  }, []);
  if (status !== 'PLAYING' || locked) return null;
  return <Pause onOpenSettings={onOpenSettings} />;
}

/* ==================================================================
 *  GAME
 * ================================================================== */
function Game() {
  const [fps, setFps] = useState(0);
  const quality = useSettings((s) => s.quality);
  const dpr = quality === 'low' ? 0.8 : quality === 'medium' ? 1.05 : 1.25;

  return (
    <div className="game-root">
      <Canvas
        dpr={dpr}
        shadows={false}
        gl={{ antialias: false, powerPreference: 'high-performance', stencil: false, depth: true, alpha: false }}
        camera={{ fov: 78, near: 0.05, far: 400, position: [0, 2, 6] }}
        onCreated={({ gl }) => { gl.setClearColor('#05060a', 1); }}
      >
        <color attach="background" args={['#05060a']} />
        {quality !== 'low' && <fog attach="fog" args={['#05060a', 40, 160]} />}

        <ambientLight intensity={0.5} color="#8fd8ff" />
        <hemisphereLight args={['#2b8fd8', '#120018', 0.7]} />
        <directionalLight position={[20, 30, 10]} intensity={0.55} color="#9fd8ff" />
        <pointLight position={[0, 16, 0]} intensity={2.6} distance={90} color="#1f7fff" />

        <PerfGovernor onFps={setFps} />

        <Suspense fallback={null}>
          <Physics gravity={[0, GRAVITY, 0]} timeStep={1 / 60} colliders="cuboid">
            <Arena />
            <Player />
            <RemotePlayers />
            <EnemyManager />
          </Physics>
        </Suspense>

        <PickupField />
        <Projectiles />
        <DamageNumbers />
      </Canvas>

      <UI fps={fps} />
    </div>
  );
}

/* ==================================================================
 *  BOOT
 * ================================================================== */
const boot = document.getElementById('boot');
if (boot) {
  boot.classList.add('hide');
  setTimeout(() => boot.remove(), 600);
}

const root = createRoot(document.getElementById('root'));
insertCoin({ skipLobby: false }).then(() => {
  root.render(<Game />);
}).catch((e) => { console.error(e); root.render(<Game />); });

</script>

<script>
window.addEventListener('error', (e) => {
  if (document.querySelector('.err')) return;
  const d = document.createElement('div');
  d.className = 'err';
  d.textContent = 'NEON SWARM failed to start.\n\n' + (e.message || e.error || 'Unknown error') +
    '\n\nThis game needs an internet connection the first time it loads (CDNs for React / Three / Rapier).';
  document.body.appendChild(d);
});
</script>

</body>
</html>
