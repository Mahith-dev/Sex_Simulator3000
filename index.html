<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON SWARM - MULTIPLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<style>
:root{
  --cyan:#35e6ff; --cyan-soft:#9df3ff; --magenta:#ff2bd6;
  --red:#ff3355; --amber:#ffb020; --green:#22ff88; --bg:#05060a;
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-display);color:#dff6ff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{display:block;touch-action:none}
.game-root{position:fixed;inset:0}

#boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#05060a;color:#9df3ff;font-family:var(--font-mono);letter-spacing:6px;font-size:13px;transition:opacity .5s ease}
#boot.hide{opacity:0;pointer-events:none}
#boot .bar{width:260px;height:3px;background:rgba(53,230,255,.15);overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

.overlay{position:fixed;inset:0;pointer-events:none;user-select:none;z-index:10}
.hud{position:absolute;inset:0;pointer-events:none}

.crosshair{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);transition:opacity .12s ease, transform .12s ease}
.crosshair.ads{opacity:.4;transform:translate(-50%,-50%) scale(.7)}
.ch{position:absolute;background:var(--cyan-soft);box-shadow:0 0 5px var(--cyan),0 0 12px rgba(53,230,255,.75);transition:all .08s ease}
.ch.t{left:50%;top:0;width:2px;height:10px;transform:translateX(-50%)}
.ch.b{left:50%;bottom:0;width:2px;height:10px;transform:translateX(-50%)}
.ch.l{top:50%;left:0;height:2px;width:10px;transform:translateY(-50%)}
.ch.r{top:50%;right:0;height:2px;width:10px;transform:translateY(-50%)}
.ch.dot{left:50%;top:50%;width:3px;height:3px;border-radius:50%;transform:translate(-50%,-50%);background:#fff}

.hitmarker{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);animation:hitpop .28s cubic-bezier(.2,.9,.3,1.4) forwards}
.hitmarker i{position:absolute;left:50%;top:50%;width:3px;height:14px;background:#fff;box-shadow:0 0 8px #fff,0 0 16px var(--cyan);transform:translate(calc(var(--x)*11px - 50%),calc(var(--y)*11px - 50%)) rotate(calc(var(--x)*45deg))}
.hitmarker.kill i{background:var(--red);box-shadow:0 0 12px var(--red),0 0 24px var(--red);width:4px;height:16px}
@keyframes hitpop{0%{opacity:1;scale:1.6}60%{opacity:1;scale:1.05}100%{opacity:0;scale:.95}}

.combo{position:absolute;left:50%;top:calc(50% + 66px);transform:translateX(-50%);font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:3px;color:var(--magenta);text-shadow:0 0 18px rgba(255,43,214,.9),0 0 40px rgba(255,43,214,.5);animation:comboin .3s cubic-bezier(.2,.9,.3,1.4)}
.combo span{font-family:var(--font-mono);font-size:11px;letter-spacing:5px;opacity:.7;margin-left:8px;font-weight:400;color:#fff;text-shadow:none}
.combo.tier-2{color:#ffb020;text-shadow:0 0 18px rgba(255,176,32,.9),0 0 40px rgba(255,176,32,.5)}
.combo.tier-3{color:#35e6ff;text-shadow:0 0 18px rgba(53,230,255,.9),0 0 40px rgba(53,230,255,.5)}
.combo.tier-4{color:#ff3355;text-shadow:0 0 22px rgba(255,51,85,.95),0 0 50px rgba(255,51,85,.6);font-size:28px}
@keyframes comboin{0%{opacity:0;transform:translateX(-50%) scale(1.4)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

.streak-flash{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--font-display);font-size:52px;font-weight:900;letter-spacing:14px;color:#fff;text-shadow:0 0 30px var(--cyan),0 0 60px var(--magenta);animation:streakin 1.6s ease-out forwards;pointer-events:none;text-align:center}
@keyframes streakin{0%{opacity:0;transform:translateX(-50%) scale(1.6)}15%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.95)}}

.kill-feed{position:absolute;right:34px;top:110px;display:flex;flex-direction:column;gap:4px;pointer-events:none;align-items:flex-end}
.kill-line{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--cyan-soft);background:rgba(6,16,26,.72);border-left:2px solid var(--cyan);padding:5px 12px;animation:kf-in .35s ease-out;text-shadow:0 0 8px rgba(53,230,255,.6);white-space:nowrap}
.kill-line.wraith{border-color:#b028ff;color:#e0b0ff;text-shadow:0 0 8px rgba(176,40,255,.7)}
.kill-line.brute{border-color:#ff8c00;color:#ffd28a;text-shadow:0 0 8px rgba(255,140,0,.7)}
.kill-line.multikill{border-color:var(--magenta);color:#ffb0ec;background:rgba(26,6,20,.75);animation:kf-in .35s ease-out, kf-glow .8s ease-out}
@keyframes kf-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes kf-glow{0%{box-shadow:0 0 0 rgba(255,43,214,0)}40%{box-shadow:0 0 24px rgba(255,43,214,.9)}100%{box-shadow:0 0 0 rgba(255,43,214,0)}}

.panel{position:absolute;font-family:var(--font-mono)}
.top-left{top:26px;left:34px}
.top-right{top:26px;right:34px;text-align:right}
.panel .big{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:2px;line-height:1;text-shadow:0 0 18px rgba(53,230,255,.65)}
.top-right .big{color:var(--cyan-soft)}
.panel .row{font-size:11px;letter-spacing:4px;opacity:.65;margin-top:6px}
.panel .row.dim{opacity:.42;font-size:10px;letter-spacing:2px}

.health{position:absolute;left:34px;bottom:32px;width:280px}
.health .label{font-family:var(--font-mono);font-size:11px;letter-spacing:4px;opacity:.65;margin-bottom:7px}
.health .track{position:relative;height:15px;background:rgba(10,30,45,.72);border:1px solid rgba(80,220,255,.35);transform:skewX(-20deg);overflow:hidden}
.health .fill{height:100%;background:linear-gradient(90deg,#00ffc8,var(--cyan));box-shadow:0 0 18px rgba(53,230,255,.9);transition:width .2s ease-out,background .3s ease}
.health.low .fill{background:linear-gradient(90deg,var(--red),#ff7a3d);box-shadow:0 0 20px rgba(255,51,85,.95)}
.health .hpnum{margin-top:5px;font-family:var(--font-mono);font-size:12px;letter-spacing:2px;opacity:.6}

.ammo{position:absolute;right:34px;bottom:28px;text-align:right}
.ammo .num{font-size:52px;font-weight:900;line-height:1;letter-spacing:1px;text-shadow:0 0 22px rgba(53,230,255,.8);transition:color .15s ease}
.ammo .num.empty{color:var(--red);text-shadow:0 0 22px rgba(255,51,85,.95);animation:num-blink .7s ease-in-out infinite}
@keyframes num-blink{0%,100%{opacity:1}50%{opacity:.35}}
.ammo .res{font-size:17px;font-weight:500;opacity:.5;margin-left:8px}
.ammo .reloading{font-family:var(--font-mono);font-size:12px;letter-spacing:4px;color:var(--amber);margin-top:6px;text-shadow:0 0 14px rgba(255,176,32,.8)}
.ammo .reloading.warn{color:var(--red);text-shadow:0 0 14px rgba(255,51,85,.9);animation:blink .9s ease-in-out infinite}
.ammo .reloading.dim{color:rgba(180,230,255,.45);text-shadow:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.pickup-toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-family:var(--font-mono);font-size:14px;letter-spacing:4px;color:var(--green);text-shadow:0 0 14px rgba(34,255,136,.9);animation:toastup 1.2s ease-out forwards;pointer-events:none}
.pickup-toast.ammo{color:var(--cyan);text-shadow:0 0 14px rgba(53,230,255,.9)}
@keyframes toastup{0%{opacity:0;transform:translate(-50%,20px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}

.wave-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:42px;font-weight:900;letter-spacing:14px;color:var(--magenta);text-shadow:0 0 26px rgba(255,43,214,.9),0 0 60px rgba(255,43,214,.5);animation:wavein 2.4s ease-out forwards;pointer-events:none}
@keyframes wavein{0%{opacity:0;transform:translateX(-50%) scale(1.4)}15%{opacity:1;transform:translateX(-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.98)}}

.damage-flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 30%,rgba(255,0,40,.62) 100%);animation:dmgfade .55s ease-out forwards;pointer-events:none}
@keyframes dmgfade{from{opacity:1}to{opacity:0}}
.low-hp-vignette{position:absolute;inset:0;box-shadow:inset 0 0 190px rgba(255,0,50,.6);animation:pulse 1.15s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:auto;background:radial-gradient(ellipse at 50% 40%,rgba(10,40,70,.55) 0%,rgba(3,5,12,.94) 70%),rgba(3,5,12,.82);backdrop-filter:blur(3px);animation:screenin .35s ease-out}
@keyframes screenin{from{opacity:0}to{opacity:1}}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(120,220,255,.045) 0px,rgba(120,220,255,.045) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
.title{margin:0;font-size:clamp(42px,8vw,96px);font-weight:900;letter-spacing:12px;color:var(--cyan-soft);text-shadow:0 0 28px rgba(53,230,255,.85),0 0 80px rgba(53,230,255,.45);animation:title-pulse 3.4s ease-in-out infinite}
@keyframes title-pulse{0%,100%{text-shadow:0 0 28px rgba(53,230,255,.85),0 0 80px rgba(53,230,255,.45)}50%{text-shadow:0 0 40px rgba(53,230,255,1),0 0 110px rgba(53,230,255,.7)}}
.title span{color:var(--magenta);text-shadow:0 0 28px rgba(255,43,214,.9),0 0 80px rgba(255,43,214,.5)}
.subtitle{margin:0;font-size:clamp(30px,5vw,58px);font-weight:900;letter-spacing:10px;color:var(--cyan-soft);text-shadow:0 0 26px rgba(53,230,255,.8)}
.subtitle.red{color:#ff5c78;text-shadow:0 0 30px rgba(255,51,85,.95),0 0 80px rgba(255,51,85,.5);animation:glitch 2.6s ease-in-out infinite}
@keyframes glitch{0%,92%,100%{transform:translateX(0)}93%{transform:translateX(-4px)}95%{transform:translateX(5px)}97%{transform:translateX(-2px)}}
.tagline{margin:0;font-family:var(--font-mono);font-size:13px;letter-spacing:6px;opacity:.55;text-transform:uppercase}
.controls{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:8px 42px;margin:18px 0 10px;padding:20px 34px;border-top:1px solid rgba(53,230,255,.25);border-bottom:1px solid rgba(53,230,255,.25);background:rgba(8,22,36,.4)}
.controls div{display:flex;align-items:center;justify-content:space-between;gap:18px}
.controls kbd{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;padding:4px 10px;border:1px solid rgba(53,230,255,.45);border-radius:3px;background:rgba(53,230,255,.08);color:var(--cyan-soft);white-space:nowrap}
.controls span{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;opacity:.6}
.scoreboard{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:26px;margin:20px 0 14px;padding:22px 34px;border:1px solid rgba(53,230,255,.22);background:rgba(8,22,36,.45)}
.scoreboard .stat{text-align:center}
.scoreboard .v{font-size:34px;font-weight:900;color:var(--cyan-soft);text-shadow:0 0 22px rgba(53,230,255,.7)}
.scoreboard .k{margin-top:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:3px;opacity:.55}
.btn{pointer-events:auto;cursor:pointer;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:7px;color:var(--cyan-soft);padding:16px 62px;border:1px solid var(--cyan);background:rgba(53,230,255,.07);transition:all .16s ease;text-transform:uppercase}
.btn:hover{background:var(--cyan);color:#04121a;box-shadow:0 0 34px rgba(53,230,255,.85);letter-spacing:9px}
.btn:active{transform:translateY(1px)}
.btn.ghost{font-size:12px;padding:10px 34px;letter-spacing:4px;border-color:rgba(53,230,255,.35);background:transparent;color:rgba(180,235,255,.7)}
.btn.ghost:hover{background:rgba(53,230,255,.14);color:var(--cyan-soft);box-shadow:none;letter-spacing:5px}
.hint{position:absolute;bottom:34px;margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:3px;opacity:.35}
.err{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px;background:#0a0206;color:#ff8fa3;font-family:var(--font-mono);font-size:13px;line-height:1.7;white-space:pre-wrap;overflow:auto;text-align:center}

.fps-meter{position:absolute;left:34px;top:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:2px;opacity:.35;color:var(--cyan-soft)}

@media (max-width:760px){
  .controls{grid-template-columns:1fr;gap:6px}
  .scoreboard{grid-template-columns:repeat(2,1fr)}
  .ammo .num{font-size:38px}
  .health{width:190px}
  .kill-feed{top:100px;font-size:10px}
}

.settings{z-index:20;overflow:auto;padding:24px}
.sbox{width:min(680px,94vw);padding:22px 30px;border:1px solid rgba(53,230,255,.3);background:rgba(6,14,24,.94);font-family:var(--font-mono)}
.sbox h3{margin:18px 0 6px;font-family:var(--font-display);letter-spacing:6px;font-size:13px;color:var(--magenta)}
.srow{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:7px 0;border-bottom:1px solid rgba(53,230,255,.1);font-size:12px;letter-spacing:2px}
.srow>div{display:flex;align-items:center;gap:8px}
.srow input[type=range]{width:210px;accent-color:#35e6ff}
.sval{min-width:46px;text-align:right;color:var(--cyan-soft)}
.tog,.chip{font-family:var(--font-mono);cursor:pointer;padding:5px 13px;border:1px solid rgba(53,230,255,.4);background:transparent;color:var(--cyan-soft);letter-spacing:2px;font-size:11px}
.tog.on,.chip.on{background:var(--cyan);color:#04121a}

/* ---- v7: powerups, buffs, streaks, time warp ---- */
.notify{position:absolute;left:50%;top:30%;transform:translateX(-50%);text-align:center;pointer-events:none;animation:notifyin 2.4s ease-out forwards;white-space:nowrap}
.notify b{display:block;font-family:var(--font-display);font-size:clamp(20px,3.2vw,34px);font-weight:900;letter-spacing:10px;color:var(--nc);text-shadow:0 0 22px var(--nc),0 0 52px var(--nc)}
.notify span{display:block;margin-top:8px;font-family:var(--font-mono);font-size:12px;letter-spacing:4px;color:#dff6ff;opacity:.85}
@keyframes notifyin{0%{opacity:0;transform:translateX(-50%) scale(1.5)}10%{opacity:1;transform:translateX(-50%) scale(1)}78%{opacity:1}100%{opacity:0;transform:translateX(-50%) translateY(-14px)}}
.wave-banner small{display:block;margin-top:10px;font-family:var(--font-mono);font-size:12px;font-weight:400;letter-spacing:6px;color:#9df3ff;text-shadow:0 0 14px rgba(53,230,255,.8);text-align:center}
.buffs{position:absolute;left:50%;bottom:30px;transform:translateX(-50%);display:flex;gap:18px;align-items:flex-end}
.buff{width:150px;text-align:center;font-family:var(--font-mono);font-size:11px;letter-spacing:3px;color:var(--bc);text-shadow:0 0 12px var(--bc)}
.buff .bt{display:flex;justify-content:space-between;gap:8px}
.buff .bar{height:6px;margin-top:5px;background:rgba(255,255,255,.1);transform:skewX(-20deg);overflow:hidden}
.buff .bar i{display:block;height:100%;background:var(--bc);box-shadow:0 0 14px var(--bc)}
.od-overlay{position:absolute;inset:0;pointer-events:none;box-shadow:inset 0 0 130px rgba(255,176,32,.4);animation:pulse .55s ease-in-out infinite}
.warp-overlay{position:absolute;inset:0;pointer-events:none;background:radial-gradient(ellipse at center,rgba(130,90,255,0) 30%,rgba(120,70,255,.4) 100%)}
.warp-overlay.slowed{backdrop-filter:saturate(.3) contrast(1.05);background:radial-gradient(ellipse at center,rgba(40,60,170,0) 22%,rgba(40,60,210,.52) 100%)}
.warp-overlay .wl{position:absolute;left:50%;top:15%;transform:translateX(-50%);font-family:var(--font-mono);font-size:12px;letter-spacing:6px;color:#e0d4ff;text-shadow:0 0 14px #b06bff;white-space:nowrap}
.combo{text-align:center}
.combo .perk{font-family:var(--font-mono);font-size:10px;font-weight:400;letter-spacing:3px;color:#fff;opacity:.85;text-shadow:none;margin-top:5px}
.combo .tb{display:block;width:150px;height:4px;margin:8px auto 0;background:rgba(255,255,255,.14);transform:skewX(-20deg);overflow:hidden}
.combo .tb i{display:block;height:100%;background:currentColor;box-shadow:0 0 10px currentColor}
.health .sh{color:#4d9bff;text-shadow:0 0 10px #4d9bff}
.health .shield{height:5px;margin-bottom:5px;transform:skewX(-20deg);background:rgba(77,155,255,.18);overflow:hidden}
.health .shield i{display:block;height:100%;background:#4d9bff;box-shadow:0 0 12px #4d9bff}
.loot{display:grid;grid-template-columns:repeat(2,minmax(260px,1fr));gap:6px 42px;margin:0 0 6px;padding:6px 34px;font-family:var(--font-mono);font-size:11px;letter-spacing:2px}
.loot div{display:flex;gap:12px;align-items:baseline}
.loot b{min-width:96px;letter-spacing:3px}
.loot span{opacity:.6}
@media (max-width:760px){.loot{grid-template-columns:1fr}.buffs{bottom:110px}}
</style>

/* ==================================================================

const ARENA_HALF = 84;
const WALL_HEIGHT = 11;
const PLAYER_RADIUS = 0.35;
const PLAYER_HALF_HEIGHT = 0.55;
const PLAYER_EYE_OFFSET = 0.7;
const PLAYER_SPAWN = [0, 1.4, 6];
const GRAVITY = -24;
const WALK_SPEED = 8.5;
const SPRINT_MULT = 1.55;
const ADS_SPEED_MULT = 0.5;
const JUMP_VELOCITY = 8.2;
const RELOAD_TIME = 1.35;
const ENEMY_TOUCH_RADIUS = 1.35;

const OVERDRIVE_DURATION = 10;
const SHIELD_DURATION = 14, SHIELD_AMOUNT = 60;
const NOVA_RADIUS = 26, NOVA_DAMAGE = 170;

function weightedPick(w) {
  let total = 0; for (const k in w) total += w[k];
  let r = Math.random() * total;
  for (const k in w) { r -= w[k]; if (r <= 0) return k; }
  return Object.keys(w)[0];
}

function ensureAudio() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }

    AC = new (window.AudioContext || window.webkitAudioContext)();
    const comp = AC.createDynamicsCompressor();
    comp.threshold.value = -16; comp.ratio.value = 6; comp.attack.value = 0.002; comp.release.value = 0.12;
    master = AC.createGain(); warpLP = AC.createBiquadFilter(); warpLP.type = 'lowpass'; warpLP.frequency.value = 22000;
    master.connect(warpLP); warpLP.connect(comp); comp.connect(AC.destination);
    noiseBuf = AC.createBuffer(1, AC.sampleRate, AC.sampleRate);
    const d = noiseBuf.getChannelData(0);
    for (let i = 0; i < d.length; i++) d[i] = Math.random() * 2 - 1;
    const len = Math.floor(AC.sampleRate * 1.2), ir = AC.createBuffer(2, len, AC.sampleRate);
    for (let c = 0; c < 2; c++) { const ch = ir.getChannelData(c); for (let i = 0; i < len; i++) ch[i] = (Math.random() * 2 - 1) * Math.pow(1 - i / len, 3); }

}

  g.gain.setValueAtTime(0.0001, t); g.gain.linearRampToValueAtTime(vol, t + 0.003); g.gain.exponentialRampToValueAtTime(0.0001, t + dur);
  o.connect(g); route(g, send); o.start(t); o.stop(t + dur + 0.03);

function beamSound(on) {

    const g = AC.createGain(); g.gain.value = 0; g.gain.linearRampToValueAtTime(0.5, AC.currentTime + 0.08);
    const lp = AC.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 900; lp.connect(g);
    const o1 = AC.createOscillator(); o1.type = 'sawtooth'; o1.frequency.value = 55; o1.connect(lp);
    const o2 = AC.createOscillator(); o2.type = 'square'; o2.frequency.value = 110.7; const og = AC.createGain(); og.gain.value = 0.4; o2.connect(og); og.connect(lp);
    const n = AC.createBufferSource(); n.buffer = noiseBuf; n.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'bandpass'; f.frequency.value = 2400; f.Q.value = 0.8;
    const cg = AC.createGain(); cg.gain.value = 0.18;
    const lfo = AC.createOscillator(); lfo.type = 'square'; lfo.frequency.value = 23; const lg = AC.createGain(); lg.gain.value = 0.18; lfo.connect(lg); lg.connect(cg.gain);

    const b = beamNodes; beamNodes = null; const t = AC.currentTime;
    b.g.gain.cancelScheduledValues(t); b.g.gain.setValueAtTime(b.g.gain.value, t); b.g.gain.linearRampToValueAtTime(0, t + 0.15);

/* ---------- NETWORK: host simulates enemies, everyone else renders snapshots ---------- */
const enemyView = new Map();       // id -> {id,x,y,z,r,t,dy}   (hit-test + ghost state)
const enemyHandlers = new Map();   // id -> takeDamage(amount, point, byId, quiet)   (host only)
const ghostTargets = new Map();    // id -> snapshot target     (clients only)
const remoteLive = new Map();      // playerId -> {x,y,z}       live remote players
let killLog = [], pkList = [], dmgTotals = {}, hitLog = [];
let killSeq = Date.now(), pkSeq = Date.now(), hitSeq = Date.now(), beamTick = 0, lootSince = 0;
const safeIsHost = () => { try { return isHost(); } catch { return true; } };
const safeSet = (k, v, rel = true) => { try { setState(k, v, rel); } catch {} };
const myId = () => { try { return myPlayer()?.id ?? 'me'; } catch { return 'me'; } };

function handleKill(ev, me) {
  if (ev.by && ev.by === me) {
    addShake(0.05 + (ENEMY_DEFS[ev.type]?.size || 0.5) * 0.05);
    if (!safeIsHost()) { useGame.getState().registerHit(true); sfx('kill'); }   // clients get the same kill feedback the host gets
    useGame.getState().registerKill(ev.score, ev.type);
  }
}
function emitKill(ev) {            // host only
  const g = useGame.getState(), def = ENEMY_DEFS[ev.type];
  g.addExplosion([ev.x, ev.y, ev.z], def.emissive, 1.15 * def.size + 0.4, true);
  sfx('boom');
  killLog = [...killLog.slice(-11), { ...ev, n: ++killSeq }];
  safeSet('kl', killLog);
  handleKill(ev, myId());
  if (ev.by) rollLoot(ev);
}
/* ---- loot (host only) ---- */
function dropLoot(type, x, y, z) {
  const id = 'p' + (++pkSeq).toString(36) + Math.random().toString(36).slice(2, 5);   // random suffix: ids can never collide after a host change
  pkList = [...pkList.slice(-19), { id, ph: Math.random() * 6, x: +x.toFixed(2), y: +Math.min(1.8, Math.max(0.9, y)).toFixed(2), z: +z.toFixed(2), type, born: Date.now() }];
}
function rollLoot(ev) {
  lootSince++;
  const powers = pkList.filter((p) => PICKUP_DEFS[p.type]?.power).length;
  const sp = () => (Math.random() - 0.5) * 2.6;
  let dropped = false;
  if (ev.type === 'titan') {                                   // bosses always pay out
    dropLoot(weightedPick(POWER_WEIGHTS), ev.x + sp(), ev.y, ev.z + sp());
    dropLoot(weightedPick(POWER_WEIGHTS), ev.x + sp(), ev.y, ev.z + sp());
    dropLoot('health', ev.x + sp(), ev.y, ev.z + sp());
    lootSince = 0; dropped = true;
  } else if ((Math.random() < ({ drone: 0.035, wraith: 0.07, brute: 0.16 }[ev.type] || 0.04) || lootSince >= 26) && powers < 3) {
    dropLoot(weightedPick(POWER_WEIGHTS), ev.x, ev.y, ev.z);   // tougher enemies drop more; pity timer after 26 kills
    lootSince = 0; dropped = true;
  } else if (Math.random() < 0.22) {
    dropLoot(Math.random() < 0.5 ? 'health' : 'ammo', ev.x, ev.y, ev.z); dropped = true;
  }
  if (dropped) safeSet('pk', pkList);
}
function supplyDrop() {                                        // every new wave
  const a = Math.random() * Math.PI * 2, r = 6 + Math.random() * 22;
  dropLoot(weightedPick(POWER_WEIGHTS), Math.cos(a) * r, 1.2, Math.sin(a) * r);
  dropLoot('health', Math.cos(a + 0.5) * r * 0.9, 1.2, Math.sin(a + 0.5) * r * 0.9);
  safeSet('pk', pkList);
}
function hurtRemote(id, amt) { dmgTotals[id] = (dmgTotals[id] || 0) + amt; safeSet('dmg', { ...dmgTotals }); }

function rayEnemies(o, d, maxT, pierce) {
  const hits = [];
  enemyView.forEach((v) => {
    if (v.dy) return;
    const ox = v.x - o.x, oy = v.y - o.y, oz = v.z - o.z, tca = ox * d.x + oy * d.y + oz * d.z;
    if (tca < 0) return;
    const d2 = ox * ox + oy * oy + oz * oz - tca * tca;
    if (d2 > v.r * v.r) return;
    const t = tca - Math.sqrt(v.r * v.r - d2);
    if (t <= maxT) hits.push({ id: v.id, t: Math.max(0, t) });
  });
  hits.sort((a, b) => a.t - b.t);
  return pierce ? hits.slice(0, 6) : hits.slice(0, 1);
}
function dealDamage(id, dmg, pt, quiet) {
  if (safeIsHost()) { const h = enemyHandlers.get(id); if (h) h(dmg, pt, myId(), quiet); return; }
  const g = useGame.getState();
  if (!quiet) { g.addDamageNumber([pt.x, pt.y + 0.3, pt.z], String(Math.round(dmg)), '#ffffff'); g.registerHit(false); sfx('hit'); }
  const gt = ghostTargets.get(id); if (gt) gt.flash = 1;
  const pend = pendingHits.get(id);
  if (pend) { pend.d += dmg; pend.x = pt.x; pend.y = pt.y; pend.z = pt.z; } else pendingHits.set(id, { d: dmg, x: pt.x, y: pt.y, z: pt.z });
}
const pendingHits = new Map();
let lastHitFlush = 0;
function flushHits() {                // called every frame; sends at most 20 updates/sec no matter how fast you fire (Overdrive!)
  if (!pendingHits.size) return;
  const now = performance.now();
  if (now - lastHitFlush < 50) return;
  lastHitFlush = now;
  const add = [];
  pendingHits.forEach((v, id) => add.push({ n: ++hitSeq, id, d: Math.round(v.d), x: +v.x.toFixed(1), y: +v.y.toFixed(1), z: +v.z.toFixed(1) }));
  pendingHits.clear();
  hitLog = [...hitLog, ...add].slice(-60);
  try { myPlayer()?.setState('hits', hitLog, true); } catch {}
}

function requestGamePointerLock(retries = 4) {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;
  const attempt = (remaining) => {
    try {
      const result = canvas.requestPointerLock();
      if (result && typeof result.catch === 'function') {
        result.catch(() => { if (remaining > 0) setTimeout(() => attempt(remaining - 1), 350); });
      }
    } catch {
      if (remaining > 0) setTimeout(() => attempt(remaining - 1), 350);
    }
  };
  attempt(retries);
}

  streakFlash: null,
  startedAt: 0, endedAt: 0,

  startGame: () => {
    clearRegistry(); resetInput();
    const me = myPlayer();
    if (me) {
      me.setState('kills', [], true);
      me.setState('pickups', [], true);
      me.setState('lastHit', null, true);
      me.setState('dead', false, true);
    }
    resetBuffs(); cancelWarp();
    screenFX.shake = 0; screenFX.fovKick = 0; screenFX.chroma = 0;
    set({
      status: 'PLAYING',
      maxHealth: 100, shield: 0, notice: null,
      health: 100, activeWeapon: 0, ammoBy: WEAPONS.map((w) => w.mag), ammo: WEAPONS[0].mag, magSize: WEAPONS[0].mag, reloading: false, ads: false,
      score: 0, kills: 0, wave: 1, combo: 0, comboTier: 0,
      enemies: (window.__mpCount > 1 ? get().enemies : []), tracers: [], explosions: [], pickups: [],
      damageNumbers: [], killFeed: [],
      hitMarker: null, damageStamp: 0, pickupToast: null, streakFlash: null,
      startedAt: performance.now(), endedAt: 0,
    });
  },

  pauseGame: () => { if (get().status !== 'PLAYING') return; resetInput(); set({ status: 'PAUSED', ads: false }); },
  resumeGame: () => { if (get().status !== 'PAUSED') return; set({ status: 'PLAYING' }); },
  backToMenu: () => {
    clearRegistry(); resetInput(); resetBuffs(); cancelWarp();
    set({ status: 'MENU', enemies: (window.__mpCount > 1 ? get().enemies : []), tracers: [], explosions: [], pickups: [], damageNumbers: [], killFeed: [], ads: false });
  },

  switchWeapon: (index) => set((s) => {
    if (s.activeWeapon === index) return {};
    const ammoBy = [...s.ammoBy]; ammoBy[s.activeWeapon] = s.ammo;
    return { ammoBy, activeWeapon: index, ammo: ammoBy[index], magSize: WEAPONS[index].mag, reloading: false };
  }),

  damagePlayer: (amount) => {
    const s = get();
    if (!(s.status === 'PLAYING' || (s.status === 'PAUSED' && window.__mpCount > 1)) || playerState.invuln) return;
    let rem = amount, shield = s.shield;
    if (shield > 0) { const ab = Math.min(shield, rem); shield -= ab; rem -= ab; }   // Aegis soaks damage first
    const health = Math.max(0, s.health - rem);
    set({ health, shield, damageStamp: nextId() });
    addShake(rem > 0 ? 0.16 : 0.07); sfx(rem > 0 ? 'hurt' : 'hit');
    screenFX.chroma = Math.min(1.5, screenFX.chroma + (rem > 0 ? 0.6 : 0.25));
    if (health <= 0) {
      resetBuffs(); cancelWarp();
      set({ status: 'GAME_OVER', endedAt: performance.now(), ads: false, shield: 0 });
      const me = myPlayer();
      if (me) me.setState('dead', true, true);
      if (document.pointerLockElement) document.exitPointerLock();
    }
  },

  consumeAmmo: () => set((s) => ({ ammo: Math.max(0, s.ammo - 1) })),
  setReloading: (v) => set({ reloading: v }),
  finishReload: () => set({ ammo: get().magSize, reloading: false }),
  setADS: (v) => set({ ads: v }),

  heal: (amount) => set((s) => ({ health: Math.min(s.maxHealth, s.health + amount) })),
  giveAmmo: (amount) => set((s) => ({ ammo: Math.min(s.magSize, s.ammo + amount) })),
  giveShield: (v) => set((s) => ({ shield: Math.max(s.shield, v) })),
  notify: (text, sub, color) => set({ notice: { id: nextId(), text, sub, color } }),

  registerHit: (kill) => set({ hitMarker: { id: nextId(), kill } }),

  registerKill: (basePoints, enemyType) => {
    const s = get();
    const nextCombo = s.combo + 1;
    const tier = comboMultiplier(nextCombo);
    const st = streakTier(nextCombo);
    const gained = Math.round(basePoints * tier);
    const def = ENEMY_DEFS[enemyType] || { label: 'HOSTILE', kfClass: '' };
    const feedEntry = {
      id: nextId(),
      label: `${def.label}  ×  ${tier.toFixed(tier === 1.5 ? 1 : 0)}  +${gained}`,
      kfClass: nextCombo >= 5 ? 'multikill' : def.kfClass,
    };
    const feed = [...s.killFeed, feedEntry].slice(-5);
    set({
      combo: nextCombo, comboTier: tier,
      score: s.score + gained, kills: s.kills + 1, killFeed: feed,
      // streak perks: kills heal you and refund rounds while the streak is alive
      health: s.health > 0 ? Math.min(s.maxHealth, s.health + st.heal) : s.health,
      ammo: (buffs.overdrive > 0 || !st.refund) ? s.ammo : Math.min(s.magSize, s.ammo + st.refund),
    });
    if (nextCombo > 1 && nextCombo % 5 === 0 && !STREAK_TIERS.some((t) => t.at === nextCombo)) {
      set({ streakFlash: { id: nextId(), value: nextCombo, tier } });
    }
  },

  resetCombo: () => { if (get().combo !== 0) set({ combo: 0, comboTier: 0 }); },
  nextWave: () => set((s) => ({ wave: s.wave + 1 })),

  spawnEnemy: (position, type, stats) => set((s) => {
    const id = stats.id ?? nextId();
    if (s.enemies.some((e) => e.id === id)) return {};   // never spawn the same enemy twice
    return { enemies: [...s.enemies, { position, type, ...stats, id }] };
  }),
  removeEnemy: (id) => set((s) => ({ enemies: s.enemies.filter((e) => e.id !== id) })),

  spawnPickup: (position, type) =>
    set((s) => ({ pickups: [...s.pickups, { id: 'p' + Math.random().toString(36).slice(2, 8), ph: Math.random() * 6, position, type }] })),
  removePickup: (id) => set((s) => ({ pickups: s.pickups.filter((p) => p.id !== id) })),

  showPickupToast: (label, kind, color) => set({ pickupToast: { id: nextId(), label, kind, color } }),

  addTracer: (from, to, beam, hot) =>
    set((s) => ({ tracers: [...s.tracers.slice(-40), { id: nextId(), from, to, beam: !!beam, hot: !!hot }] })),
  removeTracer: (id) => set((s) => ({ tracers: s.tracers.filter((t) => t.id !== id) })),

  addExplosion: (position, color, size, ring) =>
    set((s) => ({ explosions: [...s.explosions.slice(-30), { id: nextId(), position, color, size, ring: !!ring }] })),
  removeExplosion: (id) => set((s) => ({ explosions: s.explosions.filter((e) => e.id !== id) })),

  addDamageNumber: (position, text, color) => {
    if (!S().dmgNums) return;
    set((s) => ({
      damageNumbers: [...s.damageNumbers.slice(-(DAMAGE_NUMBER_CAP - 1)), { id: nextId(), position, text, color }],
    }));
  },
  removeDamageNumber: (id) =>
    set((s) => ({ damageNumbers: s.damageNumbers.filter((d) => d.id !== id) })),
}));

function comboMultiplier(combo) {
  if (combo >= 20) return 4;
  if (combo >= 12) return 3;
  if (combo >= 6) return 2;
  if (combo >= 3) return 1.5;
  return 1;
}

let warpSeq = Date.now(), fxSeq = Date.now();
function emitFx(kind, p) {              // one-shot visual event for the other players
  try { myPlayer()?.setState('fx', { n: ++fxSeq, k: kind, x: +p.x.toFixed(1), y: +p.y.toFixed(1), z: +p.z.toFixed(1) }, true); } catch {}
}
function activateWarp() {
  timeFX.warps.set(myId(), WARP_DURATION);
  try { myPlayer()?.setState('warp', { n: ++warpSeq, dur: WARP_DURATION }, true); } catch {}
}
function cancelWarp() {
  const id = myId();
  if (!timeFX.warps.has(id)) return;
  timeFX.warps.delete(id);
  try { myPlayer()?.setState('warp', { n: ++warpSeq, dur: 0 }, true); } catch {}
}
function resetBuffs() {
  buffs.overdrive = 0; buffs.shield = 0;
  try { myPlayer()?.setState('buf', 0, true); } catch {}
}
function triggerNova(origin) {
  const g = useGame.getState();
  enemyView.forEach((v) => {            // enemyView exists on host AND clients, so Nova works for everybody
    if (v.dy) return;
    const d = Math.hypot(v.x - origin.x, v.y - origin.y, v.z - origin.z);
    if (d > NOVA_RADIUS + v.r) return;
    dealDamage(v.id, NOVA_DAMAGE * (1.15 - 0.5 * Math.min(1, d / NOVA_RADIUS)), { x: v.x, y: v.y, z: v.z }, true);
  });
  g.addExplosion([origin.x, origin.y - 0.4, origin.z], '#ff3355', NOVA_RADIUS / 4, true);
  g.addExplosion([origin.x, origin.y - 0.4, origin.z], '#ffffff', NOVA_RADIUS / 9, true);
  screenFX.fovKick = 18; screenFX.chroma = 1.5; addShake(0.45); sfx('nova');
  emitFx('nova', origin);
}
function applyPickup(type) {
  const g = useGame.getState(), def = PICKUP_DEFS[type], pos = playerState.position;
  switch (type) {
    case 'health': g.heal(def.amount); break;
    case 'ammo': g.giveAmmo(def.amount); break;
    case 'overdrive':
      buffs.overdrive = Math.min(OVERDRIVE_DURATION * 1.6, buffs.overdrive + OVERDRIVE_DURATION);
      screenFX.fovKick = 14; addShake(0.25); sfx('overdrive'); emitFx('overdrive', pos); break;
    case 'warp':
      activateWarp(); screenFX.chroma = 1.5; addShake(0.3); sfx('warp');
      g.addExplosion([pos.x, pos.y - 0.5, pos.z], def.color, 4, true); emitFx('warp', pos); break;
    case 'shield':
      g.giveShield(SHIELD_AMOUNT); buffs.shield = SHIELD_DURATION; sfx('shield'); emitFx('shield', pos); break;
    case 'nova': triggerNova(pos); break;
  }
  g.showPickupToast(def.label, type, def.color); sfx('pickup');
}

/* One shared clock. The Time Warp collector writes {n,dur} to their player state; every client (and the host)
   runs the same countdown, so enemies, spawns, remote players and the local sim all slow together, except the collector. */
function TimeKeeper() {
  const players = usePlayersList();
  const list = useRef(players); list.current = players;
  const seenWarp = useRef(new Map()), seenFx = useRef(new Map()), wasAny = useRef(false);
  useFrame((_, rawDt) => {
    const dt = Math.min(rawDt, 0.1), me = myPlayer(), mid = myId(), g = useGame.getState();
    const ids = new Set();
    for (const p of list.current) {
      ids.add(p.id);
      let nm = 'PLAYER'; try { nm = String(p.getProfile()?.name || 'PLAYER').toUpperCase().slice(0, 14); } catch {}
      timeFX.names.set(p.id, nm);
      if (me && p.id === me.id) continue;
      const w = p.getState('warp'), fx = p.getState('fx');
      if (!seenWarp.current.has(p.id)) seenWarp.current.set(p.id, w ? w.n : 0);          // history on first sight is never replayed
      else if (w && w.n !== seenWarp.current.get(p.id)) {
        seenWarp.current.set(p.id, w.n);
        if (w.dur > 0) {
          timeFX.warps.set(p.id, w.dur);
          if (g.status === 'PLAYING') { sfx('warp'); g.notify('TIME DILATION', nm + ' BENT TIME', '#b06bff'); screenFX.chroma = Math.min(1.5, screenFX.chroma + 0.8); }
        } else timeFX.warps.delete(p.id);
      }
      if (!seenFx.current.has(p.id)) seenFx.current.set(p.id, fx ? fx.n : 0);
      else if (fx && fx.n !== seenFx.current.get(p.id)) {
        seenFx.current.set(p.id, fx.n);
        const def = PICKUP_DEFS[fx.k];
        if (def) {
          const big = fx.k === 'nova';
          g.addExplosion([fx.x, fx.y, fx.z], def.color, big ? NOVA_RADIUS / 4 : 1.6, true);
          if (big && (g.status === 'PLAYING')) { sfx('nova'); addShake(0.2); }
        }
      }
    }
    timeFX.warps.forEach((rem, id) => {
      const r = rem - dt;
      if (r <= 0 || (id !== mid && !ids.has(id))) timeFX.warps.delete(id);              // expired, or owner left the room
      else timeFX.warps.set(id, r);
    });
    const any = timeFX.warps.size > 0, mine = timeFX.warps.has(mid);
    if (wasAny.current && !any && g.status === 'PLAYING') sfx('warpEnd');
    wasAny.current = any;
    const k = 1 - Math.exp(-12 * dt);                                                    // quick ease in/out of the slowdown
    timeFX.world += ((any ? WARP_SCALE : 1) - timeFX.world) * k;
    timeFX.me += ((any && !mine ? WARP_SCALE : 1) - timeFX.me) * k;
    if (Math.abs(timeFX.world - 1) < 0.004) timeFX.world = 1;
    if (Math.abs(timeFX.me - 1) < 0.004) timeFX.me = 1;
    if (warpLP && AC) warpLP.frequency.value = 22000 * Math.pow(0.04, (1 - timeFX.world) / (1 - WARP_SCALE));   // muffled audio while time is bent
  }, -2);
  return null;
}

/* ---- PARKOUR: generated once, deterministic (seeded) so every player gets the same course ---- */
const { PARKOUR, SUMMIT, JUMP_PADS } = (() => {
  let seed = 1337;
  const rnd = () => ((seed = (seed * 16807) % 2147483647) / 2147483647);
  const R = 58, N = 54;
  const pt = (a, r) => [Math.cos(a) * r, Math.sin(a) * r];
  const gapOf = (a, b) => Math.hypot(
    Math.max(0, Math.abs(a.c[0] - b.c[0]) - (a.h[0] + b.h[0])),
    Math.max(0, Math.abs(a.c[1] - b.c[1]) - (a.h[1] + b.h[1])));
  const list = [{ c: pt(-2.6, R), h: [2, 2], top: 0.9 }];
  let ang = -2.6;
  for (let i = 1; i <= N; i++) {
    const prev = list[i - 1], last = i === N;
    let placed = null;
    for (let tries = 0; tries < 60 && !placed; tries++) {
      const beam = !last && rnd() < 0.18;
      const h = last ? [3.6, 3.6] : beam ? (rnd() < 0.5 ? [0.8, 2.6] : [2.6, 0.8]) : [1.1 + rnd() * 0.8, 1.1 + rnd() * 0.8];
      const want = last ? 2.2 : 1.4 + rnd() * 2.2;
      const da = (Math.max(...prev.h) + Math.max(...h) + want) / R * (tries < 30 ? 1 : 0.75);
      const cand = { c: pt(ang + da, R + (last ? 0 : (rnd() - 0.5) * 5)), h, top: 0 };
      const g = gapOf(prev, cand);
      if (g < 0.8 || g > 3.9) continue;
      const rise = Math.max(-0.7, Math.min(1.0, (0.9 + i * 0.17 - prev.top) * 0.35 + (rnd() - 0.4) * 0.9));
      cand.top = last ? Math.min(9.5, prev.top + 0.6) : Math.min(9.5, Math.max(0.9, prev.top + rise));
      placed = { cand, da };
    }
    if (!placed) break;
    ang += placed.da; list.push(placed.cand);
  }
  const pads = Array.from({ length: 6 }, (_, i) => [Math.cos(i * 1.0472 + 0.5) * 30, 0, Math.sin(i * 1.0472 + 0.5) * 30]);
  return { PARKOUR: list, SUMMIT: list[list.length - 1], JUMP_PADS: pads };
})();

function Wall({ pos, half, index }) {
  const topRef = useRef(null);
  const botRef = useRef(null);
  useFrame((state) => {
    const t = state.clock.elapsedTime;
    if (topRef.current) topRef.current.material.opacity = 0.75 + Math.sin(t * 1.4 + index) * 0.25;
    if (botRef.current) botRef.current.material.opacity = 0.75 + Math.sin(t * 1.1 + index * 0.7) * 0.25;
  });
  return (
    <RigidBody type="fixed" colliders={false} position={pos} friction={0.4}>
      <CuboidCollider args={half} />
      <mesh>
        <boxGeometry args={[half[0] * 2, half[1] * 2, half[2] * 2]} />
        <meshStandardMaterial color="#070d18" metalness={0.85} roughness={0.35} emissive="#0a2a44" emissiveIntensity={0.6} />
      </mesh>
      <mesh ref={topRef} position={[0, half[1] - 0.35, 0]}>
        <boxGeometry args={[half[0] * 2 * 0.98, 0.14, half[2] * 2 * 1.06]} />
        <meshBasicMaterial color="#2fe0ff" toneMapped={false} transparent />
      </mesh>
      <mesh ref={botRef} position={[0, -half[1] + 0.25, 0]}>
        <boxGeometry args={[half[0] * 2 * 0.98, 0.1, half[2] * 2 * 1.06]} />
        <meshBasicMaterial color="#ff2bd6" toneMapped={false} transparent />
      </mesh>
    </RigidBody>
  );
}

function Starfield() {
  const { positions, colors } = useMemo(() => {
    const count = STARFIELD_COUNT;
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    const palette = [new THREE.Color('#35e6ff'), new THREE.Color('#ff2bd6'), new THREE.Color('#ffffff'), new THREE.Color('#b028ff')];
    for (let i = 0; i < count; i++) {
      const r = 150 + Math.random() * 180;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = Math.abs(r * Math.cos(phi) * 0.6) + 20;
      pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      const c = palette[(Math.random() * palette.length) | 0];
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    return { positions: pos, colors: col };
  }, []);

  const ref = useRef(null);
  useFrame((_, dt) => {
    if (ref.current) ref.current.rotation.y += dt * 0.008;
  });

  return (
    <points ref={ref}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
        <bufferAttribute attach="attributes-color" args={[colors, 3]} />
      </bufferGeometry>
      <pointsMaterial size={0.95} vertexColors transparent opacity={0.9} toneMapped={false} sizeAttenuation depthWrite={false} />
    </points>
  );
}

function FloorPulses() {
  const refs = useRef([]);
  useFrame((state) => {
    const t = state.clock.elapsedTime;
    refs.current.forEach((m, i) => {
      if (!m) return;
      const phase = (t * 0.35 + i * 0.5) % 1;
      const s = 4 + phase * 22;
      m.scale.set(s, 1, s);
      m.material.opacity = (1 - phase) * 0.16;
    });
  });
  return (
    <group position={[0, 0.02, 0]}>
      {Array.from({ length: FLOOR_PULSE_COUNT }).map((_, i) => (
        <mesh key={i} ref={(el) => (refs.current[i] = el)} rotation={[-Math.PI / 2, 0, 0]}>
          <ringGeometry args={[0.98, 1, 32]} />
          <meshBasicMaterial color="#2fe0ff" transparent opacity={0.12} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
        </mesh>
      ))}
    </group>
  );
}

      dashT.current = 0.2; dashCd.current = mods.dashCd; slideT.current = 0;
      screenFX.fovKick = 24; screenFX.chroma = Math.min(1.5, screenFX.chroma + 0.9); addShake(0.3);
      g.addExplosion([camera.position.x, camera.position.y - 0.7, camera.position.z], '#35e6ff', 1.3, true);
      sfx('dash');
    }
    const dashing = dashT.current > 0 && playing;
    playerState.invuln = dashing;           // i-frames while dashing
    if (dashing) {
      dashT.current -= sdt;
      velX.current = dashDX.current * 40;   // ~8m burst, ignores gravity
      velZ.current = dashDZ.current * 40;
      velY.current = Math.max(velY.current, 0) * 0.5;
    }

    let currentSpeed = WALK_SPEED * (keys.sprint ? SPRINT_MULT : 1) * THREE.MathUtils.lerp(1, ADS_SPEED_MULT, adsT.current) * mods.speed;
    let accel = grounded.current ? 15 : 4;
    slideCd.current = Math.max(0, slideCd.current - sdt);
    if (keys.slidePress) {
      keys.slidePress = false;
      const hs = Math.hypot(velX.current, velZ.current);
      if (playing && grounded.current && slideT.current <= 0 && slideCd.current <= 0 && hs > 4) {
        slideT.current = 0.9; slideCd.current = 0.5;
        const k = 19 / hs; velX.current *= k; velZ.current *= k;   // real speed boost
        screenFX.fovKick = 7; addShake(0.1); sfx('slide');
      }
    }
    const sliding = slideT.current > 0 && playing;
    if (sliding) {
      slideT.current -= sdt;
      const dec = Math.exp(-1.1 * sdt);       // glide, bleeding speed
      velX.current *= dec; velZ.current *= dec;
      accel = 0;                              // no braking while sliding; jump keeps the momentum
    }
    duck.current = THREE.MathUtils.damp(duck.current, sliding ? -0.7 : 0, 16, dt);
    const duckOffset = duck.current;

    const wishX = (fwdX * -iz + rgtX * ix) * currentSpeed;
    const wishZ = (fwdZ * -iz + rgtZ * ix) * currentSpeed;

    if (!dashing) {
      velX.current = THREE.MathUtils.damp(velX.current, wishX, accel, sdt);
      velZ.current = THREE.MathUtils.damp(velZ.current, wishZ, accel, sdt);
    }

    if (keys.jump && playing) jumpBuffer.current = 0.14;
    jumpBuffer.current = Math.max(0, jumpBuffer.current - dt);

    if (!dashing) velY.current += GRAVITY * sdt;
    if (grounded.current && velY.current < 0) velY.current = -1.5;
    if (jumpBuffer.current > 0 && grounded.current) {
      velY.current = JUMP_VELOCITY;
      jumpBuffer.current = 0;
      grounded.current = false;
    }

    padCd.current -= sdt;
    if (playing && padCd.current <= 0) {
      const bt = body.translation();
      for (const p of JUMP_PADS) if (Math.hypot(bt.x - p[0], bt.z - p[2]) < 1.5 && bt.y < 1.8) {
        velY.current = 17; grounded.current = false; padCd.current = 0.6; screenFX.fovKick = 10; sfx('pad'); break;
      }
    }
    controller.computeColliderMovement(collider, {
      x: velX.current * sdt,
      y: velY.current * sdt,
      z: velZ.current * sdt,
    });
    const mv = controller.computedMovement();
    grounded.current = controller.computedGrounded();

    if (grounded.current && !wasGrounded.current && velY.current < -6) {
      addShake(0.1);
      recoil.current = Math.min(1.2, recoil.current + 0.4);
    }
    wasGrounded.current = grounded.current;
    if (grounded.current && velY.current < 0) velY.current = 0;

    const t = body.translation();
    const nx = t.x + mv.x;
    const ny = t.y + mv.y;
    const nz = t.z + mv.z;
    body.setNextKinematicTranslation({ x: nx, y: ny, z: nz });
    summitCd.current -= sdt;
    if (playing && summitCd.current <= 0 && Math.abs(nx - SUMMIT.c[0]) < SUMMIT.h[0] && Math.abs(nz - SUMMIT.c[1]) < SUMMIT.h[1] && ny - 0.9 > SUMMIT.top - 0.4) {
      summitCd.current = 40; g.heal(60);
      useGame.setState((s) => ({ score: s.score + 500, ammo: s.magSize }));
      g.showPickupToast('SUMMIT BONUS +500', 'health'); sfx('pickup'); sfx('pad');
    }

    const hSpeed = Math.hypot(velX.current, velZ.current);
    const hFactor = Math.min(1, hSpeed / WALK_SPEED);

    bobT.current += grounded.current ? dt * (8 + hFactor * 6) : dt * 2;

    const bobDamp = 1 - adsT.current * 0.8;
    const bobX = Math.sin(bobT.current) * 0.034 * hFactor * bobDamp;
    const bobY = Math.abs(Math.cos(bobT.current)) * 0.045 * hFactor * bobDamp;

    camKick.current = THREE.MathUtils.damp(camKick.current, 0, 9, dt);
    screenFX.shake = THREE.MathUtils.damp(screenFX.shake, 0, 8, dt);
    screenFX.fovKick = THREE.MathUtils.damp(screenFX.fovKick, 0, 14, dt);
    screenFX.chroma = THREE.MathUtils.damp(screenFX.chroma, 0, 3.5, dt);

    const shakeMag = screenFX.shake;
    const shX = (Math.random() - 0.5) * shakeMag;
    const shY = (Math.random() - 0.5) * shakeMag;
    const shZ = (Math.random() - 0.5) * shakeMag * 0.4;

    const roll = -ix * 0.022 + swayX.current * 0.4 + recoilSide.current * 0.06;
    _euler.set(pitch.current + camKick.current + shY * 0.35, yaw.current + shX * 0.35, roll + shX * 0.5, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.position.set(nx + shX, ny + PLAYER_EYE_OFFSET + bobY + shY + duckOffset, nz + shZ);

    netT.current += dt;
    if (me && playing && netT.current >= 0.05) {   // 20Hz, unreliable: no more network backlog
      netT.current = 0;
      me.setState('pos', { x: nx, y: ny, z: nz }, false);
      me.setState('rot', { yaw: yaw.current }, false);
    }

    adsT.current = THREE.MathUtils.damp(adsT.current, g.ads ? 1 : 0, 13, dt);
    fovBoost.current = THREE.MathUtils.damp(fovBoost.current, (od ? 7 : 0) + st.idx * 1.5, 6, dt);
    const targetFov = THREE.MathUtils.lerp(S().fov, S().fov * 0.7, adsT.current) + screenFX.fovKick + fovBoost.current * (1 - adsT.current);
    if (Math.abs(camera.fov - targetFov) > 0.01) {
      camera.fov = targetFov;
      camera.updateProjectionMatrix();
    }

    playerState.position.copy(camera.position);
    playerState.forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
    playerState.speed = hSpeed;
    playerState.alive = g.status === 'PLAYING' || g.status === 'PAUSED';

    recoil.current = THREE.MathUtils.damp(recoil.current, 0, 15, dt);
    recoilSide.current = THREE.MathUtils.damp(recoilSide.current, 0, 12, dt);
    reloadAnim.current = THREE.MathUtils.damp(reloadAnim.current, g.reloading ? 1 : 0, 11, dt);
    chargeGlow.current = THREE.MathUtils.damp(chargeGlow.current, 0, 8, dt);

    if (g.reloading) {
      reloadPhase.current = THREE.MathUtils.clamp(1 - reloadT.current / reloadDur.current, 0, 1);
    } else {
      reloadPhase.current = 0;
    }
    const rp = reloadPhase.current;
    const dipCurve = Math.sin(rp * Math.PI);

    const w = weaponRef.current;
    if (w) {
      w.position.copy(camera.position);
      w.quaternion.copy(camera.quaternion);

      const swing = 1 - adsT.current * 0.85;
      const px = THREE.MathUtils.lerp(HIP_POS.x, ADS_POS.x, adsT.current) + bobX * 0.7 * swing + swayX.current * swing + recoilSide.current * 0.035;
      const py = THREE.MathUtils.lerp(HIP_POS.y, ADS_POS.y, adsT.current) + bobY * 0.7 * swing + swayY.current * swing - dipCurve * 0.24;
      const pz = THREE.MathUtils.lerp(HIP_POS.z, ADS_POS.z, adsT.current) + recoil.current * 0.08;

      w.translateX(px);
      w.translateY(py);
      w.translateZ(pz);

      w.rotateX(recoil.current * 0.38 - dipCurve * 0.55);
      w.rotateZ(-swayX.current * 1.8 - ix * 0.045 + dipCurve * 1.1);
      w.rotateY(recoilSide.current * 0.4 + dipCurve * 0.7);
    }

    if (magRef.current) {
      const out = THREE.MathUtils.clamp(rp * 3, 0, 1);
      const back = THREE.MathUtils.clamp((rp - 0.55) * 3, 0, 1);
      const off = out * (1 - back);
      magRef.current.position.y = -0.115 - off * 0.6;
      magRef.current.position.z = -0.05 - off * 0.05;
      magRef.current.rotation.z = off * 1.4;
    }

    if (chargeRingRef.current) {
      const cg = chargeGlow.current;
      const s = 1 + cg * 0.6;
      chargeRingRef.current.scale.set(s, s, s);
      chargeRingRef.current.material.opacity = cg * 0.9;
    }

    const mz = [-0.47, -0.74, -0.84][g.activeWeapon] ?? -0.47;
    if (muzzleRef.current) muzzleRef.current.position.z = mz;
    if (flashRef.current) flashRef.current.position.z = mz - 0.04;
    beamSound(playing && mouse.left && !g.reloading && g.ammo > 0 && !!WEAPONS[g.activeWeapon].beam);
    fireCd.current -= sdt;
    {
      const iv = WEAPONS[g.activeWeapon].interval / mods.fire;
      let guard = 0;
      while (playing && mouse.left && !useGame.getState().reloading && fireCd.current <= 0 && guard++ < 3) {
        fire();
        fireCd.current += iv;
      }
      if (fireCd.current < -0.03) fireCd.current = -0.03;   // bank at most one early shot
    }

    if (reloadT.current > 0) {
      reloadT.current -= sdt;
      if (reloadT.current <= 0) {
        reloadT.current = 0;
        useGame.getState().finishReload();
      }
    }

    if (flashT.current > 0) {
      flashT.current -= dt;
      const k = Math.max(0, flashT.current / 0.06);
      if (flashRef.current) {
        flashRef.current.visible = true;
        const v = flashVariant.current;
        flashRef.current.scale.set(
          (0.7 + k * 1.1) * (0.85 + v * 0.4),
          (0.7 + k * 1.1) * (0.85 + (1 - v) * 0.4),
          (0.7 + k * 1.1)
        );
        flashRef.current.rotation.z = v * Math.PI * 2;
        flashRef.current.material.opacity = k;
        flashRef.current.material.color.setHex(od ? 0xffb020 : 0xb6f6ff);
      }
      if (flashLightRef.current) { flashLightRef.current.intensity = k * 14; flashLightRef.current.color.setHex(od ? 0xffb020 : 0x7fe9ff); }
    } else {
      if (flashRef.current) flashRef.current.visible = false;
      if (flashLightRef.current) flashLightRef.current.intensity = 0;
    }

    if (playing && g.combo > 0) {
      comboTimer.current -= sdt;          // slowed players don't lose their streak just because the world is slow
      playerState.comboT = comboTimer.current; playerState.comboMax = comboTimeout(g.combo);
      if (comboTimer.current <= 0) {
        g.resetCombo();
        comboTimer.current = 0;
      }
    } else playerState.comboT = 0;
  }, -1);

  const comboValue = useGame((s) => s.combo);
  useEffect(() => {
    if (comboValue > 0) comboTimer.current = comboTimeout(comboValue);
    if (comboValue === 0) { streakIdx.current = 0; return; }
    const g = useGame.getState(), tier = streakTier(comboValue);
    if (g.status !== 'PLAYING') return;
    if (tier.idx > streakIdx.current) {      // streak tier reached: instant reward on top of the passive boosts
      streakIdx.current = tier.idx;
      g.heal(10 + tier.idx * 5); useGame.setState((s) => (s.reloading ? {} : { ammo: s.magSize }));
      g.notify(tier.name, `STREAK ×${comboValue}  ·  +${Math.round((tier.fire - 1) * 100)}% FIRE RATE`, tier.color);
      sfx('streak'); screenFX.fovKick = 10; addShake(0.15);
    }
    if (comboValue % 25 === 0) {             // every 25 kills the streak detonates a free Nova
      triggerNova(playerState.position);
      g.notify('STREAK NOVA', `${comboValue} KILLS WITHOUT STOPPING`, '#ff3355');
    }
  }, [comboValue]);

  return (
    <>
      <RigidBody ref={bodyRef} type="kinematicPosition" colliders={false} position={PLAYER_SPAWN} ccd>
        <CapsuleCollider ref={colliderRef} args={[PLAYER_HALF_HEIGHT, PLAYER_RADIUS]} />
      </RigidBody>

      <group ref={weaponRef}>
        <mesh position={[0, 0, -0.06]}>
          <boxGeometry args={[0.1, 0.135, 0.4]} />
          <meshStandardMaterial color="#161d2c" metalness={0.95} roughness={0.32} />
        </mesh>
        <mesh position={[0, 0.082, -0.09]}>
          <boxGeometry args={[0.066, 0.03, 0.3]} />
          <meshStandardMaterial color="#0b1220" metalness={0.95} roughness={0.4} />
        </mesh>
        {[-0.12, -0.04, 0.04, 0.12].map((z, i) => (
          <mesh key={i} position={[0, 0.098, z - 0.09]}>
            <boxGeometry args={[0.05, 0.008, 0.02]} />
            <meshStandardMaterial color="#050810" metalness={0.9} roughness={0.35} />
          </mesh>
        ))}
        <mesh position={[0, 0.008, -0.33]} rotation={[Math.PI / 2, 0, 0]}>
          <cylinderGeometry args={[0.026, 0.032, 0.24, 10]} />
          <meshStandardMaterial color="#0a0f18" metalness={1} roughness={0.22} />
        </mesh>
        <mesh position={[0, 0.008, -0.44]} rotation={[Math.PI / 2, 0, 0]}>
          <cylinderGeometry args={[0.032, 0.032, 0.05, 10]} />
          <meshBasicMaterial color="#3ce8ff" toneMapped={false} />
        </mesh>
        <mesh ref={chargeRingRef} position={[0, 0.008, -0.455]} rotation={[Math.PI / 2, 0, 0]}>
          <torusGeometry args={[0.045, 0.008, 6, 16]} />
          <meshBasicMaterial color="#7fe9ff" transparent opacity={0} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
        </mesh>
        <mesh ref={magRef} position={[0, -0.115, -0.05]}>
          <boxGeometry args={[0.062, 0.13, 0.075]} />
          <meshStandardMaterial color="#131b2b" metalness={0.9} roughness={0.35} emissive="#0d3b52" emissiveIntensity={1.4} />
        </mesh>
        <mesh position={[0, -0.115, -0.088]}>
          <boxGeometry args={[0.04, 0.07, 0.006]} />
          <meshBasicMaterial color="#ff2bd6" toneMapped={false} />
        </mesh>
        <mesh position={[0, -0.145, 0.07]} rotation={[0.3, 0, 0]}>
          <boxGeometry args={[0.072, 0.185, 0.095]} />
          <meshStandardMaterial color="#101725" metalness={0.85} roughness={0.5} />
        </mesh>
        <mesh position={[0, -0.095, -0.02]} rotation={[0.3, 0, 0]}>
          <torusGeometry args={[0.032, 0.006, 5, 10, Math.PI * 1.4]} />
          <meshStandardMaterial color="#0a1220" metalness={0.9} roughness={0.4} />
        </mesh>
        <mesh position={[0, 0.115, -0.02]}>
          <boxGeometry args={[0.055, 0.035, 0.03]} />
          <meshStandardMaterial color="#0b1220" metalness={0.9} roughness={0.4} />
        </mesh>
        <mesh position={[0, 0.135, -0.02]}>
          <boxGeometry args={[0.05, 0.006, 0.008]} />
          <meshBasicMaterial color="#2fe0ff" toneMapped={false} />
        </mesh>
        <mesh position={[0, 0.115, -0.235]}>
          <boxGeometry args={[0.008, 0.032, 0.012]} />
          <meshBasicMaterial color="#2fe0ff" toneMapped={false} />
        </mesh>
        <mesh position={[0.052, 0.02, -0.06]}>
          <boxGeometry args={[0.002, 0.008, 0.34]} />
          <meshBasicMaterial color="#ff2bd6" toneMapped={false} />
        </mesh>
        <mesh position={[-0.052, 0.02, -0.06]}>
          <boxGeometry args={[0.002, 0.008, 0.34]} />
          <meshBasicMaterial color="#ff2bd6" toneMapped={false} />
        </mesh>

        {activeWeapon === 1 && (<>
          <mesh position={[0, 0.034, -0.5]} rotation={[Math.PI / 2, 0, 0]}><cylinderGeometry args={[0.03, 0.03, 0.55, 10]} /><meshStandardMaterial color="#1b1410" metalness={1} roughness={0.25} /></mesh>
          <mesh position={[0, -0.02, -0.33]}><boxGeometry args={[0.1, 0.07, 0.2]} /><meshBasicMaterial color="#ff9a1a" toneMapped={false} /></mesh>

        </>)}
        {activeWeapon === 2 && (<>
          {[-0.04, 0.04].map((x) => (
            <mesh key={x} position={[x, 0.03, -0.55]}><boxGeometry args={[0.02, 0.02, 0.8]} /><meshBasicMaterial color="#7fe9ff" toneMapped={false} /></mesh>
          ))}
          {[-0.3, -0.5, -0.7].map((z) => (
            <mesh key={z} position={[0, 0.03, z]}><torusGeometry args={[0.055, 0.01, 6, 14]} /><meshBasicMaterial color="#ff2bd6" toneMapped={false} /></mesh>
          ))}

        </>)}

        </mesh>

 *  ENEMY
