function EnemyVisual({ type, innerRef, wireRef, coreMatRef }) {
  const def = ENEMY_DEFS[type];
  const geo = () => type === 'brute' ? <boxGeometry args={[def.size, def.size, def.size]} />
    : type === 'wraith' ? <dodecahedronGeometry args={[def.size, 0]} />
    : type === 'titan' ? <icosahedronGeometry args={[def.size, 1]} />
    : <octahedronGeometry args={[def.size, 0]} />;
  return (
    <group ref={innerRef}>
      <mesh>{geo()}<meshStandardMaterial ref={coreMatRef} color="#1a0208" emissive={def.emissive} emissiveIntensity={4.5} metalness={0.4} roughness={0.35} toneMapped={false} /></mesh>
      <mesh ref={wireRef} scale={1.55}>{geo()}<meshBasicMaterial color={def.wire} wireframe transparent opacity={0.42} toneMapped={false} /></mesh>
    </group>
  );
}

function Enemy({ data }) {            // HOST ONLY: real physics + AI
  const bodyRef = useRef(null), innerRef = useRef(null), wireRef = useRef(null), coreMatRef = useRef(null);
  const hp = useRef(data.hp), dead = useRef(false), dying = useRef(0), hitFlash = useRef(0), lastBy = useRef(null);
  const knock = useRef(new THREE.Vector3()), phase = useRef(Math.random() * Math.PI * 2), tClock = useRef(0);
  const def = ENEMY_DEFS[data.type];

  useFrame((state, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30), body = bodyRef.current;
    if (!body) return;
    const W = timeFX.world, wdt = dt * W;          // Time Warp: enemies run on the world clock
    const g = useGame.getState(), t = body.translation();
    const view = { id: data.id, x: t.x, y: t.y, z: t.z, r: def.size * 1.05 + 0.2, t: ENEMY_TYPES.indexOf(data.type), dy: dying.current > 0 ? 1 : 0 };
    enemyView.set(data.id, view);

    if (dying.current > 0) {
      dying.current = Math.min(1, dying.current + dt * 3.2);
      const d = dying.current;
      if (innerRef.current) { innerRef.current.scale.setScalar(1 + d * 0.5); innerRef.current.rotation.x += dt * 22; innerRef.current.rotation.y += dt * 18; }
      if (coreMatRef.current) { coreMatRef.current.emissiveIntensity = 4.5 + d * 8; coreMatRef.current.opacity = 1 - d; coreMatRef.current.transparent = true; }
      if (wireRef.current) { wireRef.current.material.opacity = 0.42 * (1 - d) + 0.9 * d; wireRef.current.scale.setScalar(1.55 + d * 1.2); }
      if (d >= 1 && !dead.current) {
        dead.current = true;
        emitKill({ id: data.id, by: lastBy.current, x: t.x, y: t.y, z: t.z, type: data.type, score: data.score });
        g.removeEnemy(data.id);
      }
      return;
    }
    if (dead.current) return;

    hitFlash.current = Math.max(0, hitFlash.current - dt * 4.2);
    if (coreMatRef.current) {
      coreMatRef.current.emissiveIntensity = 4.5 + hitFlash.current * 6;
      if (hitFlash.current > 0.05) coreMatRef.current.emissive.setRGB(1, 1, 1); else coreMatRef.current.emissive.setStyle(def.emissive);
    }

    const solo = !(window.__mpCount > 1);
    if (solo && g.status !== 'PLAYING') { body.setLinvel({ x: 0, y: 0, z: 0 }, true); return; }

    // nearest live player (local or remote)
    let best = null, bd = Infinity;
    const consider = (id, x, y, z) => { const d = Math.hypot(x - t.x, y - t.y, z - t.z); if (d < bd) { bd = d; best = { id, x, y, z }; } };
    if (playerState.alive) consider('me', playerState.position.x, playerState.position.y, playerState.position.z);
    remoteLive.forEach((p, id) => consider(id, p.x, p.y + 0.7, p.z));

    if (!best) { body.setLinvel({ x: 0, y: 0, z: 0 }, true); }
    else {
      const dx = best.x - t.x, dy = best.y - t.y, dz = best.z - t.z, dist = Math.max(1e-3, bd), inv = 1 / dist, ct = (tClock.current += wdt);
      let wishX = dx * inv, wishY = dy * inv, wishZ = dz * inv, speedMult = 1;
      if (data.type === 'drone') wishY += Math.sin(ct * 4 + phase.current) * 0.35;
      else if (data.type === 'wraith') { const perp = Math.sin(ct * 2.4 + phase.current); wishX += -dz * inv * perp * 0.75; wishZ += dx * inv * perp * 0.75; if (dist < 9) speedMult = 1.35; }
      else if (data.type === 'brute') { if (dist < 8) speedMult = 1.9; wishY += Math.sin(ct * 2.6 + phase.current) * 0.15; }
      knock.current.multiplyScalar(Math.pow(0.86, W));
      const speed = data.speed * speedMult;
      body.setLinvel({ x: (wishX * speed + knock.current.x) * W, y: (wishY * speed + knock.current.y) * W, z: (wishZ * speed + knock.current.z) * W }, true);
      if (innerRef.current) {
        const spin = data.type === 'brute' || data.type === 'titan' ? 0.6 : data.type === 'wraith' ? 3.2 : 2.4;
        innerRef.current.rotation.x += wdt * spin; innerRef.current.rotation.y += wdt * spin * 0.7; innerRef.current.rotation.z += wdt * spin * 0.4;
      }
      if (dist < ENEMY_TOUCH_RADIUS + (def.size - 0.5) * 0.8) {
        if (best.id === 'me') g.damagePlayer(data.damage); else hurtRemote(best.id, data.damage);
        lastBy.current = null; dying.current = 0.01;      // touch-kill: no credit
      }
    }
  });

  useEffect(() => {
    enemyHandlers.set(data.id, (amount, point, by, quiet) => {
      if (dead.current || dying.current > 0) return;
      const mine = by === myId();
      hp.current -= amount; lastBy.current = by; hitFlash.current = 1;
      const src = mine ? playerState.position : (remoteLive.get(by) || point);
      const kx = point.x - src.x, ky = point.y - src.y, kz = point.z - src.z, km = Math.max(0.001, Math.hypot(kx, ky, kz));
      const kb = (def.size > 1.5 ? 0.25 : 1) * Math.min(3, 1 + amount / 20);
      knock.current.x += (kx / km) * 4 * kb; knock.current.y += (ky / km) * 4 * kb + 1.5; knock.current.z += (kz / km) * 4 * kb;
      const g = useGame.getState(), dead_ = hp.current <= 0;
      if (mine && !quiet) { g.addDamageNumber([point.x, point.y + 0.3, point.z], String(Math.round(amount)), '#ffffff'); g.registerHit(dead_); sfx(dead_ ? 'kill' : 'hit'); }
      if (dead_) {
        dying.current = 0.01;
        if (mine) g.addDamageNumber([point.x, point.y + 0.55, point.z], `+${Math.round(data.score)}`, def.wire);
      } else if (!quiet) g.addExplosion([point.x, point.y, point.z], '#ffb020', 0.28, false);
    });
    return () => { enemyHandlers.delete(data.id); enemyView.delete(data.id); };
  }, [data.id]);

  return (
    <RigidBody ref={bodyRef} position={data.position} colliders={false} gravityScale={0} linearDamping={0.35} angularDamping={1} canSleep={false} ccd>
      <BallCollider args={[def.size * 1.05]} />
      <EnemyVisual type={data.type} innerRef={innerRef} wireRef={wireRef} coreMatRef={coreMatRef} />
    </RigidBody>
  );
}

function Ghost({ id, type }) {        // CLIENT: visual only, follows host snapshots
  const g = useRef(null), inner = useRef(null), wire = useRef(null), core = useRef(null), dy = useRef(0);
  const def = ENEMY_DEFS[type];
  useFrame((_, rawDt) => {
    const dt = Math.min(rawDt, 0.05), o = ghostTargets.get(id), r = g.current;
    if (!o || !r) return;
    if (o.fresh) { r.position.set(o.tx, o.ty, o.tz); o.fresh = false; }
    const k = 1 - Math.exp(-18 * dt);
    r.position.x += (o.tx - r.position.x) * k; r.position.y += (o.ty - r.position.y) * k; r.position.z += (o.tz - r.position.z) * k;
    enemyView.set(id, { id, x: r.position.x, y: r.position.y, z: r.position.z, r: def.size * 1.05 + 0.2, t: ENEMY_TYPES.indexOf(type), dy: o.dy });
    const spin = type === 'brute' || type === 'titan' ? 0.6 : type === 'wraith' ? 3.2 : 2.4;
    if (inner.current) { const wd = dt * timeFX.world; inner.current.rotation.x += wd * spin; inner.current.rotation.y += wd * spin * 0.7; }
    o.flash = Math.max(0, (o.flash || 0) - dt * 4.2);
    if (core.current) { core.current.emissiveIntensity = 4.5 + o.flash * 6; if (o.flash > 0.05) core.current.emissive.setRGB(1, 1, 1); else core.current.emissive.setStyle(def.emissive); }
    if (o.dy) {
      dy.current = Math.min(1, dy.current + dt * 3.2);
      if (inner.current) inner.current.scale.setScalar(1 + dy.current * 0.5);
      if (core.current) { core.current.transparent = true; core.current.opacity = 1 - dy.current; }
    }
  });
  useEffect(() => () => { enemyView.delete(id); }, [id]);
  return <group ref={g} position={[0, -100, 0]}><EnemyVisual type={type} innerRef={inner} wireRef={wire} coreMatRef={core} /></group>;
}

function GhostEnemies() {
  const [ids, setIds] = useState([]);
  const key = useRef('');
  useFrame(() => {
    if (safeIsHost()) { if (key.current) { key.current = ''; setIds([]); ghostTargets.clear(); } return; }
    const snap = getState('en') || [], seen = new Set();
    for (const s of snap) {
      seen.add(s[0]);
      let o = ghostTargets.get(s[0]);
      if (!o) { o = { fresh: true, flash: 0 }; ghostTargets.set(s[0], o); }
      o.tx = s[1]; o.ty = s[2]; o.tz = s[3]; o.dy = s[5];
    }
    for (const id of [...ghostTargets.keys()]) if (!seen.has(id)) ghostTargets.delete(id);
    const k = snap.map((s) => s[0] + ':' + s[4]).join(',');
    if (k !== key.current) { key.current = k; setIds(snap.map((s) => [s[0], ENEMY_TYPES[s[4]] || 'drone'])); useGame.setState({ netEnemies: snap.length }); }
  });
  return <group>{ids.map(([id, type]) => <Ghost key={id} id={id} type={type} />)}</group>;
}

/* ==================================================================
 *  ENEMY MANAGER
 * ================================================================== */
function randomEdgeSpawn() {
  const edge = ARENA_HALF - 3;
  const along = (Math.random() * 2 - 1) * (ARENA_HALF - 5);
  const y = 1.6 + Math.random() * 3.2;
  switch (Math.floor(Math.random() * 4)) {
    case 0: return [along, y, -edge];
    case 1: return [along, y, edge];
    case 2: return [-edge, y, along];
    default: return [edge, y, along];
  }
}

function pickEnemyType(wave) {
  const r = Math.random();
  if (wave < 3) return 'drone';
  if (wave < 5) return r < 0.72 ? 'drone' : 'wraith';
  if (wave < 8) return r < 0.5 ? 'drone' : (r < 0.85 ? 'wraith' : 'brute');
  return r < 0.35 ? 'drone' : (r < 0.72 ? 'wraith' : 'brute');
}

function EnemyManager() {
  const enemies = useGame((s) => s.enemies);
  const status = useGame((s) => s.status);
  const players = usePlayersList();
  const spawnAcc = useRef(0), waveAcc = useRef(0), snapAcc = useRef(0);
  const pkKey = useRef(''), seenKill = useRef(null), seenDmg = useRef(null), seenHit = useRef(new Map());
  const wasHost = useRef(false), pruneAcc = useRef(0);
  const prevStatus = useRef('MENU');

  useEffect(() => {
    const prev = prevStatus.current; prevStatus.current = status;
    try { myPlayer()?.setState('live', status === 'PLAYING' || status === 'PAUSED', true); } catch {}
    if (status === 'PLAYING' && (prev === 'MENU' || prev === 'GAME_OVER')) {
      seenDmg.current = null; pkKey.current = '';
      if (safeIsHost() && players.length <= 1) {      // solo host: fresh world
        waveAcc.current = 0; spawnAcc.current = 0.4;
        killLog = []; pkList = []; dmgTotals = {};
        safeSet('kl', []); safeSet('pk', []); safeSet('dmg', {}); safeSet('wave', 1); safeSet('en', [], false);
      }
    }
  }, [status]);

  useFrame((_, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30), g = useGame.getState(), me = myPlayer(), mid = myId(), host = safeIsHost(), wdt = dt * timeFX.world;
    window.__mpCount = players.length;
    const solo = players.length <= 1;

    remoteLive.clear();
    for (const p of players) {
      if (me && p.id === me.id) continue;
      const pos = p.getState('pos');
      if (pos && p.getState('live') && !p.getState('dead')) remoteLive.set(p.id, pos);
    }

    // damage dealt to me by host-owned enemies
    const tot = (getState('dmg') || {})[mid] || 0;
    if (seenDmg.current === null || tot < seenDmg.current) seenDmg.current = tot;
    else if (tot > seenDmg.current) { const d = tot - seenDmg.current; seenDmg.current = tot; if (!host) g.damagePlayer(d); }

    // kill events (explosions + credit), never replayed on join
    const kl = getState('kl') || [];
    if (seenKill.current === null) seenKill.current = kl.length ? kl[kl.length - 1].n : 0;
    for (const e of kl) {
      if (e.n <= seenKill.current) continue;
      seenKill.current = e.n;
      if (!host && ENEMY_DEFS[e.type]) { g.addExplosion([e.x, e.y, e.z], ENEMY_DEFS[e.type].emissive, 1.2, true); sfx('boom'); handleKill(e, mid); }
    }

    // shared wave number + shared pickups
    if (!host) { const w = getState('wave'); if (w && w !== g.wave) useGame.setState({ wave: w }); }
    const collected = new Set();
    players.forEach((p) => (p.getState('pickups') || []).forEach((k) => collected.add(k)));
    window.collectedPickups = collected;
    const pk = getState('pk') || [], k = pk.map((p) => p.id).join(',');
    if (k !== pkKey.current) { pkKey.current = k; useGame.setState({ pickups: pk.map((p) => ({ id: p.id, ph: p.ph, position: [p.x, p.y, p.z], type: p.type })) }); }

    if (!host) { wasHost.current = false; return; }
    if (!wasHost.current) {          // just became host (or the old host left): adopt shared state so counters/ids stay monotonic
      wasHost.current = true;
      const kl0 = getState('kl'); if (Array.isArray(kl0) && kl0.length) { killLog = kl0.slice(-12); killSeq = Math.max(killSeq, ...kl0.map((e) => e.n || 0)); }
      const pk0 = getState('pk'); if (Array.isArray(pk0)) pkList = pk0.slice(-20);
    }

    // apply hits sent by other players (history present at first sight is skipped, never replayed)
    for (const p of players) {
      if (me && p.id === me.id) continue;
      const hits = p.getState('hits') || [];
      if (!seenHit.current.has(p.id)) { seenHit.current.set(p.id, hits.length ? hits[hits.length - 1].n : 0); continue; }
      const seen = seenHit.current.get(p.id);
      for (const h of hits) if (h.n > seen) enemyHandlers.get(h.id)?.(h.d, { x: h.x, y: h.y, z: h.z }, p.id, false);
      if (hits.length) seenHit.current.set(p.id, Math.max(seen, hits[hits.length - 1].n));
    }

    const meLive = g.status === 'PLAYING' || g.status === 'PAUSED';
    const active = (meLive || remoteLive.size > 0) && !(solo && g.status !== 'PLAYING');
    if (active) {
      const pc = Math.max(1, remoteLive.size + (meLive ? 1 : 0));
      waveAcc.current += wdt;            // wave + spawn timers run on the world clock, so Time Warp pauses the pressure too
      if (waveAcc.current >= WAVE_DURATION) {
        waveAcc.current -= WAVE_DURATION; g.nextWave();
        const w = useGame.getState().wave; safeSet('wave', w); sfx('wave');
        if (w % 5 === 0) g.spawnEnemy(randomEdgeSpawn(), 'titan', enemyStats('titan', w));   // boss wave
        supplyDrop();                                                                       // every wave: a power-up + health crate
      }
      spawnAcc.current += wdt;
      const wv = useGame.getState().wave;
      const interval = Math.max(SPAWN_MIN_INTERVAL, 1.5 - (wv - 1) * 0.075) / (1 + 0.4 * (pc - 1));
      const maxAlive = Math.min(MAX_ENEMIES + 8 * (pc - 1), 6 + Math.floor((wv - 1) * 1.5) + 4 * (pc - 1));
      if (spawnAcc.current >= interval) {
        spawnAcc.current = 0;
        if (useGame.getState().enemies.length < maxAlive) { const type = pickEnemyType(wv); g.spawnEnemy(randomEdgeSpawn(), type, enemyStats(type, wv)); }
      }
    }

    pruneAcc.current += dt;            // expire old loot and anything already collected
    if (pruneAcc.current >= 1) {
      pruneAcc.current = 0;
      const now = Date.now();
      const keep = pkList.filter((p) => !collected.has(p.id) && now - (p.born || now) < (PICKUP_TTL[p.type] || 20) * 1000);
      if (keep.length !== pkList.length) { pkList = keep; safeSet('pk', pkList); }
    }

    snapAcc.current += dt;
    if (snapAcc.current >= 0.066) {
      snapAcc.current = 0;
      const snap = [];
      enemyView.forEach((v) => snap.push([v.id, +v.x.toFixed(2), +v.y.toFixed(2), +v.z.toFixed(2), v.t, v.dy ? 1 : 0]));
      safeSet('en', snap, false);
    }
  });

  return <group>{enemies.map((e) => <Enemy key={e.id} data={e} />)}<GhostEnemies /></group>;
}

/* ==================================================================
 *  PICKUPS
 * ================================================================== */
function Pickup({ data }) {
  const groupRef = useRef(null), spinRef = useRef(null);
  const collected = useRef(false), tAcc = useRef(Math.random() * 6);
  const pos = useRef({ x: data.position[0], y: data.position[1], z: data.position[2] });
  const def = PICKUP_DEFS[data.type] || PICKUP_DEFS.ammo, power = !!def.power;

  useFrame((state, rawDt) => {
    if (collected.current) return;

    if (window.collectedPickups?.has(data.id)) {
      collected.current = true;
      useGame.getState().removePickup(data.id);
      return;
    }

    const dt = Math.min(rawDt, 0.05);
    tAcc.current += dt * timeFX.world;                 // loot drifts on the world clock too
    const t = tAcc.current, P = pos.current;
    const live = playerState.alive && useGame.getState().status === 'PLAYING';   // dead / menu players can't grab loot
    const dx = playerState.position.x - P.x, dy = playerState.position.y - P.y, dz = playerState.position.z - P.z;
    const d2 = dx * dx + dy * dy + dz * dz;

    if (live) {                                        // magnet: loot slides toward you, faster the closer you are
      const mag = playerState.magnet;
      if (d2 < mag * mag && d2 > 1e-4) {
        const d = Math.sqrt(d2), k = 1 - d / mag, step = Math.min(d, (5 + 26 * k * k) * dt);
        P.x += (dx / d) * step; P.y += (dy / d) * step; P.z += (dz / d) * step;
      }
    }
    if (groupRef.current) groupRef.current.position.set(P.x, P.y + Math.sin(t * 3 + (data.ph || 0)) * 0.14, P.z);
    if (spinRef.current) { spinRef.current.rotation.y = t * 1.8; spinRef.current.rotation.x = Math.sin(t * 1.3) * 0.4; }

    if (live && d2 < 1.5 * 1.5) {
      collected.current = true;
      const me = myPlayer();
      if (me) me.setState('pickups', [...(me.getState('pickups') || []).slice(-60), data.id], true);
      applyPickup(data.type);
      const g = useGame.getState();
      g.addExplosion([P.x, P.y, P.z], def.color, power ? 0.9 : 0.5, power);
      g.removePickup(data.id);
    }
  });

  return (
    <group ref={groupRef} position={data.position}>
      <group ref={spinRef}>
        <mesh scale={power ? 1.45 : 1}>
          {power ? <icosahedronGeometry args={[0.32, 0]} /> : <octahedronGeometry args={[0.32, 0]} />}
          <meshBasicMaterial color={def.color} toneMapped={false} />
        </mesh>
        <mesh scale={power ? 2.0 : 1.4}>
          {power ? <icosahedronGeometry args={[0.32, 0]} /> : <octahedronGeometry args={[0.32, 0]} />}
          <meshBasicMaterial color={def.wire} wireframe toneMapped={false} transparent opacity={0.9} />
        </mesh>
      </group>
      {power && (
        <>
          <mesh rotation={[Math.PI / 2, 0, 0]}><torusGeometry args={[0.85, 0.025, 6, 28]} /><meshBasicMaterial color={def.color} transparent opacity={0.8} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
          <mesh position={[0, 3, 0]}><cylinderGeometry args={[0.04, 0.04, 6, 6]} /><meshBasicMaterial color={def.color} transparent opacity={0.35} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
        </>
      )}
    </group>
  );
}

function PickupField() {
  const pickups = useGame((s) => s.pickups);
  return <group>{pickups.map((p) => <Pickup key={p.id} data={p} />)}</group>;
}

/* ==================================================================
 *  DAMAGE NUMBERS
 * ================================================================== */
const damageTexCache = new Map();
function getDamageTexture(text, color) {
  const key = text + '|' + color;
  if (damageTexCache.has(key)) return damageTexCache.get(key);
  const canvas = document.createElement('canvas');
  canvas.width = 256;
  canvas.height = 96;
  const ctx = canvas.getContext('2d');
  ctx.clearRect(0, 0, 256, 96);
  ctx.font = '900 60px "Orbitron", "Segoe UI", sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.shadowColor = color;
  ctx.shadowBlur = 22;
  ctx.fillStyle = color;
  ctx.fillText(text, 128, 48);
  ctx.fillText(text, 128, 48);
  const tex = new THREE.CanvasTexture(canvas);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.minFilter = THREE.LinearFilter;
  tex.magFilter = THREE.LinearFilter;
  damageTexCache.set(key, tex);
  return tex;
}

const DAMAGE_LIFETIME = 0.85;

function DamageNumber({ data }) {
  const ref = useRef(null);
  const life = useRef(0);
  const remove = useGame((s) => s.removeDamageNumber);
  const tex = useMemo(() => getDamageTexture(data.text, data.color), [data.text, data.color]);
  const velY = useRef(1.4 + Math.random() * 0.5);
  const velX = useRef((Math.random() - 0.5) * 0.6);

  useFrame((_, dt) => {
    life.current += dt;
    const t = life.current / DAMAGE_LIFETIME;
    if (ref.current) {
      ref.current.position.x = data.position[0] + velX.current * life.current;
      ref.current.position.y = data.position[1] + velY.current * life.current - 0.4 * life.current * life.current;
      ref.current.position.z = data.position[2];
      ref.current.material.opacity = Math.max(0, 1 - t * t);
      const s = 1 + (1 - Math.min(1, t * 2)) * 0.3;
      ref.current.scale.set(s * 1.2, s * 0.45, 1);
    }
    if (t >= 1) remove(data.id);
  });

  return (
    <sprite ref={ref} position={data.position} renderOrder={100}>
      <spriteMaterial
        map={tex}
        transparent
        depthWrite={false}
        depthTest={false}
        toneMapped={false}
        blending={THREE.AdditiveBlending}
      />
    </sprite>
  );
}

function DamageNumbers() {
  const numbers = useGame((s) => s.damageNumbers);
  return <group>{numbers.map((n) => <DamageNumber key={n.id} data={n} />)}</group>;
}

/* ==================================================================
 *  PROJECTILES / VFX
 * ================================================================== */
const TRACER_LIFE = 0.11;
const EXPLOSION_LIFE = 0.5;

function Tracer({ data }) {
  const coreRef = useRef(null);
  const glowRef = useRef(null);
  const life = useRef(0);
  const removeTracer = useGame((s) => s.removeTracer);
  const segs = useMemo(() => {
    if (!data.beam) return null;
    const a = new THREE.Vector3().fromArray(data.from), b = new THREE.Vector3().fromArray(data.to);
    const d = new THREE.Vector3().subVectors(b, a); const L = Math.max(0.1, d.length()); d.normalize();
    const up = Math.abs(d.y) > 0.95 ? new THREE.Vector3(1, 0, 0) : new THREE.Vector3(0, 1, 0);
    const p1 = new THREE.Vector3().crossVectors(d, up).normalize(), p2 = new THREE.Vector3().crossVectors(d, p1);
    const N = Math.max(6, Math.min(22, Math.round(L / 2.5)));
    const pts = [];
    for (let i = 0; i <= N; i++) {
      const env = Math.sin(Math.PI * i / N) * 0.32;
      pts.push(a.clone().addScaledVector(d, L * i / N).addScaledVector(p1, (Math.random() - 0.5) * 2 * env).addScaledVector(p2, (Math.random() - 0.5) * 2 * env));
    }
    return pts.slice(1).map((p, i) => {
      const q0 = pts[i], v = new THREE.Vector3().subVectors(p, q0);
      return { mid: q0.clone().add(p).multiplyScalar(0.5), len: Math.max(0.01, v.length()),
               quat: new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), v.normalize()) };
    });
  }, [data]);

  const { mid, quat, length } = useMemo(() => {
    const from = new THREE.Vector3(data.from[0], data.from[1], data.from[2]);
    const to = new THREE.Vector3(data.to[0], data.to[1], data.to[2]);
    const dir = new THREE.Vector3().subVectors(to, from);
    const len = Math.max(0.01, dir.length());
    const midpoint = new THREE.Vector3().addVectors(from, to).multiplyScalar(0.5);
    const q = new THREE.Quaternion().setFromUnitVectors(new THREE.Vector3(0, 0, 1), dir.normalize());
    return { mid: midpoint, quat: q, length: len };
  }, [data]);

  useFrame((_, dt) => {
    life.current += dt;
    const k = Math.max(0, 1 - life.current / TRACER_LIFE);
    if (coreRef.current) coreRef.current.material.opacity = k;
    if (glowRef.current) {
      glowRef.current.material.opacity = k * 0.55;
      const s = 1 + (1 - k) * 2.2;
      glowRef.current.scale.set(s, s, 1);
    }
    if (life.current >= (data.beam ? 0.07 : TRACER_LIFE)) removeTracer(data.id);
  });

  if (segs) return (
    <group>
      {segs.map((s, i) => (
        <group key={i} position={s.mid} quaternion={s.quat}>
          <mesh frustumCulled={false}><boxGeometry args={[0.035, 0.035, s.len]} /><meshBasicMaterial color="#ffffff" toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
          <mesh frustumCulled={false}><boxGeometry args={[0.15, 0.15, s.len]} /><meshBasicMaterial color={data.hot ? '#ffb020' : '#5ce6ff'} transparent opacity={0.45} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} /></mesh>
        </group>
      ))}
    </group>
  );
  return (
    <group position={mid} quaternion={quat}>
      <mesh ref={coreRef} frustumCulled={false}>
        <boxGeometry args={[0.03, 0.03, length]} />
        <meshBasicMaterial color="#ffffff" transparent opacity={1} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
      <mesh ref={glowRef} frustumCulled={false}>
        <boxGeometry args={[0.09, 0.09, length]} />
        <meshBasicMaterial color={data.hot ? '#ffb020' : '#5ce6ff'} transparent opacity={0.55} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
    </group>
  );
}

function Explosion({ data }) {
  const shellRef = useRef(null);
  const ringRef = useRef(null);
  const life = useRef(0);
  const removeExplosion = useGame((s) => s.removeExplosion);

  useFrame((_, dt) => {
    life.current += dt;
    const t = Math.min(1, life.current / EXPLOSION_LIFE);
    const fade = 1 - t;
    if (shellRef.current) {
      shellRef.current.scale.setScalar(data.size * (0.35 + t * 2.2));
      shellRef.current.material.opacity = fade * fade * 0.95;
    }
    if (ringRef.current) {
      const rs = data.size * (0.4 + t * 3.6);
      ringRef.current.scale.set(rs, 1, rs);
      ringRef.current.material.opacity = fade * 0.9;
    }
    if (t >= 1) removeExplosion(data.id);
  });

  return (
    <group position={data.position}>
      <mesh ref={shellRef}>
        <icosahedronGeometry args={[1, 0]} />
        <meshBasicMaterial color={data.color} wireframe transparent opacity={0.95} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
      </mesh>
      {data.ring && (
        <mesh ref={ringRef} rotation={[-Math.PI / 2, 0, 0]}>
          <torusGeometry args={[1, 0.055, 6, 24]} />
          <meshBasicMaterial color={data.color} transparent opacity={0.9} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
        </mesh>
      )}
    </group>
  );
}

function Projectiles() {
  const tracers = useGame((s) => s.tracers);
  const explosions = useGame((s) => s.explosions);
  return (
    <group>
      {tracers.map((t) => <Tracer key={t.id} data={t} />)}
      {explosions.map((e) => <Explosion key={e.id} data={e} />)}
    </group>
  );
}

/* ==================================================================
 *  PERFORMANCE GOVERNOR
 * ================================================================== */
function PerfGovernor({ onFps }) {
  const setDpr = useThree((s) => s.setDpr);
  const scale = useSettings((s) => s.scale);
  const perfRef = useRef({ frames: 0, time: 0, dpr: scale });
  useEffect(() => { perfRef.current.dpr = scale; setDpr(scale); }, [scale]);
  useFrame((_, dt) => {
    const p = perfRef.current; p.frames++; p.time += dt;
    if (p.time < 1.5) return;
    const fps = p.frames / p.time, cap = S().scale;
    onFps && onFps(Math.round(fps));
    if (S().adaptive) {
      if (fps < 42 && p.dpr > 0.7) { p.dpr = Math.max(0.7, p.dpr - 0.2); setDpr(p.dpr); }
      else if (fps > 56 && p.dpr < cap) { p.dpr = Math.min(cap, p.dpr + 0.1); setDpr(p.dpr); }
    }
    p.frames = 0; p.time = 0;
  });
  return null;
}

 *  POST FX

  // Disabled temporarily to avoid the CDN dependency that crashes startup.

/* ==================================================================
 *  UI
 * ================================================================== */
function Crosshair({ ads }) {
  return (
    <div className={'crosshair' + (ads ? ' ads' : '')}>
      <i className="ch t" /><i className="ch b" /><i className="ch l" /><i className="ch r" /><i className="ch dot" />
    </div>
  );
}

function HitMarker({ marker }) {
  return (
    <div key={marker.id} className={'hitmarker' + (marker.kill ? ' kill' : '')}>
      <i style={{ '--x': -1, '--y': -1 }} />
      <i style={{ '--x': 1, '--y': -1 }} />
      <i style={{ '--x': -1, '--y': 1 }} />
      <i style={{ '--x': 1, '--y': 1 }} />
    </div>
  );
}

function useTick(ms) {
  const [, setT] = useState(0);
  useEffect(() => { const id = setInterval(() => setT((t) => (t + 1) % 1000000), ms); return () => clearInterval(id); }, [ms]);
}

function StreakBar() {
  useTick(60);
  const f = Math.max(0, Math.min(1, playerState.comboT / Math.max(0.1, playerState.comboMax)));
  return <div className="tb"><i style={{ width: f * 100 + '%' }} /></div>;
}

function ComboMeter() {
  const combo = useGame((s) => s.combo);
  const tier = useGame((s) => s.comboTier);
  if (combo < 2) return null;
  const st = streakTier(combo);
  const tierClass = tier >= 4 ? 'tier-4' : tier >= 3 ? 'tier-3' : tier >= 2 ? 'tier-2' : '';
  const perk = st.name ? `${st.name} · +${Math.round((st.fire - 1) * 100)}% FIRE RATE` + (st.dmg > 1 ? ` · +${Math.round((st.dmg - 1) * 100)}% DMG` : '') : '';
  return (
    <div key={combo} className={'combo ' + tierClass}>
      ×{tier.toFixed(tier === 1.5 ? 1 : 0)}<span>{combo} STREAK</span>
      {perk && <div className="perk">{perk}</div>}
      <StreakBar />
    </div>
  );
}

function StreakFlash() {
  const flash = useGame((s) => s.streakFlash);
  if (!flash) return null;
  return <div key={flash.id} className="streak-flash">{(streakTier(flash.value).name || 'KILLSTREAK') + ' ×' + flash.value}</div>;
}

function PickupToast() {
  const toast = useGame((s) => s.pickupToast);
  if (!toast) return null;
  const style = toast.color ? { color: toast.color, textShadow: `0 0 14px ${toast.color}` } : undefined;
  return (
    <div key={toast.id} className={'pickup-toast' + (toast.kind === 'ammo' ? ' ammo' : '')} style={style}>
      {toast.label}
    </div>
  );
}

function NotifyBanner() {
  const n = useGame((s) => s.notice);
  if (!n) return null;
  return <div key={n.id} className="notify" style={{ '--nc': n.color }}><b>{n.text}</b><span>{n.sub}</span></div>;
}

function BuffBar() {
  useTick(80);
  const combo = useGame((s) => s.combo);
  const items = [];
  if (buffs.overdrive > 0) items.push({ k: 'od', label: 'OVERDRIVE', c: '#ffb020', v: buffs.overdrive / Math.max(OVERDRIVE_DURATION, buffs.overdrive), t: buffs.overdrive });
  if (buffs.shield > 0) items.push({ k: 'sh', label: 'AEGIS', c: '#4d9bff', v: buffs.shield / SHIELD_DURATION, t: buffs.shield });
  const wr = timeFX.warps.get(myId());
  if (wr > 0) items.push({ k: 'wp', label: 'TIME WARP', c: '#b06bff', v: wr / WARP_DURATION, t: wr });
  const st = streakTier(combo);
  if (st.idx > 0) items.push({ k: 'st', label: st.name, c: st.color, v: playerState.comboT / Math.max(0.1, playerState.comboMax), t: null });
  return (
    <>
      {buffs.overdrive > 0 && <div className="od-overlay" />}
      {items.length > 0 && (
        <div className="buffs">
          {items.map((b) => (
            <div key={b.k} className="buff" style={{ '--bc': b.c }}>
              <div className="bt"><span>{b.label}</span>{b.t !== null && <span>{b.t.toFixed(1)}s</span>}</div>
              <div className="bar"><i style={{ width: Math.max(0, Math.min(1, b.v)) * 100 + '%' }} /></div>
            </div>
          ))}
        </div>
      )}
    </>
  );
}

function WarpOverlay() {
  useTick(100);
  if (!timeFX.warps.size) return null;
  const mine = timeFX.warps.has(myId());
  const owner = [...timeFX.warps.keys()][0];
  return (
    <div className={'warp-overlay' + (mine ? '' : ' slowed')}>
      <div className="wl">{mine ? 'TIME WARP // THE WORLD CRAWLS' : 'TIME DILATION // ' + (timeFX.names.get(owner) || 'PLAYER')}</div>
    </div>
  );
}

function KillFeed() {
  const feed = useGame((s) => s.killFeed);
  if (!feed.length) return null;
  return (
    <div className="kill-feed">
      {feed.map((k) => (
        <div key={k.id} className={'kill-line ' + (k.kfClass || '')}>
          {k.label}
        </div>
      ))}
    </div>
  );
}

function Hud({ fps }) {
  const health = useGame((s) => s.health);
  const maxHealth = useGame((s) => s.maxHealth);
  const shield = useGame((s) => s.shield);
  const activeWeapon = useGame((s) => s.activeWeapon);
  const ammo = useGame((s) => s.ammo);
  const reloading = useGame((s) => s.reloading);
  const ads = useGame((s) => s.ads);
  const score = useGame((s) => s.score);
  const wave = useGame((s) => s.wave);
  const kills = useGame((s) => s.kills);
  const alive = useGame((s) => s.enemies.length || s.netEnemies);
  const hitMarker = useGame((s) => s.hitMarker);
  const damageStamp = useGame((s) => s.damageStamp);
  const startedAt = useGame((s) => s.startedAt);
  const showFps = useSettings((s) => s.fps);

  const wpn = WEAPONS[activeWeapon];

  const [now, setNow] = useState(() => performance.now());
  useEffect(() => {
    const id = setInterval(() => setNow(performance.now()), 250);
    return () => clearInterval(id);
  }, []);

  const elapsed = Math.max(0, (now - startedAt) / 1000);
  const mm = String(Math.floor(elapsed / 60)).padStart(2, '0');
  const ss = String(Math.floor(elapsed % 60)).padStart(2, '0');

  const hpPct = Math.max(0, Math.min(100, (health / maxHealth) * 100));
  const low = health <= 35;

  return (
    <div className="hud">
      <Crosshair ads={ads} />
      {hitMarker && <HitMarker marker={hitMarker} />}
      <ComboMeter />
      <StreakFlash />
      <PickupToast />
      <NotifyBanner />
      <WarpOverlay />
      <BuffBar />
      <KillFeed />
      {showFps && fps > 0 && <div className="fps-meter">{fps} FPS</div>}

      <div className="panel top-right">
        <div className="big">{score.toLocaleString()}</div>
        <div className="row">SCORE</div>
        <div className="row dim">KILLS {kills} · HOSTILES {alive}</div>
      </div>

      <div className="panel top-left" style={{ left: 100 }}>
        <div className="big">{mm}:{ss}</div>
        <div className="row">SURVIVED</div>
      </div>

      <div className={'health' + (low ? ' low' : '')}>
        <div className="label">INTEGRITY{shield > 0 ? <span className="sh">  + AEGIS {Math.ceil(shield)}</span> : null}</div>
        {shield > 0 && <div className="shield"><i style={{ width: Math.min(100, (shield / SHIELD_AMOUNT) * 100) + '%' }} /></div>}
        <div className="track"><div className="fill" style={{ width: hpPct + '%' }} /></div>
        <div className="hpnum">{Math.ceil(health)} / {maxHealth}</div>
      </div>

      <div className="ammo">
        <div className={'num' + (ammo === 0 && buffs.overdrive <= 0 ? ' empty' : '')}>
          {buffs.overdrive > 0 ? '∞' : ammo}<span className="res">/ ∞</span>
        </div>
        {reloading
          ? <div className="reloading">{wpn.beam ? 'RECHARGING…' : 'RELOADING…'}</div>
          : ammo === 0
            ? <div className="reloading warn">PRESS R TO RELOAD</div>
            : <div className="reloading dim">{ads ? 'ADS' : wpn.name}</div>}
      </div>

      {wave > 1 && <div key={wave} className="wave-banner">WAVE {wave}<small>SUPPLY DROP INBOUND</small></div>}
      {damageStamp > 0 && <div key={damageStamp} className="damage-flash" />}
      {low && <div className="low-hp-vignette" />}
    </div>
  );
}

function Menu() {
  const start = () => {
    useGame.getState().startGame();
    requestGamePointerLock();
  };
  return (
    <div className="screen menu">
      <div className="scanlines" />
      <h1 className="title">NEON<span>SWARM</span></h1>
      <p className="tagline">ARENA SURVIVAL PROTOCOL // v7 MULTIPLAYER</p>

      <div className="controls">
        <div><kbd>W A S D</kbd><span>MOVE</span></div>
        <div><kbd>MOUSE</kbd><span>LOOK</span></div>
        <div><kbd>LMB</kbd><span>FIRE</span></div>
        <div><kbd>RMB</kbd><span>AIM DOWN SIGHTS</span></div>
        <div><kbd>SHIFT</kbd><span>SPRINT</span></div>
        <div><kbd>SPACE</kbd><span>JUMP</span></div>
        <div><kbd>E</kbd><span>DASH</span></div>
        <div><kbd>C</kbd><span>SLIDE</span></div>
        <div><kbd>1 2 3</kbd><span>SWITCH WEAPON</span></div>
        <div><kbd>R</kbd><span>RELOAD</span></div>
        <div><kbd>M</kbd><span>MUTE</span></div>
        <div><kbd>ESC</kbd><span>PAUSE</span></div>
      </div>

      <div className="loot">
        <div><b style={{ color: '#ffb020' }}>OVERDRIVE</b><span>2× fire rate, infinite ammo, 10s</span></div>
        <div><b style={{ color: '#b06bff' }}>TIME WARP</b><span>slows the world and rivals, not you</span></div>
        <div><b style={{ color: '#4d9bff' }}>AEGIS</b><span>60-point overshield</span></div>
        <div><b style={{ color: '#ff3355' }}>NOVA</b><span>blast that hits everything near you</span></div>
        <div><b style={{ color: '#35e6ff' }}>STREAKS</b><span>keep killing for fire rate, damage, healing</span></div>
        <div><b style={{ color: '#22ff88' }}>EACH WAVE</b><span>supply drop + permanent upgrades</span></div>
      </div>

      <button className="btn" onClick={start}>INITIALISE</button>
      <button className="btn ghost" onClick={() => useSettings.getState().setS({ settingsOpen: true })}>SETTINGS</button>
      <p className="hint">Invite your friend via the lobby link. Co-Op or Deathmatch.</p>
    </div>
  );
}

function Pause() {
  return (
    <div className="screen pause">
      <div className="scanlines" />
      <h2 className="subtitle">PAUSED</h2>
      <p className="tagline">{window.__mpCount > 1 ? 'CO-OP: THE WORLD KEEPS RUNNING' : 'SIMULATION HALTED'}</p>
      <button className="btn" onClick={() => requestGamePointerLock()}>RESUME</button>
      <button className="btn ghost" onClick={() => useSettings.getState().setS({ settingsOpen: true })}>SETTINGS</button>
      <button className="btn ghost" onClick={() => useGame.getState().backToMenu()}>ABORT TO MENU</button>
    </div>
  );
}

function GameOver() {
  const score = useGame((s) => s.score);
  const kills = useGame((s) => s.kills);
  const wave = useGame((s) => s.wave);
  const startedAt = useGame((s) => s.startedAt);
  const endedAt = useGame((s) => s.endedAt);

  const total = Math.max(0, (endedAt - startedAt) / 1000);
  const mm = String(Math.floor(total / 60)).padStart(2, '0');
  const ss = String(Math.floor(total % 60)).padStart(2, '0');

  const retry = () => {
    useGame.getState().startGame();
    requestGamePointerLock();
  };

  return (
    <div className="screen gameover">
      <div className="scanlines" />
      <h2 className="subtitle red">SYSTEM FAILURE</h2>
      <p className="tagline">ALL VITAL SIGNS LOST</p>

      <div className="scoreboard">
        <div className="stat"><div className="v">{score.toLocaleString()}</div><div className="k">FINAL SCORE</div></div>
        <div className="stat"><div className="v">{kills}</div><div className="k">ELIMINATIONS</div></div>
        <div className="stat"><div className="v">{wave}</div><div className="k">WAVE REACHED</div></div>
        <div className="stat"><div className="v">{mm}:{ss}</div><div className="k">TIME SURVIVED</div></div>
      </div>

      <button className="btn" onClick={retry}>RE-DEPLOY</button>
      <button className="btn ghost" onClick={() => useGame.getState().backToMenu()}>MAIN MENU</button>
    </div>
  );
}

function Settings() {
  const s = useSettings();
  const set = s.setS;
  const slider = (key, min, max, step, fmt) => (
    <>
      <input type="range" min={min} max={max} step={step} value={s[key]} onChange={(e) => set({ [key]: parseFloat(e.target.value) })} />
      <span className="sval">{fmt ? fmt(s[key]) : s[key]}</span>
    </>
  );
  const toggle = (key) => <button className={'tog' + (s[key] ? ' on' : '')} onClick={() => set({ [key]: !s[key] })}>{s[key] ? 'ON' : 'OFF'}</button>;
  const preset = (q) => {
    const P = { LOW: { scale: 0.75, stars: false }, MEDIUM: { scale: 1, stars: true }, HIGH: { scale: 1.25, stars: true }, ULTRA: { scale: 1.5, stars: true } };
    set({ quality: q, ...P[q] });
  };
  const pct = (v) => Math.round(v * 100) + '%';
  return (
    <div className="screen settings">
      <div className="scanlines" />
      <div className="sbox">
        <h2 className="subtitle" style={{ fontSize: 28, margin: 0 }}>SETTINGS</h2>
        <h3>AUDIO</h3>
        <div className="srow"><label>SOUND</label><div><button className={'tog' + (!s.mute ? ' on' : '')} onClick={() => set({ mute: !s.mute })}>{s.mute ? 'MUTED' : 'ON'}</button></div></div>
        <div className="srow"><label>MASTER VOLUME</label><div>{slider('master', 0, 1, 0.05, pct)}</div></div>
        <div className="srow"><label>EFFECTS VOLUME</label><div>{slider('sfx', 0, 1, 0.05, pct)}</div></div>
        <div className="srow"><label>TEST</label><div><button className="chip" onClick={() => { ensureAudio(); sfx('shot0'); }}>SMG</button><button className="chip" onClick={() => { ensureAudio(); sfx('shot1'); }}>SHOTGUN</button><button className="chip" onClick={() => { ensureAudio(); sfx('kill'); }}>KILL</button></div></div>
        <h3>GRAPHICS</h3>
        <div className="srow"><label>QUALITY PRESET</label><div>{['LOW', 'MEDIUM', 'HIGH', 'ULTRA'].map((q) => <button key={q} className={'chip' + (s.quality === q ? ' on' : '')} onClick={() => preset(q)}>{q}</button>)}</div></div>
        <div className="srow"><label>RENDER SCALE</label><div>{slider('scale', 0.5, 2, 0.05, pct)}</div></div>
        <div className="srow"><label>AUTO-LOWER WHEN LAGGING</label><div>{toggle('adaptive')}</div></div>
        <div className="srow"><label>STARFIELD</label><div>{toggle('stars')}</div></div>
        <div className="srow"><label>DAMAGE NUMBERS</label><div>{toggle('dmgNums')}</div></div>
        <div className="srow"><label>FPS COUNTER</label><div>{toggle('fps')}</div></div>
        <h3>GAMEPLAY</h3>
        <div className="srow"><label>FIELD OF VIEW</label><div>{slider('fov', 60, 110, 1, (v) => v + '°')}</div></div>
        <div className="srow"><label>MOUSE SENSITIVITY</label><div>{slider('sens', 0.3, 2.5, 0.05, (v) => v.toFixed(2) + 'x')}</div></div>
        <div className="srow"><label>SCREEN SHAKE</label><div>{slider('shake', 0, 1.5, 0.05, pct)}</div></div>
        <div style={{ textAlign: 'center', marginTop: 20 }}>
          <button className="btn ghost" onClick={() => set({ settingsOpen: false })}>CLOSE</button>
        </div>
      </div>
    </div>
  );
}

function UI({ fps }) {
  const status = useGame((s) => s.status);
  const open = useSettings((s) => s.settingsOpen);
  return (
    <div className="overlay">
      {(status === 'PLAYING' || status === 'PAUSED') && <Hud fps={fps} />}
      {status === 'MENU' && <Menu />}
      {status === 'PAUSED' && <Pause />}
      {status === 'GAME_OVER' && <GameOver />}
      {open && <Settings />}
    </div>
  );
}

/* ==================================================================
 *  GAME (Canvas root)
 * ================================================================== */
function Game() {
  const [fps, setFps] = useState(0);

  return (
    <div className="game-root">
      <Canvas
        dpr={1.25}
        shadows={false}
        gl={{
          antialias: false,
          powerPreference: 'high-performance',
          stencil: false,
          depth: true,
          alpha: false,
        }}
        camera={{ fov: 78, near: 0.05, far: 400, position: [0, 2, 6] }}
        onCreated={({ gl }) => {
          gl.setClearColor('#05060a', 1);
        }}
      >
        <color attach="background" args={['#05060a']} />
        <fog attach="fog" args={['#05060a', 40, 160]} />

        <ambientLight intensity={0.5} color="#8fd8ff" />
        <hemisphereLight args={['#2b8fd8', '#120018', 0.7]} />
        <directionalLight position={[20, 30, 10]} intensity={0.55} color="#9fd8ff" />

        <Projectiles />

      </Canvas>

      <UI fps={fps} />

  );
}

/* ==================================================================
 *  BOOT & MULTIPLAYER INIT
 * ================================================================== */

if (boot) {
  boot.classList.add('hide');
  setTimeout(() => boot.remove(), 600);
}

const root = createRoot(document.getElementById('root'));
insertCoin({ skipLobby: false }).then(() => {
  root.render(<Game />);
}).catch((e) => { console.error(e); root.render(<Game />); });

</script>

window.addEventListener('error', (e) => {
  if (document.querySelector('.err')) return;
  const d = document.createElement('div');
  d.className = 'err';
  d.textContent = 'NEON SWARM failed to start.\n\n' + (e.message || e.error || 'Unknown error') +

  document.body.appendChild(d);
});
</script>
