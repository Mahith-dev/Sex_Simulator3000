<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>NEON SWARM - MULTIPLAYER</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet" />

<style>
:root{
  --cyan:#35e6ff; --cyan-soft:#9df3ff; --magenta:#ff2bd6;
  --red:#ff3355; --amber:#ffb020; --green:#22ff88; --bg:#05060a;
  --font-display:'Orbitron','Segoe UI',system-ui,sans-serif;
  --font-mono:'Share Tech Mono',ui-monospace,monospace;
}
*{box-sizing:border-box}
html,body,#root{height:100%;margin:0;padding:0;overflow:hidden;background:var(--bg)}
body{font-family:var(--font-display);color:#dff6ff;-webkit-font-smoothing:antialiased;overscroll-behavior:none}
canvas{display:block;touch-action:none}
.game-root{position:fixed;inset:0}

#boot{position:fixed;inset:0;z-index:999;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:22px;background:#05060a;color:#9df3ff;font-family:var(--font-mono);letter-spacing:6px;font-size:13px;transition:opacity .5s ease}
#boot.hide{opacity:0;pointer-events:none}
#boot .bar{width:260px;height:3px;background:rgba(53,230,255,.15);overflow:hidden}
#boot .bar i{display:block;height:100%;width:40%;background:var(--cyan);box-shadow:0 0 14px var(--cyan);animation:slide 1.1s ease-in-out infinite}
@keyframes slide{0%{transform:translateX(-110%)}100%{transform:translateX(360%)}}

.overlay{position:fixed;inset:0;pointer-events:none;user-select:none;z-index:10}
.hud{position:absolute;inset:0;pointer-events:none}

.crosshair{position:absolute;left:50%;top:50%;width:40px;height:40px;transform:translate(-50%,-50%);transition:opacity .12s ease, transform .12s ease}
.crosshair.ads{opacity:.4;transform:translate(-50%,-50%) scale(.7)}
.ch{position:absolute;background:var(--cyan-soft);box-shadow:0 0 5px var(--cyan),0 0 12px rgba(53,230,255,.75);transition:all .08s ease}
.ch.t{left:50%;top:0;width:2px;height:10px;transform:translateX(-50%)}
.ch.b{left:50%;bottom:0;width:2px;height:10px;transform:translateX(-50%)}
.ch.l{top:50%;left:0;height:2px;width:10px;transform:translateY(-50%)}
.ch.r{top:50%;right:0;height:2px;width:10px;transform:translateY(-50%)}
.ch.dot{left:50%;top:50%;width:3px;height:3px;border-radius:50%;transform:translate(-50%,-50%);background:#fff}

.hitmarker{position:absolute;left:50%;top:50%;width:44px;height:44px;transform:translate(-50%,-50%);animation:hitpop .28s cubic-bezier(.2,.9,.3,1.4) forwards}
.hitmarker i{position:absolute;left:50%;top:50%;width:3px;height:14px;background:#fff;box-shadow:0 0 8px #fff,0 0 16px var(--cyan);transform:translate(calc(var(--x)*11px - 50%),calc(var(--y)*11px - 50%)) rotate(calc(var(--x)*45deg))}
.hitmarker.kill i{background:var(--red);box-shadow:0 0 12px var(--red),0 0 24px var(--red);width:4px;height:16px}
@keyframes hitpop{0%{opacity:1;scale:1.6}60%{opacity:1;scale:1.05}100%{opacity:0;scale:.95}}

.combo{position:absolute;left:50%;top:calc(50% + 66px);transform:translateX(-50%);font-family:var(--font-display);font-size:22px;font-weight:900;letter-spacing:3px;color:var(--magenta);text-shadow:0 0 18px rgba(255,43,214,.9),0 0 40px rgba(255,43,214,.5);animation:comboin .3s cubic-bezier(.2,.9,.3,1.4)}
.combo span{font-family:var(--font-mono);font-size:11px;letter-spacing:5px;opacity:.7;margin-left:8px;font-weight:400;color:#fff;text-shadow:none}
.combo.tier-2{color:#ffb020;text-shadow:0 0 18px rgba(255,176,32,.9),0 0 40px rgba(255,176,32,.5)}
.combo.tier-3{color:#35e6ff;text-shadow:0 0 18px rgba(53,230,255,.9),0 0 40px rgba(53,230,255,.5)}
.combo.tier-4{color:#ff3355;text-shadow:0 0 22px rgba(255,51,85,.95),0 0 50px rgba(255,51,85,.6);font-size:28px}
@keyframes comboin{0%{opacity:0;transform:translateX(-50%) scale(1.4)}100%{opacity:1;transform:translateX(-50%) scale(1)}}

.streak-flash{position:absolute;left:50%;top:38%;transform:translateX(-50%);font-family:var(--font-display);font-size:52px;font-weight:900;letter-spacing:14px;color:#fff;text-shadow:0 0 30px var(--cyan),0 0 60px var(--magenta);animation:streakin 1.6s ease-out forwards;pointer-events:none;text-align:center}
@keyframes streakin{0%{opacity:0;transform:translateX(-50%) scale(1.6)}15%{opacity:1;transform:translateX(-50%) scale(1)}80%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.95)}}

.kill-feed{position:absolute;right:34px;top:110px;display:flex;flex-direction:column;gap:4px;pointer-events:none;align-items:flex-end}
.kill-line{font-family:var(--font-mono);font-size:12px;letter-spacing:2px;color:var(--cyan-soft);background:rgba(6,16,26,.72);border-left:2px solid var(--cyan);padding:5px 12px;animation:kf-in .35s ease-out;text-shadow:0 0 8px rgba(53,230,255,.6);white-space:nowrap}
.kill-line.wraith{border-color:#b028ff;color:#e0b0ff;text-shadow:0 0 8px rgba(176,40,255,.7)}
.kill-line.brute{border-color:#ff8c00;color:#ffd28a;text-shadow:0 0 8px rgba(255,140,0,.7)}
.kill-line.boss{border-color:#ff3355;color:#ffb0c0;background:rgba(26,6,10,.85);text-shadow:0 0 14px rgba(255,51,85,.9);animation:kf-in .35s ease-out, kf-glow-red .9s ease-out}
.kill-line.multikill{border-color:var(--magenta);color:#ffb0ec;background:rgba(26,6,20,.75);animation:kf-in .35s ease-out, kf-glow .8s ease-out}
@keyframes kf-in{from{opacity:0;transform:translateX(30px)}to{opacity:1;transform:translateX(0)}}
@keyframes kf-glow{0%{box-shadow:0 0 0 rgba(255,43,214,0)}40%{box-shadow:0 0 24px rgba(255,43,214,.9)}100%{box-shadow:0 0 0 rgba(255,43,214,0)}}
@keyframes kf-glow-red{0%{box-shadow:0 0 0 rgba(255,51,85,0)}40%{box-shadow:0 0 26px rgba(255,51,85,1)}100%{box-shadow:0 0 0 rgba(255,51,85,0)}}

.panel{position:absolute;font-family:var(--font-mono)}
.top-left{top:26px;left:34px}
.top-right{top:26px;right:34px;text-align:right}
.panel .big{font-family:var(--font-display);font-size:30px;font-weight:700;letter-spacing:2px;line-height:1;text-shadow:0 0 18px rgba(53,230,255,.65)}
.top-right .big{color:var(--cyan-soft)}
.panel .row{font-size:11px;letter-spacing:4px;opacity:.65;margin-top:6px}
.panel .row.dim{opacity:.42;font-size:10px;letter-spacing:2px}

/* Boss health bar */
.boss-bar{position:absolute;left:50%;top:64px;transform:translateX(-50%);width:min(520px, 70vw);pointer-events:none}
.boss-bar .lbl{font-family:var(--font-display);font-size:12px;font-weight:700;letter-spacing:8px;color:#ff5c78;text-align:center;margin-bottom:6px;text-shadow:0 0 18px rgba(255,51,85,.95)}
.boss-bar .track{height:10px;background:rgba(40,6,12,.85);border:1px solid rgba(255,90,120,.55);overflow:hidden}
.boss-bar .fill{height:100%;background:linear-gradient(90deg,#ff3355,#ff8c00);box-shadow:0 0 22px rgba(255,51,85,.95);transition:width .2s ease-out}

/* Boost indicator */
.boost-row{position:absolute;left:50%;bottom:120px;transform:translateX(-50%);display:flex;gap:12px;pointer-events:none}
.boost-pill{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;padding:5px 14px;background:rgba(6,16,26,.8);border:1px solid currentColor;border-radius:2px;animation:bp-pulse 1s ease-in-out infinite}
.boost-pill.dmg{color:#ffcc22;box-shadow:0 0 14px rgba(255,204,34,.5)}
.boost-pill.spd{color:#ff2bd6;box-shadow:0 0 14px rgba(255,43,214,.5)}
@keyframes bp-pulse{0%,100%{opacity:1}50%{opacity:.55}}

.health{position:absolute;left:34px;bottom:32px;width:280px}
.health .label{font-family:var(--font-mono);font-size:11px;letter-spacing:4px;opacity:.65;margin-bottom:7px}
.health .track{position:relative;height:15px;background:rgba(10,30,45,.72);border:1px solid rgba(80,220,255,.35);transform:skewX(-20deg);overflow:hidden}
.health .fill{height:100%;background:linear-gradient(90deg,#00ffc8,var(--cyan));box-shadow:0 0 18px rgba(53,230,255,.9);transition:width .2s ease-out,background .3s ease}
.health.low .fill{background:linear-gradient(90deg,var(--red),#ff7a3d);box-shadow:0 0 20px rgba(255,51,85,.95)}
.health .hpnum{margin-top:5px;font-family:var(--font-mono);font-size:12px;letter-spacing:2px;opacity:.6}

.ammo{position:absolute;right:34px;bottom:28px;text-align:right}
.ammo .num{font-size:52px;font-weight:900;line-height:1;letter-spacing:1px;text-shadow:0 0 22px rgba(53,230,255,.8);transition:color .15s ease}
.ammo .num.empty{color:var(--red);text-shadow:0 0 22px rgba(255,51,85,.95);animation:num-blink .7s ease-in-out infinite}
@keyframes num-blink{0%,100%{opacity:1}50%{opacity:.35}}
.ammo .res{font-size:17px;font-weight:500;opacity:.5;margin-left:8px}
.ammo .reloading{font-family:var(--font-mono);font-size:12px;letter-spacing:4px;color:var(--amber);margin-top:6px;text-shadow:0 0 14px rgba(255,176,32,.8)}
.ammo .reloading.warn{color:var(--red);text-shadow:0 0 14px rgba(255,51,85,.9);animation:blink .9s ease-in-out infinite}
.ammo .reloading.dim{color:rgba(180,230,255,.45);text-shadow:none}
@keyframes blink{0%,100%{opacity:1}50%{opacity:.25}}

.wpn-slots{position:absolute;right:34px;bottom:105px;display:flex;gap:8px;flex-direction:column;align-items:flex-end}
.wpn-slot{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;padding:4px 12px;background:rgba(6,16,26,.6);border:1px solid rgba(53,230,255,.25);color:rgba(180,230,255,.5)}
.wpn-slot.active{color:var(--cyan-soft);border-color:var(--cyan);box-shadow:0 0 12px rgba(53,230,255,.7);background:rgba(53,230,255,.12)}

.pickup-toast{position:absolute;left:50%;bottom:22%;transform:translateX(-50%);font-family:var(--font-mono);font-size:14px;letter-spacing:4px;color:var(--green);text-shadow:0 0 14px rgba(34,255,136,.9);animation:toastup 1.2s ease-out forwards;pointer-events:none}
.pickup-toast.ammo{color:var(--cyan);text-shadow:0 0 14px rgba(53,230,255,.9)}
.pickup-toast.damage{color:#ffcc22;text-shadow:0 0 14px rgba(255,204,34,.9)}
.pickup-toast.speed{color:#ff2bd6;text-shadow:0 0 14px rgba(255,43,214,.9)}
@keyframes toastup{0%{opacity:0;transform:translate(-50%,20px)}20%{opacity:1;transform:translate(-50%,0)}80%{opacity:1}100%{opacity:0;transform:translate(-50%,-30px)}}

.wave-banner{position:absolute;left:50%;top:22%;transform:translateX(-50%);font-size:42px;font-weight:900;letter-spacing:14px;color:var(--magenta);text-shadow:0 0 26px rgba(255,43,214,.9),0 0 60px rgba(255,43,214,.5);animation:wavein 2.4s ease-out forwards;pointer-events:none;text-align:center}
.wave-banner .sub{display:block;font-size:14px;letter-spacing:8px;margin-top:8px;opacity:.75}
.wave-banner.boss-wave{color:#ff5c78;text-shadow:0 0 30px rgba(255,51,85,1),0 0 70px rgba(255,51,85,.6)}
@keyframes wavein{0%{opacity:0;transform:translateX(-50%) scale(1.4)}15%{opacity:1;transform:translateX(-50%) scale(1)}70%{opacity:1}100%{opacity:0;transform:translateX(-50%) scale(.98)}}

.damage-flash{position:absolute;inset:0;background:radial-gradient(ellipse at center,rgba(255,0,40,0) 30%,rgba(255,0,40,.62) 100%);animation:dmgfade .55s ease-out forwards;pointer-events:none}
@keyframes dmgfade{from{opacity:1}to{opacity:0}}
.low-hp-vignette{position:absolute;inset:0;box-shadow:inset 0 0 190px rgba(255,0,50,.6);animation:pulse 1.15s ease-in-out infinite;pointer-events:none}
@keyframes pulse{0%,100%{opacity:.35}50%{opacity:.85}}

.screen{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:18px;pointer-events:auto;background:radial-gradient(ellipse at 50% 40%,rgba(10,40,70,.55) 0%,rgba(3,5,12,.94) 70%),rgba(3,5,12,.82);backdrop-filter:blur(3px);animation:screenin .35s ease-out}
.screen.soft{background:radial-gradient(ellipse at 50% 40%,rgba(10,40,70,.35) 0%,rgba(3,5,12,.72) 70%),rgba(3,5,12,.55)}
@keyframes screenin{from{opacity:0}to{opacity:1}}
.scanlines{position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(to bottom,rgba(120,220,255,.045) 0px,rgba(120,220,255,.045) 1px,transparent 1px,transparent 3px);mix-blend-mode:overlay}
.title{margin:0;font-size:clamp(42px,8vw,96px);font-weight:900;letter-spacing:12px;color:var(--cyan-soft);text-shadow:0 0 28px rgba(53,230,255,.85),0 0 80px rgba(53,230,255,.45);animation:title-pulse 3.4s ease-in-out infinite}
@keyframes title-pulse{0%,100%{text-shadow:0 0 28px rgba(53,230,255,.85),0 0 80px rgba(53,230,255,.45)}50%{text-shadow:0 0 40px rgba(53,230,255,1),0 0 110px rgba(53,230,255,.7)}}
.title span{color:var(--magenta);text-shadow:0 0 28px rgba(255,43,214,.9),0 0 80px rgba(255,43,214,.5)}
.subtitle{margin:0;font-size:clamp(30px,5vw,58px);font-weight:900;letter-spacing:10px;color:var(--cyan-soft);text-shadow:0 0 26px rgba(53,230,255,.8)}
.subtitle.red{color:#ff5c78;text-shadow:0 0 30px rgba(255,51,85,.95),0 0 80px rgba(255,51,85,.5);animation:glitch 2.6s ease-in-out infinite}
@keyframes glitch{0%,92%,100%{transform:translateX(0)}93%{transform:translateX(-4px)}95%{transform:translateX(5px)}97%{transform:translateX(-2px)}}
.tagline{margin:0;font-family:var(--font-mono);font-size:13px;letter-spacing:6px;opacity:.55;text-transform:uppercase}
.controls{display:grid;grid-template-columns:repeat(2,minmax(220px,1fr));gap:8px 42px;margin:18px 0 10px;padding:20px 34px;border-top:1px solid rgba(53,230,255,.25);border-bottom:1px solid rgba(53,230,255,.25);background:rgba(8,22,36,.4)}
.controls div{display:flex;align-items:center;justify-content:space-between;gap:18px}
.controls kbd{font-family:var(--font-mono);font-size:12px;letter-spacing:1px;padding:4px 10px;border:1px solid rgba(53,230,255,.45);border-radius:3px;background:rgba(53,230,255,.08);color:var(--cyan-soft);white-space:nowrap}
.controls span{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;opacity:.6}
.scoreboard{display:grid;grid-template-columns:repeat(4,minmax(120px,1fr));gap:26px;margin:20px 0 14px;padding:22px 34px;border:1px solid rgba(53,230,255,.22);background:rgba(8,22,36,.45)}
.scoreboard .stat{text-align:center}
.scoreboard .v{font-size:34px;font-weight:900;color:var(--cyan-soft);text-shadow:0 0 22px rgba(53,230,255,.7)}
.scoreboard .k{margin-top:6px;font-family:var(--font-mono);font-size:10px;letter-spacing:3px;opacity:.55}
.btn{pointer-events:auto;cursor:pointer;font-family:var(--font-display);font-size:17px;font-weight:700;letter-spacing:7px;color:var(--cyan-soft);padding:16px 62px;border:1px solid var(--cyan);background:rgba(53,230,255,.07);transition:all .16s ease;text-transform:uppercase}
.btn:hover{background:var(--cyan);color:#04121a;box-shadow:0 0 34px rgba(53,230,255,.85);letter-spacing:9px}
.btn:active{transform:translateY(1px)}
.btn.small{font-size:12px;padding:10px 34px;letter-spacing:4px}
.btn.ghost{font-size:12px;padding:10px 34px;letter-spacing:4px;border-color:rgba(53,230,255,.35);background:transparent;color:rgba(180,235,255,.7)}
.btn.ghost:hover{background:rgba(53,230,255,.14);color:var(--cyan-soft);box-shadow:none;letter-spacing:5px}
.btn-row{display:flex;gap:14px}
.hint{position:absolute;bottom:34px;margin:0;font-family:var(--font-mono);font-size:11px;letter-spacing:3px;opacity:.35}
.err{position:fixed;inset:0;z-index:1000;display:flex;align-items:center;justify-content:center;padding:40px;background:#0a0206;color:#ff8fa3;font-family:var(--font-mono);font-size:13px;line-height:1.7;white-space:pre-wrap;overflow:auto;text-align:center}

.fps-meter{position:absolute;left:34px;top:26px;font-family:var(--font-mono);font-size:10px;letter-spacing:2px;opacity:.35;color:var(--cyan-soft)}

/* ---------- Settings panel ---------- */
.settings-panel{width:min(560px, 88vw);background:rgba(6,16,26,.85);border:1px solid rgba(53,230,255,.35);padding:26px 32px;display:flex;flex-direction:column;gap:16px;box-shadow:0 0 60px rgba(53,230,255,.15)}
.setting-row{display:flex;align-items:center;justify-content:space-between;gap:20px}
.setting-row .lbl{font-family:var(--font-mono);font-size:12px;letter-spacing:3px;color:var(--cyan-soft);opacity:.85}
.setting-row .val{font-family:var(--font-mono);font-size:12px;color:#fff;min-width:70px;text-align:right}
.setting-slider{flex:1;display:flex;align-items:center;gap:14px;min-width:0}
.setting-slider input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:4px;background:rgba(53,230,255,.2);outline:none;cursor:pointer;border-radius:2px}
.setting-slider input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:16px;height:16px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:50%;cursor:pointer}
.setting-slider input[type=range]::-moz-range-thumb{width:16px;height:16px;background:var(--cyan);box-shadow:0 0 10px var(--cyan);border-radius:50%;cursor:pointer;border:none}
.seg{display:flex;gap:0;border:1px solid rgba(53,230,255,.35)}
.seg button{font-family:var(--font-mono);font-size:11px;letter-spacing:3px;padding:7px 14px;background:transparent;color:rgba(180,235,255,.6);border:none;cursor:pointer;border-right:1px solid rgba(53,230,255,.2)}
.seg button:last-child{border-right:none}
.seg button.active{background:var(--cyan);color:#04121a;text-shadow:none}
.seg button:hover:not(.active){background:rgba(53,230,255,.15);color:var(--cyan-soft)}

@media (max-width:760px){
  .controls{grid-template-columns:1fr;gap:6px}
  .scoreboard{grid-template-columns:repeat(2,1fr)}
  .ammo .num{font-size:38px}
  .health{width:190px}
  .kill-feed{top:100px;font-size:10px}
}
</style>

<script type="text/babel" data-type="module" data-presets="react">

import React, { useEffect, useMemo, useRef, useState, Suspense } from 'react';
import { createRoot } from 'react-dom/client';
import { create } from 'zustand';
import * as THREE from 'three';
import { Canvas, useFrame, useThree } from '@react-three/fiber';
import {
  Physics, RigidBody, CuboidCollider, CapsuleCollider, BallCollider, useRapier,
} from '@react-three/rapier';
import { insertCoin, myPlayer, usePlayersList, isHost, getState, setState } from 'playroomkit';

/* ==================================================================
 *  TUNING
 * ================================================================== */
const ARENA_HALF = 64;
const WALL_HEIGHT = 11;
const PLAYER_RADIUS = 0.35;
const PLAYER_HALF_HEIGHT = 0.55;
const PLAYER_EYE_OFFSET = 0.7;
const PLAYER_SPAWN = [0, 1.4, 6];
const GRAVITY = -24;
const WALK_SPEED = 8.5;
const SPRINT_MULT = 1.55;
const ADS_SPEED_MULT = 0.5;
const JUMP_VELOCITY = 8.2;
const RELOAD_TIME = 1.35;
const ENEMY_TOUCH_RADIUS = 1.35;
const WAVE_DURATION = 22;
const COMBO_TIMEOUT = 3.2;
const SNAPSHOT_HZ = 12;             // host publishes enemy state this often
const SNAPSHOT_INTERVAL = 1 / SNAPSHOT_HZ;

function enemyStats(type, wave) {
  const base = ENEMY_DEFS[type];
  const hpMult = type === 'boss' ? 1 + (wave - 1) * 0.22 : 1 + (wave - 1) * 0.13;
  const hp = Math.round(base.hp * hpMult);
  return {
    hp, maxHp: hp,
    speed: Math.min(14, base.speed * (1 + (wave - 1) * 0.04)),
    damage: base.damage, score: base.score,
  };
}

 *  SETTINGS (persisted to localStorage)

const SETTINGS_KEY = 'neon-swarm-settings-v3';
const DEFAULT_SETTINGS = {
  sensitivity: 1.0,
  fov: 78,
  quality: 'high',
  screenShake: true,
  showFps: true,
};
function loadSettings() {
  try {
    const raw = localStorage.getItem(SETTINGS_KEY);
    return { ...DEFAULT_SETTINGS, ...(raw ? JSON.parse(raw) : {}) };
  } catch { return { ...DEFAULT_SETTINGS }; }
}
function saveSettings(s) {
  try { localStorage.setItem(SETTINGS_KEY, JSON.stringify(s)); } catch {}
}
const useSettings = create((set, get) => ({
  ...loadSettings(),
  update: (patch) => { set(patch); saveSettings(get()); },
}));

const mouse = { left:false, right:false };
const look = { dx:0, dy:0 };
function resetInput() {
  keys.forward = keys.back = keys.left = keys.right = false;
  keys.jump = keys.sprint = keys.dash = keys.slide = keys.slidePress = false;
  mouse.left = mouse.right = false;
  look.dx = look.dy = 0;
}
function requestGamePointerLock(retries = 4) {
  const canvas = document.querySelector('canvas');
  if (!canvas) return;
  const attempt = (remaining) => {
    try {
      const result = canvas.requestPointerLock();
      if (result && typeof result.catch === 'function') {
        result.catch(() => { if (remaining > 0) setTimeout(() => attempt(remaining - 1), 350); });
      }
    } catch {
      if (remaining > 0) setTimeout(() => attempt(remaining - 1), 350);
    }
  };
  attempt(retries);
}

const useGame = create((set, get) => ({
  status: 'MENU',
  health: 100, maxHealth: 100,
  activeWeapon: 0,
  ammo: WEAPONS[0].mag, magSize: WEAPONS[0].mag,
  reloading: false, ads: false,
  score: 0, kills: 0, wave: 1,
  combo: 0, comboTier: 0,
  enemies: [], tracers: [], explosions: [], pickups: [],
  damageNumbers: [], killFeed: [],
  hitMarker: null, damageStamp: 0,
  pickupToast: null, streakFlash: null,
  damageBoostUntil: 0,
  speedBoostUntil: 0,
  bossEnemyId: null,
  startedAt: 0, endedAt: 0,

  startGame: () => {
    clearRegistry(); resetInput();
    const me = myPlayer();
    if (me) {
      me.setState('dmgOut', [], true);
      me.setState('pickupOut', [], true);
      me.setState('lastHit', null, true);
      me.setState('dead', false, true);
    }
    screenFX.shake = 0; screenFX.fovKick = 0;
    set({
      status: 'PLAYING',
      health: 100, activeWeapon: 0, ammo: WEAPONS[0].mag, magSize: WEAPONS[0].mag, reloading: false, ads: false,
      score: 0, kills: 0, wave: 1, combo: 0, comboTier: 0,
      enemies: [], tracers: [], explosions: [], pickups: [],
      damageNumbers: [], killFeed: [],
      hitMarker: null, damageStamp: 0, pickupToast: null, streakFlash: null,
      damageBoostUntil: 0, speedBoostUntil: 0, bossEnemyId: null,
      startedAt: performance.now(), endedAt: 0,
    });
  },

  /* Soft pause: local UI overlay only. Game continues to run. */
  softPause: () => { if (get().status !== 'PLAYING') return; resetInput(); set({ ads: false }); },
  backToMenu: () => {
    clearRegistry(); resetInput();
    set({ status: 'MENU', enemies: [], tracers: [], explosions: [], pickups: [], damageNumbers: [], killFeed: [], ads: false });
  },

  switchWeapon: (index) => set((s) => {
    if (s.activeWeapon === index) return {};
    return { activeWeapon: index, ammo: WEAPONS[index].mag, magSize: WEAPONS[index].mag, reloading: false };
  }),

  damagePlayer: (amount) => {
    const s = get();
    if (s.status !== 'PLAYING' || playerState.invuln) return;
    const health = Math.max(0, s.health - amount);
    set({ health, damageStamp: nextId() });
    addShake(0.16);
    if (health <= 0) {
      set({ status: 'GAME_OVER', endedAt: performance.now(), ads: false });
      const me = myPlayer();
      if (me) me.setState('dead', true, true);
      if (document.pointerLockElement) document.exitPointerLock();
    }
  },

  consumeAmmo: () => set((s) => ({ ammo: Math.max(0, s.ammo - 1) })),
  setReloading: (v) => set({ reloading: v }),
  finishReload: () => set({ ammo: get().magSize, reloading: false }),
  setADS: (v) => set({ ads: v }),
  heal: (amount) => set((s) => ({ health: Math.min(s.maxHealth, s.health + amount) })),
  giveAmmo: (amount) => set((s) => ({ ammo: Math.min(s.magSize, s.ammo + amount) })),
  grantDamageBoost: (dur) => set({ damageBoostUntil: performance.now() + dur * 1000 }),
  grantSpeedBoost: (dur) => set({ speedBoostUntil: performance.now() + dur * 1000 }),

  registerHit: (kill) => set({ hitMarker: { id: nextId(), kill } }),

  registerKill: (basePoints, enemyType) => {
    const s = get();
    const nextCombo = s.combo + 1;
    const tier = comboMultiplier(nextCombo);
    const gained = Math.round(basePoints * tier);
    const def = ENEMY_DEFS[enemyType] || { label: 'HOSTILE', kfClass: '' };
    const feedEntry = {
      id: nextId(),
      label: `${def.label}  ×  ${tier.toFixed(tier === 1.5 ? 1 : 0)}  +${gained}`,
      kfClass: nextCombo >= 5 ? 'multikill' : def.kfClass,
    };
    const feed = [...s.killFeed, feedEntry].slice(-5);
    set({ combo: nextCombo, comboTier: tier, score: s.score + gained, kills: s.kills + 1, killFeed: feed });
    if (nextCombo > 1 && nextCombo % 5 === 0) set({ streakFlash: { id: nextId(), value: nextCombo, tier } });
  },

  resetCombo: () => { if (get().combo !== 0) set({ combo: 0, comboTier: 0 }); },
  nextWave: () => set((s) => ({ wave: s.wave + 1 })),

  /* Host-authoritative enemy list. */
  setEnemies: (list) => set({ enemies: list }),
  spawnEnemy: (enemy) => set((s) => {
    if (s.enemies.some((e) => e.id === enemy.id)) return {};
    return { enemies: [...s.enemies, enemy] };
  }),
  removeEnemy: (id) => set((s) => ({ enemies: s.enemies.filter((e) => e.id !== id) })),

  spawnPickup: (position, type, id) =>
    set((s) => ({ pickups: [...s.pickups, { id: id || 'p' + Math.random().toString(36).slice(2, 8), ph: Math.random() * 6, position, type }] })),
  removePickup: (id) => set((s) => ({ pickups: s.pickups.filter((p) => p.id !== id) })),

  showPickupToast: (label, kind) => set({ pickupToast: { id: nextId(), label, kind } }),

  addTracer: (from, to, beam, color) =>
    set((s) => ({ tracers: [...s.tracers.slice(-60), { id: nextId(), from, to, beam: !!beam, color }] })),
  removeTracer: (id) => set((s) => ({ tracers: s.tracers.filter((t) => t.id !== id) })),

  addExplosion: (position, color, size, ring) =>
    set((s) => ({ explosions: [...s.explosions.slice(-40), { id: nextId(), position, color, size, ring: !!ring }] })),
  removeExplosion: (id) => set((s) => ({ explosions: s.explosions.filter((e) => e.id !== id) })),

  addDamageNumber: (position, text, color) =>
    set((s) => ({ damageNumbers: [...s.damageNumbers.slice(-13), { id: nextId(), position, text, color }] })),
  removeDamageNumber: (id) =>
    set((s) => ({ damageNumbers: s.damageNumbers.filter((d) => d.id !== id) })),
}));

function comboMultiplier(combo) {
  if (combo >= 20) return 4;
  if (combo >= 12) return 3;
  if (combo >= 6) return 2;
  if (combo >= 3) return 1.5;
  return 1;
}

function Wall({ pos, half, index }) {
  const topRef = useRef(null);
  const botRef = useRef(null);
  useFrame((state) => {
    const t = state.clock.elapsedTime;
    if (topRef.current) topRef.current.material.opacity = 0.75 + Math.sin(t * 1.4 + index) * 0.25;
    if (botRef.current) botRef.current.material.opacity = 0.75 + Math.sin(t * 1.1 + index * 0.7) * 0.25;
  });
  return (
    <RigidBody type="fixed" colliders={false} position={pos} friction={0.4}>
      <CuboidCollider args={half} />
      <mesh><boxGeometry args={[half[0] * 2, half[1] * 2, half[2] * 2]} /><meshStandardMaterial color="#070d18" metalness={0.85} roughness={0.35} emissive="#0a2a44" emissiveIntensity={0.6} /></mesh>
      <mesh ref={topRef} position={[0, half[1] - 0.35, 0]}><boxGeometry args={[half[0] * 2 * 0.98, 0.14, half[2] * 2 * 1.06]} /><meshBasicMaterial color="#2fe0ff" toneMapped={false} transparent /></mesh>
      <mesh ref={botRef} position={[0, -half[1] + 0.25, 0]}><boxGeometry args={[half[0] * 2 * 0.98, 0.1, half[2] * 2 * 1.06]} /><meshBasicMaterial color="#ff2bd6" toneMapped={false} transparent /></mesh>
    </RigidBody>
  );
}

function Starfield({ count }) {
  const { positions, colors } = useMemo(() => {
    const pos = new Float32Array(count * 3);
    const col = new Float32Array(count * 3);
    const palette = [new THREE.Color('#35e6ff'), new THREE.Color('#ff2bd6'), new THREE.Color('#ffffff'), new THREE.Color('#b028ff')];
    for (let i = 0; i < count; i++) {
      const r = 150 + Math.random() * 180;
      const theta = Math.random() * Math.PI * 2;
      const phi = Math.acos(Math.random() * 2 - 1);
      pos[i * 3] = r * Math.sin(phi) * Math.cos(theta);
      pos[i * 3 + 1] = Math.abs(r * Math.cos(phi) * 0.6) + 20;
      pos[i * 3 + 2] = r * Math.sin(phi) * Math.sin(theta);
      const c = palette[(Math.random() * palette.length) | 0];
      col[i * 3] = c.r; col[i * 3 + 1] = c.g; col[i * 3 + 2] = c.b;
    }
    return { positions: pos, colors: col };
  }, [count]);
  const ref = useRef(null);
  useFrame((_, dt) => { if (ref.current) ref.current.rotation.y += dt * 0.008; });
  return (
    <points ref={ref}>
      <bufferGeometry>
        <bufferAttribute attach="attributes-position" args={[positions, 3]} />
        <bufferAttribute attach="attributes-color" args={[colors, 3]} />
      </bufferGeometry>
      <pointsMaterial size={0.95} vertexColors transparent opacity={0.9} toneMapped={false} sizeAttenuation depthWrite={false} />
    </points>
  );
}

function FloorPulses() {
  const refs = useRef([]);
  useFrame((state) => {
    const t = state.clock.elapsedTime;
    refs.current.forEach((m, i) => {
      if (!m) return;
      const phase = (t * 0.35 + i * 0.5) % 1;
      const s = 4 + phase * 22;
      m.scale.set(s, 1, s);
      m.material.opacity = (1 - phase) * 0.16;
    });
  });
  return (
    <group position={[0, 0.02, 0]}>
      {[0, 1].map((i) => (
        <mesh key={i} ref={(el) => (refs.current[i] = el)} rotation={[-Math.PI / 2, 0, 0]}>
          <ringGeometry args={[0.98, 1, 32]} />
          <meshBasicMaterial color="#2fe0ff" transparent opacity={0.12} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
        </mesh>
      ))}
    </group>
  );
}

function RemotePlayers() {
  const players = usePlayersList();
  const me = myPlayer();
  return (
    <group>
      {players.map(p => {
        if (p.id === me?.id) return null;
        return <RemotePlayer key={p.id} player={p} />;
      })}
    </group>
  );
}

function RemotePlayer({ player }) {
  const bodyRef = useRef(null);
  const meshRef = useRef(null);

  useFrame(() => {
    const pos = player.getState('pos');
    if (meshRef.current) meshRef.current.visible = !player.getState('dead');
    if (pos && bodyRef.current) {
      const cur = bodyRef.current.translation();
      const nx = THREE.MathUtils.lerp(cur.x, pos.x, 0.4);
      const ny = THREE.MathUtils.lerp(cur.y, pos.y, 0.4);
      const nz = THREE.MathUtils.lerp(cur.z, pos.z, 0.4);
      bodyRef.current.setNextKinematicTranslation({ x: nx, y: ny, z: nz });
    }
  });

  const color = player.getProfile()?.color?.hex || '#ff2bd6';

  return (
    <RigidBody ref={bodyRef} type="kinematicPosition" colliders={false}>
      <mesh ref={meshRef} position={[0, PLAYER_HALF_HEIGHT + PLAYER_RADIUS * 0.5, 0]}>
        <capsuleGeometry args={[PLAYER_RADIUS, PLAYER_HALF_HEIGHT * 2, 4, 12]} />
        <meshStandardMaterial color={color} roughness={0.3} emissive={color} emissiveIntensity={0.35} />
      </mesh>
    </RigidBody>
  );
}

    const c = world.createCharacterController(0.02);
    c.enableAutostep(0.55, 0.3, true);
    c.enableSnapToGround(0.45);
    c.setApplyImpulsesToDynamicBodies(true);
    c.setCharacterMass(78);
    c.setMaxSlopeClimbAngle((52 * Math.PI) / 180);
    c.setMinSlopeSlideAngle((38 * Math.PI) / 180);
    c.setSlideEnabled(true);
    return c;
  }, [world]);

  useEffect(() => () => world.removeCharacterController(controller), [world, controller]);

  useEffect(() => {
    const canvas = gl.domElement;
    const isLocked = () => document.pointerLockElement === canvas;

    const onKeyDown = (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': keys.forward = true; break;
        case 'KeyS': case 'ArrowDown': keys.back = true; break;
        case 'KeyA': case 'ArrowLeft': keys.left = true; break;
        case 'KeyD': case 'ArrowRight': keys.right = true; break;
        case 'Space': keys.jump = true; e.preventDefault(); break;
        case 'ShiftLeft': case 'ShiftRight': keys.sprint = true; break;
        case 'KeyE': keys.dash = true; break;
        case 'KeyC': if (!e.repeat) { keys.slidePress = true; keys.slide = true; } break;
        case 'Digit1': case 'Digit2': case 'Digit3': {
          reloadT.current = 0;
          useGame.getState().switchWeapon(Number(e.code.slice(5)) - 1);
          break;
        }
        case 'KeyR': startReload(); break;
      }
    };
    const onKeyUp = (e) => {
      switch (e.code) {
        case 'KeyW': case 'ArrowUp': keys.forward = false; break;
        case 'KeyS': case 'ArrowDown': keys.back = false; break;
        case 'KeyA': case 'ArrowLeft': keys.left = false; break;
        case 'KeyD': case 'ArrowRight': keys.right = false; break;
        case 'Space': keys.jump = false; break;
        case 'ShiftLeft': case 'ShiftRight': keys.sprint = false; break;
        case 'KeyE': keys.dash = false; break;
        case 'KeyC': keys.slide = false; break;
      }
    };
    const onMouseDown = (e) => {
      if (!isLocked()) return;
      if (e.button === 0) mouse.left = true;
      if (e.button === 2) { mouse.right = true; useGame.getState().setADS(true); }
    };
    const onMouseUp = (e) => {
      if (e.button === 0) mouse.left = false;
      if (e.button === 2) { mouse.right = false; useGame.getState().setADS(false); }
    };
    const onMouseMove = (e) => {
      if (!isLocked()) return;
      if (useGame.getState().status !== 'PLAYING') return;
      look.dx += THREE.MathUtils.clamp(e.movementX, -150, 150);
      look.dy += THREE.MathUtils.clamp(e.movementY, -150, 150);
    };
    const onContextMenu = (e) => e.preventDefault();
    const onPointerLockChange = () => {
      const g = useGame.getState();
      if (!isLocked() && g.status === 'PLAYING') {
        g.softPause();
        mouse.left = false; mouse.right = false;
      }
    };
    const onBlur = () => { resetInput(); };

    document.addEventListener('keydown', onKeyDown);
    document.addEventListener('keyup', onKeyUp);
    canvas.addEventListener('mousedown', onMouseDown);
    window.addEventListener('mouseup', onMouseUp);
    document.addEventListener('mousemove', onMouseMove);
    canvas.addEventListener('contextmenu', onContextMenu);
    document.addEventListener('pointerlockchange', onPointerLockChange);
    window.addEventListener('blur', onBlur);

    return () => {
      document.removeEventListener('keydown', onKeyDown);
      document.removeEventListener('keyup', onKeyUp);
      canvas.removeEventListener('mousedown', onMouseDown);
      window.removeEventListener('mouseup', onMouseUp);
      document.removeEventListener('mousemove', onMouseMove);
      canvas.removeEventListener('contextmenu', onContextMenu);
      document.removeEventListener('pointerlockchange', onPointerLockChange);
      window.removeEventListener('blur', onBlur);
    };
  }, [gl]);

  useEffect(() => {
    const prev = prevStatus.current;
    prevStatus.current = status;
    const freshRun = prev === 'MENU' || prev === 'GAME_OVER';
    if (status !== 'PLAYING' || !freshRun) return;

    yaw.current = 0; pitch.current = 0; camKick.current = 0;
    velX.current = 0; velZ.current = 0; velY.current = 0;
    recoil.current = 0; recoilSide.current = 0; recoilRoll.current = 0;
    adsT.current = 0; flashT.current = 0;
    fireCd.current = 0; dashCd.current = 0; reloadT.current = 0; comboTimer.current = 0;
    reloadPhase.current = 0; chargeGlow.current = 0;
    resetInput();

    const [sx, sy, sz] = PLAYER_SPAWN;
    bodyRef.current?.setTranslation({ x: sx, y: sy, z: sz }, true);
    bodyRef.current?.setNextKinematicTranslation({ x: sx, y: sy, z: sz });
    camera.position.set(sx, sy + PLAYER_EYE_OFFSET, sz);
  }, [status, camera]);

  const startReload = () => {
    const g = useGame.getState();
    if (g.status !== 'PLAYING' || g.reloading || g.ammo >= g.magSize) return;
    g.setReloading(true);
    reloadDur.current = WEAPONS[g.activeWeapon].reload || RELOAD_TIME;
    reloadT.current = reloadDur.current;
    reloadPhase.current = 0;
  };

  /* Ray-sphere intersection against the enemy list — works on both host and client. */
  const raycastEnemies = (origin, dir, maxDist) => {
    let best = null, bestDist = maxDist;
    const list = useGame.getState().enemies;
    for (let i = 0; i < list.length; i++) {
      const e = list[i];
      const dx = e.position[0] - origin.x;
      const dy = e.position[1] - origin.y;
      const dz = e.position[2] - origin.z;
      const proj = dx * dir.x + dy * dir.y + dz * dir.z;
      if (proj < 0 || proj > bestDist) continue;
      const cx = origin.x + dir.x * proj;
      const cy = origin.y + dir.y * proj;
      const cz = origin.z + dir.z * proj;
      const ddx = cx - e.position[0], ddy = cy - e.position[1], ddz = cz - e.position[2];
      const d2 = ddx * ddx + ddy * ddy + ddz * ddz;
      const r = e.size * 1.1;
      if (d2 <= r * r) { bestDist = proj; best = { enemy: e, distance: proj }; }
    }
    return best;
  };

  const fire = () => {
    const g = useGame.getState();
    if (g.status !== 'PLAYING' || g.reloading) return;
    if (g.ammo <= 0) { startReload(); return; }

    const wpn = WEAPONS[g.activeWeapon];
    const vis = WEAPON_VISUALS[g.activeWeapon];
    const now = performance.now() / 1000;
    const timeSinceLast = now - lastFireT.current;
    lastFireT.current = now;

    g.consumeAmmo();

    /* ---- Weapon kick / FX (heavier for shotgun, light for railgun) ---- */
    recoil.current = Math.min(2.2, recoil.current + 0.9 * vis.recoil);
    recoilSide.current = -recoilSide.current + (Math.random() - 0.5) * 0.45 * vis.recoil;
    recoilRoll.current += (Math.random() - 0.5) * 0.35 * vis.recoil;
    camKick.current += 0.012 * vis.recoil;
    flashT.current = 0.07;
    flashVariant.current = Math.random();
    chargeGlow.current = 1;
    screenFX.fovKick = vis.fovKick;
    addShake(vis.shake);

    /* ---- Compute fire origin ---- */
    if (muzzleRef.current) muzzleRef.current.getWorldPosition(_muzzle);
    else _muzzle.copy(camera.position);

    /* ---- Determine damage boost ---- */
    const boostActive = g.damageBoostUntil > performance.now();
    const dmgMult = boostActive ? 2 : 1;

    /* ---- Fire projectiles ---- */
    for (let i = 0; i < wpn.projectiles; i++) {
      _origin.copy(camera.position);
      _dir.set(0, 0, -1).applyQuaternion(camera.quaternion);
      _origin.addScaledVector(_dir, 0.5);

      const spread = THREE.MathUtils.lerp(wpn.spread, wpn.spread * 0.1, adsT.current);
      _dir.x += (Math.random() - 0.5) * spread;
      _dir.y += (Math.random() - 0.5) * spread;
      _dir.z += (Math.random() - 0.5) * spread;
      _dir.normalize();

      /* ---- Cast ray to find wall distance with Rapier ---- */
      let wallDist = wpn.range;
      let wallPoint = null;
      try {
        const hit = world.castRay(new rapier.Ray(_origin, _dir), wpn.range, true, undefined, undefined, colliderRef.current || undefined);
        if (hit) {
          const toi = hit.timeOfImpact !== undefined ? hit.timeOfImpact : hit.toi || 0;
          wallDist = toi;
          wallPoint = _origin.clone().addScaledVector(_dir, toi);
        }
      } catch {}

      /* ---- Enemy raycast ---- */
      if (wpn.beam) {
        // Piercing beam — hit up to 5 enemies along the ray
        let hits = 0;
        const hitsList = [];
        let ox = _origin.clone();
        let remaining = Math.min(wallDist, wpn.range);
        for (let k = 0; k < 5; k++) {
          const eHit = raycastEnemies(ox, _dir, remaining);
          if (!eHit) break;
          const hx = ox.x + _dir.x * eHit.distance;
          const hy = ox.y + _dir.y * eHit.distance;
          const hz = ox.z + _dir.z * eHit.distance;
          const point = new THREE.Vector3(hx, hy, hz);
          hitsList.push({ enemy: eHit.enemy, point });
          g.addDamageNumber([hx, hy + 0.3, hz], String(Math.round(wpn.damage * dmgMult)), '#ffffff');
          useGame.getState().registerHit(false);
          const me = myPlayer();
          if (me) {
            me.setState('dmgOut', [...(me.getState('dmgOut') || []).slice(-30), {
              i: eHit.enemy.id, d: wpn.damage * dmgMult, t: Date.now() + k, p: [hx, hy, hz],
            }], false);
          }
          ox = point.clone().addScaledVector(_dir, 0.5);
          remaining -= eHit.distance + 0.5;
          if (remaining <= 0) break;
        }
        const finalEnd = hitsList.length
          ? hitsList[hitsList.length - 1].point.clone().addScaledVector(_dir, 2)
          : (wallPoint || _origin.clone().addScaledVector(_dir, wpn.range));
        g.addTracer([_muzzle.x, _muzzle.y, _muzzle.z], [finalEnd.x, finalEnd.y, finalEnd.z], true, vis.tracerColor);
      } else {
        const eHit = raycastEnemies(_origin, _dir, wallDist);
        if (eHit) {
          const hx = _origin.x + _dir.x * eHit.distance;
          const hy = _origin.y + _dir.y * eHit.distance;
          const hz = _origin.z + _dir.z * eHit.distance;
          _end.set(hx, hy, hz);
          g.addDamageNumber([hx, hy + 0.3, hz], String(Math.round(wpn.damage * dmgMult)), '#ffffff');
          useGame.getState().registerHit(false);
          g.addExplosion([hx, hy, hz], vis.orange ? '#ffcc44' : '#ffb020', 0.3, false);
          const me = myPlayer();
          if (me) {
            me.setState('dmgOut', [...(me.getState('dmgOut') || []).slice(-30), {
              i: eHit.enemy.id, d: wpn.damage * dmgMult, t: Date.now(), p: [hx, hy, hz],
            }], false);
          }
        } else if (wallPoint) {
          _end.copy(wallPoint);
          g.addExplosion([_end.x, _end.y, _end.z], vis.orange ? '#ffcc44' : '#4fd8ff', 0.22, false);
        } else {
          _end.copy(_origin).addScaledVector(_dir, wpn.range);
        }
        g.addTracer([_muzzle.x, _muzzle.y, _muzzle.z], [_end.x, _end.y, _end.z], false, vis.tracerColor);
      }
    }
  };

  useFrame((state, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30);
    const g = useGame.getState();
    const body = bodyRef.current;
    const collider = colliderRef.current;
    if (!body || !collider) return;

    const playing = g.status === 'PLAYING';
    const me = myPlayer();

    /* --- Handle incoming damage broadcast from other players --- */
    if (me && playing) {
      const hit = me.getState('lastHit');
      if (hit && hit.t !== prevHitTime.current) {
        prevHitTime.current = hit.t;
        g.damagePlayer(hit.damage);
      }
    }

    /* --- Look --- */
    if (playing) {
      const sens = 0.0022 * useSettings.getState().sensitivity * THREE.MathUtils.lerp(1, 0.55, adsT.current);
      yaw.current -= look.dx * sens;
      pitch.current -= look.dy * sens;
      pitch.current = THREE.MathUtils.clamp(pitch.current, -Math.PI / 2 + 0.05, Math.PI / 2 - 0.05);
    } else if (g.status === 'MENU' || g.status === 'GAME_OVER') {
      yaw.current += dt * 0.07;
    }

    swayX.current = THREE.MathUtils.clamp(swayX.current - look.dx * 0.0018, -0.08, 0.08);
    swayY.current = THREE.MathUtils.clamp(swayY.current - look.dy * 0.0018, -0.08, 0.08);
    swayX.current = THREE.MathUtils.damp(swayX.current, 0, 10, dt);
    swayY.current = THREE.MathUtils.damp(swayY.current, 0, 10, dt);
    look.dx = 0; look.dy = 0;

    /* --- Movement input --- */
    let ix = 0, iz = 0;
    if (playing) {
      if (keys.forward) iz -= 1;
      if (keys.back) iz += 1;
      if (keys.left) ix -= 1;
      if (keys.right) ix += 1;
    }
    const mag = Math.hypot(ix, iz);
    if (mag > 0) { ix /= mag; iz /= mag; }

    const sinY = Math.sin(yaw.current);
    const cosY = Math.cos(yaw.current);
    const fwdX = -sinY, fwdZ = -cosY;
    const rgtX = cosY, rgtZ = -sinY;

    /* --- Dash --- */
    dashCd.current = Math.max(0, dashCd.current - dt);
    if (keys.dash && dashCd.current === 0 && playing) {
      dashDX.current = (mag > 0) ? (fwdX * -iz + rgtX * ix) : fwdX;
      dashDZ.current = (mag > 0) ? (fwdZ * -iz + rgtZ * ix) : fwdZ;
      dashT.current = 0.2; dashCd.current = 1.0; slideT.current = 0;
      screenFX.fovKick = 26; addShake(0.32);
      g.addExplosion([camera.position.x, camera.position.y - 0.7, camera.position.z], '#35e6ff', 1.3, true);
    }
    const dashing = dashT.current > 0 && playing;
    playerState.invuln = dashing;
    if (dashing) {
      dashT.current -= dt;
      velX.current = dashDX.current * 40;
      velZ.current = dashDZ.current * 40;
      velY.current = Math.max(velY.current, 0) * 0.5;
    }

    /* --- Speed boost from pickup --- */
    const speedBoost = g.speedBoostUntil > performance.now() ? 1.35 : 1;

    let currentSpeed = WALK_SPEED * (keys.sprint ? SPRINT_MULT : 1) * speedBoost * THREE.MathUtils.lerp(1, ADS_SPEED_MULT, adsT.current);
    let accel = grounded.current ? 15 : 4;

    slideCd.current = Math.max(0, slideCd.current - dt);
    if (keys.slidePress) {
      keys.slidePress = false;
      const hs = Math.hypot(velX.current, velZ.current);
      if (playing && grounded.current && slideT.current <= 0 && slideCd.current <= 0 && hs > 4) {
        slideT.current = 0.9; slideCd.current = 0.5;
        const k = 19 / hs; velX.current *= k; velZ.current *= k;
        screenFX.fovKick = 7; addShake(0.1);
      }
    }
    const sliding = slideT.current > 0 && playing;
    if (sliding) {
      slideT.current -= dt;
      const dec = Math.exp(-1.1 * dt);
      velX.current *= dec; velZ.current *= dec;
      accel = 0;
    }
    duck.current = THREE.MathUtils.damp(duck.current, sliding ? -0.7 : 0, 16, dt);

    const wishX = (fwdX * -iz + rgtX * ix) * currentSpeed;
    const wishZ = (fwdZ * -iz + rgtZ * ix) * currentSpeed;

    if (!dashing) {
      velX.current = THREE.MathUtils.damp(velX.current, wishX, accel, dt);
      velZ.current = THREE.MathUtils.damp(velZ.current, wishZ, accel, dt);
    }

    if (keys.jump && playing) jumpBuffer.current = 0.14;
    jumpBuffer.current = Math.max(0, jumpBuffer.current - dt);

    if (!dashing) velY.current += GRAVITY * dt;
    if (grounded.current && velY.current < 0) velY.current = -1.5;
    if (jumpBuffer.current > 0 && grounded.current) {
      velY.current = JUMP_VELOCITY;
      jumpBuffer.current = 0;
      grounded.current = false;
    }

    controller.computeColliderMovement(collider, {
      x: velX.current * dt,
      y: velY.current * dt,
      z: velZ.current * dt,
    });
    const mv = controller.computedMovement();
    grounded.current = controller.computedGrounded();

    if (grounded.current && !wasGrounded.current && velY.current < -6) {
      addShake(0.1);
      recoil.current = Math.min(1.2, recoil.current + 0.4);
    }
    wasGrounded.current = grounded.current;
    if (grounded.current && velY.current < 0) velY.current = 0;

    const t = body.translation();
    const nx = t.x + mv.x;
    const ny = t.y + mv.y;
    const nz = t.z + mv.z;
    body.setNextKinematicTranslation({ x: nx, y: ny, z: nz });

    const hSpeed = Math.hypot(velX.current, velZ.current);
    const hFactor = Math.min(1, hSpeed / WALK_SPEED);

    bobT.current += grounded.current ? dt * (8 + hFactor * 6) : dt * 2;
    const bobDamp = 1 - adsT.current * 0.8;
    const bobX = Math.sin(bobT.current) * 0.034 * hFactor * bobDamp;
    const bobY = Math.abs(Math.cos(bobT.current)) * 0.045 * hFactor * bobDamp;

    camKick.current = THREE.MathUtils.damp(camKick.current, 0, 9, dt);
    screenFX.shake = THREE.MathUtils.damp(screenFX.shake, 0, 8, dt);
    screenFX.fovKick = THREE.MathUtils.damp(screenFX.fovKick, 0, 14, dt);

    const shakeMag = screenFX.shake;
    const shX = (Math.random() - 0.5) * shakeMag;
    const shY = (Math.random() - 0.5) * shakeMag;
    const shZ = (Math.random() - 0.5) * shakeMag * 0.4;

    const roll = -ix * 0.022 + swayX.current * 0.4 + recoilSide.current * 0.06 + recoilRoll.current * 0.12;
    _euler.set(pitch.current + camKick.current + shY * 0.35, yaw.current + shX * 0.35, roll + shX * 0.5, 'YXZ');
    camera.quaternion.setFromEuler(_euler);
    camera.position.set(nx + shX, ny + PLAYER_EYE_OFFSET + bobY + shY + duck.current, nz + shZ);

    netT.current += dt;
    if (me && playing && netT.current >= 0.05) {
      netT.current = 0;
      me.setState('pos', { x: nx, y: ny, z: nz }, false);
      me.setState('rot', { yaw: yaw.current }, false);
    }

    /* --- FOV: ADS + base setting + kick --- */
    adsT.current = THREE.MathUtils.damp(adsT.current, g.ads ? 1 : 0, 13, dt);
    const baseFov = useSettings.getState().fov;
    const targetFov = THREE.MathUtils.lerp(baseFov, baseFov * 0.7, adsT.current) + screenFX.fovKick;
    if (Math.abs(camera.fov - targetFov) > 0.01) {
      camera.fov = targetFov;
      camera.updateProjectionMatrix();
    }

    playerState.position.copy(camera.position);
    playerState.forward.set(0, 0, -1).applyQuaternion(camera.quaternion);
    playerState.speed = hSpeed;
    playerState.alive = playing;

    /* --- Weapon animation --- */
    recoil.current = THREE.MathUtils.damp(recoil.current, 0, 15, dt);
    recoilSide.current = THREE.MathUtils.damp(recoilSide.current, 0, 12, dt);
    recoilRoll.current = THREE.MathUtils.damp(recoilRoll.current, 0, 11, dt);
    reloadAnim.current = THREE.MathUtils.damp(reloadAnim.current, g.reloading ? 1 : 0, 11, dt);
    chargeGlow.current = THREE.MathUtils.damp(chargeGlow.current, 0, 8, dt);

    if (g.reloading) {
      reloadPhase.current = THREE.MathUtils.clamp(1 - reloadT.current / reloadDur.current, 0, 1);
    } else {
      reloadPhase.current = 0;
    }
    const rp = reloadPhase.current;
    const dipCurve = Math.sin(rp * Math.PI);

    const w = weaponRef.current;
    if (w) {
      w.position.copy(camera.position);
      w.quaternion.copy(camera.quaternion);

      const swing = 1 - adsT.current * 0.85;
      const px = THREE.MathUtils.lerp(HIP_POS.x, ADS_POS.x, adsT.current) + bobX * 0.7 * swing + swayX.current * swing + recoilSide.current * 0.045;
      const py = THREE.MathUtils.lerp(HIP_POS.y, ADS_POS.y, adsT.current) + bobY * 0.7 * swing + swayY.current * swing - dipCurve * 0.24;
      const pz = THREE.MathUtils.lerp(HIP_POS.z, ADS_POS.z, adsT.current) + recoil.current * 0.09;

      w.translateX(px);
      w.translateY(py);
      w.translateZ(pz);

      w.rotateX(recoil.current * 0.42 - dipCurve * 0.55);
      w.rotateZ(-swayX.current * 1.8 - ix * 0.045 + dipCurve * 1.1 + recoilRoll.current * 0.25);
      w.rotateY(recoilSide.current * 0.42 + dipCurve * 0.7);
    }

    if (magRef.current) {
      const out = THREE.MathUtils.clamp(rp * 3, 0, 1);
      const back = THREE.MathUtils.clamp((rp - 0.55) * 3, 0, 1);
      const off = out * (1 - back);
      magRef.current.position.y = -0.115 - off * 0.6;
      magRef.current.position.z = -0.05 - off * 0.05;
      magRef.current.rotation.z = off * 1.4;
    }
    if (chargeRingRef.current) {
      const cg = chargeGlow.current;
      const s = 1 + cg * 0.6;
      chargeRingRef.current.scale.set(s, s, s);
      chargeRingRef.current.material.opacity = cg * 0.9;
    }

    const mz = [-0.47, -0.74, -0.84][g.activeWeapon] ?? -0.47;
    if (muzzleRef.current) muzzleRef.current.position.z = mz;
    if (flashRef.current) flashRef.current.position.z = mz - 0.04;

    /* --- Firing --- */
    fireCd.current -= dt;
    if (playing && mouse.left && !g.reloading && fireCd.current <= 0) {
      const wpn = WEAPONS[g.activeWeapon];
      fire();
      fireCd.current = wpn.interval;
    }
    if (fireCd.current < -1) fireCd.current = 0;

    /* --- Reload --- */
    if (reloadT.current > 0) {
      reloadT.current -= dt;
      if (reloadT.current <= 0) {
        reloadT.current = 0;
        useGame.getState().finishReload();
      }
    }

    /* --- Muzzle flash --- */
    if (flashT.current > 0) {
      flashT.current -= dt;
      const k = Math.max(0, flashT.current / 0.07);
      const vis = WEAPON_VISUALS[g.activeWeapon];
      if (flashRef.current) {
        flashRef.current.visible = true;
        const v = flashVariant.current;
        const base = (0.7 + k * 1.1) * vis.flash;
        flashRef.current.scale.set(base * (0.85 + v * 0.4), base * (0.85 + (1 - v) * 0.4), base);
        flashRef.current.rotation.z = v * Math.PI * 2;
        flashRef.current.material.opacity = k;
        flashRef.current.material.color.setStyle(vis.orange ? '#ffddaa' : '#b6f6ff');
      }
      if (flashLightRef.current) {
        flashLightRef.current.intensity = k * 14 * vis.flash;
        flashLightRef.current.color.setStyle(vis.orange ? '#ffcc66' : '#7fe9ff');
      }
    } else {
      if (flashRef.current) flashRef.current.visible = false;
      if (flashLightRef.current) flashLightRef.current.intensity = 0;
    }

    /* --- Combo decay --- */
    if (playing && g.combo > 0) {

/* ==================================================================
 *  ENEMY
 *
 *  Host path:  Rapier RigidBody + AI, authoritative.
 *  Client path: Visual-only mesh, position lerped from host snapshot.
 * ================================================================== */
function Enemy({ data, isHostPlayer }) {
  if (isHostPlayer) return <HostEnemy data={data} />;
  return <ClientEnemy data={data} />;
}

/* ------- Host-side enemy (owns the physics body + AI) ------- */
function HostEnemy({ data }) {
  const bodyRef = useRef(null);
  const innerRef = useRef(null);
  const wireRef = useRef(null);
  const coreMatRef = useRef(null);
  const hp = useRef(data.hp);
  const dead = useRef(false);
  const dying = useRef(0);
  const hitFlash = useRef(0);
  const knock = useRef(new THREE.Vector3());
  const phase = useRef(Math.random() * Math.PI * 2);
  const def = ENEMY_DEFS[data.type];
  const players = usePlayersList();

  /* Publish current position/hp for this enemy into the shared frame map. */
  useFrame((state, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30);
    const body = bodyRef.current;
    if (!body) return;
    const g = useGame.getState();

    /* ---- Death animation ---- */
    if (dying.current > 0) {
      dying.current = Math.min(1, dying.current + dt * 3.2);
      const d = dying.current;
      if (innerRef.current) {
        innerRef.current.scale.setScalar(1 + d * 0.5);
        innerRef.current.rotation.x += dt * 22;
        innerRef.current.rotation.y += dt * 18;
      }
      if (coreMatRef.current) {
        coreMatRef.current.emissiveIntensity = 4.5 + d * 8;
        coreMatRef.current.opacity = 1 - d;
        coreMatRef.current.transparent = true;
      }
      if (wireRef.current) {
        wireRef.current.material.opacity = 0.42 * (1 - d) + 0.9 * d;
        wireRef.current.scale.setScalar(1.55 + d * 1.2);
      }
      if (d >= 1) {
        dead.current = true;
        const tr = body.translation();
        g.addExplosion([tr.x, tr.y, tr.z], def.emissive, 1.15 * def.size + 0.4, true);
        addShake(0.05 + def.size * 0.05);
        if (killedByMeLocal.current) {
          g.registerKill(data.score, data.type);
          /* drop chance - bosses always drop */
          if (data.type === 'boss' || Math.random() < 0.22) {
            const dropType = Math.random() < 0.35 ? 'health'
              : Math.random() < 0.6 ? 'ammo'
              : Math.random() < 0.5 ? 'damage' : 'speed';
            g.spawnPickup([tr.x, Math.max(0.9, tr.y), tr.z], dropType);
          }
        }
        g.removeEnemy(data.id);
      }
      return;
    }

    if (dead.current) return;

    hitFlash.current = Math.max(0, hitFlash.current - dt * 4.2);
    if (coreMatRef.current) {
      coreMatRef.current.emissiveIntensity = 4.5 + hitFlash.current * 6;
      if (hitFlash.current > 0.05) {
        coreMatRef.current.emissive.setRGB(1, 1, 1);
      } else {
        coreMatRef.current.emissive.setStyle(def.emissive);
      }
    }

    if (g.status !== 'PLAYING') {
      body.setLinvel({ x: 0, y: 0, z: 0 }, true);
      return;
    }

    /* ---- Find nearest live player ---- */
    const t = body.translation();
    let targetX = 0, targetY = 0, targetZ = 0;
    let minDist = Infinity;
    const meId = myPlayer()?.id;
    players.forEach((p) => {
      if (p.getState('dead')) return;
      let pos;
      if (p.id === meId) {
        pos = playerState.position;
      } else {
        pos = p.getState('pos');
      }
      if (!pos) return;
      const d = Math.hypot(pos.x - t.x, pos.y - t.y, pos.z - t.z);
      if (d < minDist) { minDist = d; targetX = pos.x; targetY = pos.y; targetZ = pos.z; }
    });

    if (minDist === Infinity) {
      body.setLinvel({ x: 0, y: 0, z: 0 }, true);
      return;
    }

    const dx = targetX - t.x, dy = targetY - t.y, dz = targetZ - t.z;
    const dist = Math.max(1e-3, minDist);
    const inv = 1 / dist;
    const ct = state.clock.elapsedTime;

    let wishX = dx * inv, wishY = dy * inv, wishZ = dz * inv;
    let speedMult = 1;

    if (data.type === 'drone') {
      wishY += Math.sin(ct * 4 + phase.current) * 0.35;
    } else if (data.type === 'wraith') {
      const perp = Math.sin(ct * 2.4 + phase.current);
      wishX += -dz * inv * perp * 0.75;
      wishZ += dx * inv * perp * 0.75;
      if (dist < 9) speedMult = 1.35;
    } else if (data.type === 'brute') {
      if (dist < 8) speedMult = 1.9;
      wishY += Math.sin(ct * 2.6 + phase.current) * 0.15;
    } else if (data.type === 'boss') {
      wishY += Math.sin(ct * 1.8 + phase.current) * 0.25;
      if (dist < 10) speedMult = 1.6;
    }

    knock.current.multiplyScalar(0.86);
    const speed = data.speed * speedMult;

    body.setLinvel({
      x: wishX * speed + knock.current.x,
      y: wishY * speed + knock.current.y,
      z: wishZ * speed + knock.current.z,
    }, true);

    if (innerRef.current) {
      const spin = data.type === 'brute' ? 0.6 : data.type === 'boss' ? 0.35 : data.type === 'wraith' ? 3.2 : 2.4;
      innerRef.current.rotation.x += dt * spin;
      innerRef.current.rotation.y += dt * spin * 0.7;
      innerRef.current.rotation.z += dt * spin * 0.4;
    }

    /* ---- Contact damage vs. any player ---- */
    if (minDist < ENEMY_TOUCH_RADIUS + (def.size - 0.5) * 0.8) {
      /* If we (host) are the nearest, damage locally; if another player is nearer, the host
         sends them a hit via their lastHit state. */
      const meObj = myPlayer();
      let damageMe = false;
      let closestPlayerId = null;
      let closestD = Infinity;
      players.forEach((p) => {
        if (p.getState('dead')) return;
        const pos = p.id === meId ? playerState.position : p.getState('pos');
        if (!pos) return;
        const d = Math.hypot(pos.x - t.x, pos.y - t.y, pos.z - t.z);
        if (d < closestD) { closestD = d; closestPlayerId = p.id; }
      });
      if (closestPlayerId === meId) {
        g.damagePlayer(data.damage);
      } else {
        /* send a hit to the remote player */
        const remote = players.find((p) => p.id === closestPlayerId);
        if (remote) {
          remote.setState('lastHit', { damage: data.damage, t: Date.now() + Math.random() }, true);
        }
      }
      dying.current = 0.01;
    }
  });

  const killedByMeLocal = useRef(false);

  useEffect(() => {
    const body = bodyRef.current;
    if (!body) return;
    const handle = body.handle;
    const g = useGame.getState();

    enemiesByBody.set(handle, {
      id: data.id,
      takeDamage: (amount, point) => {
        if (dead.current || dying.current > 0) return;
        hp.current -= amount;
        g.addDamageNumber([point.x, point.y + 0.3, point.z], String(Math.round(amount)), '#ffffff');

        const kx = point.x - playerState.position.x;
        const ky = point.y - playerState.position.y;
        const kz = point.z - playerState.position.z;
        const km = Math.max(0.001, Math.hypot(kx, ky, kz));
        knock.current.x += (kx / km) * 4;
        knock.current.y += (ky / km) * 4 + 1.5;
        knock.current.z += (kz / km) * 4;

        hitFlash.current = 1;

        if (hp.current <= 0) {
          dying.current = 0.01;
          killedByMeLocal.current = true;
          g.addDamageNumber([point.x, point.y + 0.55, point.z], `+${Math.round(data.score)}`, def.wire);
        } else {
          g.registerHit(false);
          g.addExplosion([point.x, point.y, point.z], '#ffb020', 0.28, false);
        }
      },
    });
    return () => { enemiesByBody.delete(handle); };
  }, [data.id, data.score, def.wire]);

  const shapeJSX = data.type === 'brute' ? (
    <boxGeometry args={[def.size, def.size, def.size]} />
  ) : data.type === 'wraith' ? (
    <dodecahedronGeometry args={[def.size, 0]} />
  ) : data.type === 'boss' ? (
    <boxGeometry args={[def.size, def.size * 0.8, def.size]} />
  ) : (
    <octahedronGeometry args={[def.size, 0]} />
  );

  return (
    <RigidBody
      ref={bodyRef}
      position={data.position}
      colliders={false}
      gravityScale={0}
      linearDamping={0.35}
      angularDamping={1}
      canSleep={false}
      ccd
    >
      <BallCollider args={[def.size * 1.05]} />
      <group ref={innerRef}>
        <mesh>
          {shapeJSX}
          <meshStandardMaterial ref={coreMatRef} color="#1a0208" emissive={def.emissive} emissiveIntensity={4.5} metalness={0.4} roughness={0.35} toneMapped={false} />
        </mesh>
        <mesh ref={wireRef} scale={1.55}>
          {shapeJSX}
          <meshBasicMaterial color={def.wire} wireframe transparent opacity={0.42} toneMapped={false} />
        </mesh>
        {data.type === 'boss' && (
          <mesh rotation={[Math.PI / 2, 0, 0]} scale={1.9}>
            <torusGeometry args={[def.size, 0.05, 6, 24]} />
            <meshBasicMaterial color="#ff3355" transparent opacity={0.85} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
          </mesh>
        )}
      </group>
    </RigidBody>
  );
}

/* ------- Client-side enemy (visual-only, lerps to snapshot) ------- */
function ClientEnemy({ data }) {
  const groupRef = useRef(null);
  const innerRef = useRef(null);
  const wireRef = useRef(null);
  const coreMatRef = useRef(null);
  const def = ENEMY_DEFS[data.type];
  const targetRef = useRef(new THREE.Vector3(data.position[0], data.position[1], data.position[2]));
  const initRef = useRef(false);
  const hitFlash = useRef(0);
  const lastHp = useRef(data.hp);
  const dead = useRef(false);

  useEffect(() => {
    targetRef.current.set(data.position[0], data.position[1], data.position[2]);
  }, [data.position[0], data.position[1], data.position[2]]);

  useFrame((state, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30);
    const g = useGame.getState();
    if (!groupRef.current) return;

    if (!initRef.current) {
      groupRef.current.position.copy(targetRef.current);
      initRef.current = true;
    }

    /* Lerp visual position toward host's snapshot — smooths out the 12Hz updates. */
    const k = 1 - Math.pow(0.001, dt);
    groupRef.current.position.lerp(targetRef.current, k);

    /* Hit flash when HP drops */
    if (data.hp < lastHp.current) hitFlash.current = 1;
    lastHp.current = data.hp;
    hitFlash.current = Math.max(0, hitFlash.current - dt * 4.2);

    if (coreMatRef.current) {
      coreMatRef.current.emissiveIntensity = 4.5 + hitFlash.current * 6;
      if (hitFlash.current > 0.05) coreMatRef.current.emissive.setRGB(1, 1, 1);
      else coreMatRef.current.emissive.setStyle(def.emissive);
    }

    if (innerRef.current) {
      const spin = data.type === 'brute' ? 0.6 : data.type === 'boss' ? 0.35 : data.type === 'wraith' ? 3.2 : 2.4;
      innerRef.current.rotation.x += dt * spin;
      innerRef.current.rotation.y += dt * spin * 0.7;
      innerRef.current.rotation.z += dt * spin * 0.4;
    }

    /* Local contact damage — since we don't have Rapier for clients, use sphere distance. */
    if (g.status === 'PLAYING' && !playerState.invuln) {
      const p = groupRef.current.position;
      const dx = playerState.position.x - p.x;
      const dy = playerState.position.y - p.y;
      const dz = playerState.position.z - p.z;
      const d = Math.hypot(dx, dy, dz);
      if (d < ENEMY_TOUCH_RADIUS + (def.size - 0.5) * 0.8) {
        /* Host is authoritative for damage, but local pre-check helps responsiveness.
           The host will send us a hit shortly. */
      }
    }
  });

  const shapeJSX = data.type === 'brute' ? (
    <boxGeometry args={[def.size, def.size, def.size]} />
  ) : data.type === 'wraith' ? (
    <dodecahedronGeometry args={[def.size, 0]} />
  ) : data.type === 'boss' ? (
    <boxGeometry args={[def.size, def.size * 0.8, def.size]} />
  ) : (
    <octahedronGeometry args={[def.size, 0]} />
  );

  return (
    <group ref={groupRef} position={data.position}>
      <group ref={innerRef}>
        <mesh>
          {shapeJSX}
          <meshStandardMaterial ref={coreMatRef} color="#1a0208" emissive={def.emissive} emissiveIntensity={4.5} metalness={0.4} roughness={0.35} toneMapped={false} />
        </mesh>
        <mesh ref={wireRef} scale={1.55}>
          {shapeJSX}
          <meshBasicMaterial color={def.wire} wireframe transparent opacity={0.42} toneMapped={false} />
        </mesh>
        {data.type === 'boss' && (
          <mesh rotation={[Math.PI / 2, 0, 0]} scale={1.9}>
            <torusGeometry args={[def.size, 0.05, 6, 24]} />
            <meshBasicMaterial color="#ff3355" transparent opacity={0.85} toneMapped={false} depthWrite={false} blending={THREE.AdditiveBlending} />
          </mesh>
        )}
      </group>
    </group>
  );
}

/* ==================================================================
 *  ENEMY MANAGER
 *
 *  HOST: spawns new enemies, publishes snapshots at 12Hz, applies incoming damage.
 *  CLIENT: mirrors the snapshot into the local store.
 * ================================================================== */
function EnemyManager() {
  const status = useGame((s) => s.status);
  const enemies = useGame((s) => s.enemies);
  const host = useMemo(() => isHost(), []);
  const players = usePlayersList();

  const spawnAcc = useRef(0);
  const waveAcc = useRef(0);
  const publishAcc = useRef(0);
  const lastProcessedDamage = useRef(new Map()); // playerId -> last seen t
  const localBossId = useRef(null);

  useEffect(() => {
    if (status === 'PLAYING') { spawnAcc.current = 0.4; waveAcc.current = 0; publishAcc.current = 0; }
  }, [status]);

  /* Sync bossEnemyId in the store for HUD. */
  useEffect(() => {
    if (!host) return;
    const boss = enemies.find((e) => e.type === 'boss');
    useGame.setState({ bossEnemyId: boss ? boss.id : null });
  }, [enemies, host]);

  useFrame((_, rawDt) => {
    const dt = Math.min(rawDt, 1 / 30);
    const g = useGame.getState();
    if (g.status !== 'PLAYING') return;

    /* ---------- HOST ---------- */
    if (host) {
      waveAcc.current += dt;
      if (waveAcc.current >= WAVE_DURATION) {
        waveAcc.current -= WAVE_DURATION;
        g.nextWave();
      }

      /* ---- Spawn enemies ---- */
      spawnAcc.current += dt;
      const isBossWave = g.wave > 0 && g.wave % 5 === 0;
      const interval = Math.max(SPAWN_MIN_INTERVAL, 1.5 - (g.wave - 1) * 0.075);
      const maxAlive = Math.min(MAX_ENEMIES, 6 + Math.floor((g.wave - 1) * 1.5));

      const bossAlive = g.enemies.some((e) => e.type === 'boss');

      if (spawnAcc.current >= interval) {
        spawnAcc.current = 0;
        const aliveCount = g.enemies.length;
        if (isBossWave && !bossAlive) {
          /* Spawn a boss on boss waves. */
          const stats = enemyStats('boss', g.wave);
          const id = 'boss-' + g.wave + '-' + Math.random().toString(36).slice(2, 6);
          g.spawnEnemy({
            id, type: 'boss',
            position: randomEdgeSpawn(),
            size: ENEMY_DEFS.boss.size,
            ...stats,
          });
          localBossId.current = id;
          /* broadcast boss spawn */
          const q = getState('spawnQueue') || [];
          setState('spawnQueue', [...q.slice(-40), { id, type: 'boss', position: g.enemies.length ? g.enemies[g.enemies.length - 1].position : randomEdgeSpawn(), size: ENEMY_DEFS.boss.size, ...stats }]);
        } else if (aliveCount < maxAlive) {
          const type = pickEnemyType(g.wave);
          const stats = enemyStats(type, g.wave);
          const id = Math.random().toString(36).slice(2, 10);
          const pos = randomEdgeSpawn();
          g.spawnEnemy({
            id, type, position: pos,
            size: ENEMY_DEFS[type].size,
            ...stats,
          });
          const q = getState('spawnQueue') || [];
          setState('spawnQueue', [...q.slice(-40), { id, type, position: pos, size: ENEMY_DEFS[type].size, ...stats }]);
        }
      }

      /* ---- Apply incoming damage from clients ---- */
      players.forEach((p) => {
        if (p.id === myPlayer()?.id) return; // host's own damage is applied directly by the raycast
        const list = p.getState('dmgOut') || [];
        const lastT = lastProcessedDamage.current.get(p.id) || 0;
        list.forEach((d) => {
          if (d.t <= lastT) return;
          lastProcessedDamage.current.set(p.id, d.t);
          /* Apply the damage via the enemy registry. */
          const enemy = g.enemies.find((e) => e.id === d.i);
          if (!enemy) return;
          /* Find the Rapier body for this enemy to route through the registry. */
          for (const [handle, h] of enemiesByBody) {
            if (h.id === d.i) {
              const point = new THREE.Vector3(d.p[0], d.p[1], d.p[2]);
              h.takeDamage(d.d, point);
              break;
            }
          }
        });
      });

      /* ---- Publish snapshot ---- */
      publishAcc.current += dt;
      if (publishAcc.current >= SNAPSHOT_INTERVAL) {
        publishAcc.current = 0;
        const snapshot = g.enemies.map((e) => {
          /* Prefer the authoritative Rapier body position. */
          let px = e.position[0], py = e.position[1], pz = e.position[2];
          for (const [handle, h] of enemiesByBody) {
            if (h.id === e.id) {
              /* The body itself has translation, but the registry is built from
                 the same ref that the Enemy component controls. Pull via Rapier world. */
              break;
            }
          }
          return { i: e.id, t: e.type, p: [px, py, pz], h: e.hp };
        });
        setState('enemySnapshot', snapshot, false);
        setState('wave', g.wave, false);
      }
    } else {
      /* ---------- CLIENT ---------- */
      const snapshot = getState('enemySnapshot');
      const remoteWave = getState('wave');
      if (remoteWave && remoteWave !== g.wave) {
        useGame.setState({ wave: remoteWave });
      }
      if (snapshot) {
        const current = useGame.getState().enemies;
        const map = new Map(current.map((e) => [e.id, e]));
        let changed = false;
        const next = [];
        for (const e of snapshot) {
          const existing = map.get(e.i);
          if (existing) {
            /* Update the position and HP in place so references stay stable. */
            if (existing.position[0] !== e.p[0] || existing.position[1] !== e.p[1] || existing.position[2] !== e.p[2] || existing.hp !== e.h) {
              changed = true;
              existing.position = e.p;
              existing.hp = e.h;
            }
            next.push(existing);
          } else {
            changed = true;
            const def = ENEMY_DEFS[e.t];
            next.push({
              id: e.i, type: e.t, position: e.p, hp: e.h,
              maxHp: def.hp, size: def.size,
              damage: def.damage, score: def.score, speed: def.speed,
            });
          }
        }
        if (next.length !== current.length) changed = true;
        if (changed) useGame.setState({ enemies: next });
      }
    }
  });

  /* ---- Damage queue maintenance for the local player (host reads this) ---- */
  useEffect(() => {
    if (host) return;
    const id = setInterval(() => {
      const me = myPlayer();
      if (!me) return;
      const list = me.getState('dmgOut') || [];
      /* Roll off old entries so the array never grows unbounded. */
      if (list.length > 30) me.setState('dmgOut', list.slice(-30), false);
    }, 2000);
    return () => clearInterval(id);
  }, [host]);

  return (
    <group>
      {enemies.map((e) => <Enemy key={e.id} data={e} isHostPlayer={host} />)}
    </group>
  );
}

function randomEdgeSpawn() {
  const edge = ARENA_HALF - 3;
  const along = (Math.random() * 2 - 1) * (ARENA_HALF - 5);
  const y = 1.6 + Math.random() * 3.2;
  switch (Math.floor(Math.random() * 4)) {
    case 0: return [along, y, -edge];
    case 1: return [along, y, edge];
    case 2: return [-edge, y, along];
    default: return [edge, y, along];
  }
}

function pickEnemyType(wave) {
  const r = Math.random();
  if (wave < 3) return 'drone';
  if (wave < 5) return r < 0.72 ? 'drone' : 'wraith';
  if (wave < 8) return r < 0.5 ? 'drone' : (r < 0.85 ? 'wraith' : 'brute');
  return r < 0.35 ? 'drone' : (r < 0.72 ? 'wraith' : 'brute');
}
